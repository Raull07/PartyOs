<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PartyOS · Liquid Edition</title>
  <!-- Librerías ligeras para QR vectorial y WebSockets en tiempo real -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-base: #05060b;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-bg-strong: rgba(255, 255, 255, 0.10);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-highlight: rgba(255, 255, 255, 0.28);
      --text-primary: #f8fafc;
      --text-secondary: rgba(248, 250, 252, 0.68);
      --text-muted: rgba(248, 250, 252, 0.45);
      --orb-1: #6366f1;
      --orb-2: #ec4899;
      --orb-3: #06b6d4;
      --orb-4: #8b5cf6;
      --accent: #38bdf8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #fb7185;
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-pill: 999px;
      --shadow-glass: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 var(--glass-highlight);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      line-height: 1.45;
    }

    /* Fondo dinámico Apple Liquid Glass */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #05060b 75%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.46;
      transition: background 1.4s ease;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .orb-1 { width: 46vw; height: 46vw; top: -12%; left: -8%; background: var(--orb-1); }
    .orb-2 { width: 42vw; height: 42vw; top: 18%; right: -10%; background: var(--orb-2); animation-delay: -4s; }
    .orb-3 { width: 48vw; height: 48vw; bottom: -16%; left: 15%; background: var(--orb-3); animation-delay: -9s; }
    .orb-4 { width: 34vw; height: 34vw; bottom: 10%; right: 12%; background: var(--orb-4); animation-delay: -13s; }

    @keyframes floatOrb {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(3%, -4%, 0) scale(1.07); }
      100% { transform: translate3d(-3%, 3%, 0) scale(0.96); }
    }

    /* Contenedor principal */
    .shell {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 20px 44px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island HUD */
    .island-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
      position: sticky;
      top: 14px;
      z-index: 50;
    }

    .dynamic-island {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 9px 18px;
      background: rgba(12, 14, 22, 0.78);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: var(--radius-pill);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      flex-wrap: wrap;
      justify-content: center;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      background: var(--warning);
      box-shadow: 0 0 10px var(--warning);
    }

    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 12px var(--success);
    }

    .status-dot.offline {
      background: var(--danger);
      box-shadow: 0 0 12px var(--danger);
    }

    .island-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      color: var(--text-primary);
    }

    /* Tarjetas Liquid Glass */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(30px) saturate(185%);
      -webkit-backdrop-filter: blur(30px) saturate(185%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-glass);
      padding: 28px;
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .glass-subcard {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    /* Tipografía */
    .hero-title {
      font-size: clamp(2.1rem, 4.5vw, 3.6rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .tv-question {
      font-size: clamp(1.7rem, 3.4vw, 2.85rem);
      font-weight: 750;
      letter-spacing: -0.025em;
      line-height: 1.22;
      text-align: center;
      margin: 18px 0;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .muted { color: var(--text-secondary); }
    .small { font-size: 0.86rem; }

    /* Botones Liquid */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 22px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.09);
      color: var(--text-primary);
      font-size: 0.98rem;
      font-weight: 650;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.32);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.85), rgba(99, 102, 241, 0.88));
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.98), rgba(99, 102, 241, 0.98));
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.85), rgba(5, 150, 105, 0.9));
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-danger {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.82), rgba(225, 29, 72, 0.88));
      border-color: rgba(255, 255, 255, 0.28);
    }

    .btn-sm {
      padding: 9px 15px;
      font-size: 0.85rem;
    }

    .btn-block {
      width: 100%;
    }

    /* Inputs */
    .glass-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.32);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .glass-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .code-input {
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-weight: 800;
      font-size: 1.45rem;
      text-align: center;
    }

    /* Grids y layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .grid-games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .game-tile {
      text-align: left;
      padding: 20px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.14);
      cursor: pointer;
      transition: all 0.22s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: var(--text-primary);
    }

    .game-tile:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .game-tile.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.65);
    }

    /* QR Box */
    .qr-wrapper {
      background: #ffffff;
      padding: 14px;
      border-radius: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    .qr-wrapper svg {
      display: block;
      width: 185px;
      height: 185px;
    }

    .room-code-big {
      font-size: clamp(2.4rem, 4.5vw, 3.8rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      padding: 8px 22px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: inline-block;
      margin: 8px 0;
    }

    /* Chips de jugadores */
    .players-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .player-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .player-chip.voted {
      background: rgba(52, 211, 153, 0.18);
      border-color: rgba(52, 211, 153, 0.55);
    }

    /* Avatares */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 10px 0 16px;
    }

    .avatar-btn {
      font-size: 1.55rem;
      padding: 10px 4px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .avatar-btn.selected {
      background: rgba(56, 189, 248, 0.28);
      border-color: var(--accent);
      transform: scale(1.08);
    }

    /* Opciones de votación móvil */
    .vote-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 11px;
      margin-top: 14px;
    }

    .vote-option {
      width: 100%;
      padding: 16px 18px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 650;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .vote-option:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    .vote-option.selected {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(99, 102, 241, 0.38));
      border-color: #7dd3fc;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.28);
    }

    /* Barras de resultados en TV */
    .result-row {
      margin-bottom: 14px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 1.05rem;
    }

    .result-track {
      height: 18px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .result-fill {
      height: 100%;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Carta secreta móvil */
    .secret-box {
      padding: 26px 20px;
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.24);
      text-align: center;
      cursor: pointer;
      user-select: none;
      margin: 14px 0;
    }

    /* Switch Anfitrión */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 16px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin-top: 12px;
      cursor: pointer;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .badge-delicada { background: rgba(250, 204, 21, 0.18); border-color: rgba(250, 204, 21, 0.45); color: #fde047; }
    .badge-cruel { background: rgba(251, 146, 60, 0.2); border-color: rgba(251, 146, 60, 0.5); color: #fdba74; }
    .badge-brutal { background: rgba(244, 63, 94, 0.22); border-color: rgba(244, 63, 94, 0.55); color: #fda4af; }
    .badge-profundo { background: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.5); color: #7dd3fc; }

    /* Vista dividida de prueba solo */
    .split-preview {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .split-preview { grid-template-columns: 1fr; }
      .glass-card { padding: 20px; border-radius: 24px; }
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(20px);
      padding: 11px 20px;
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 999;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>
  <div class="ambient-canvas">

    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <div class="shell">

    <main id="app"></main>
  </div>

    /* =========================================================================
       2. ESTADO GLOBAL Y RED EN TIEMPO REAL (MQTT WSS + BROADCASTCHANNEL)
       ========================================================================= */
    const BROKERS = [
      'wss://broker.emqx.io:8084/mqtt',
      'wss://broker.hivemq.com:8884/mqtt'
    ];
    const TOPIC_PREFIX = 'partyos_raull07_live_v3';

    let viewMode = 'home'; // 'home' | 'tv' | 'mobile_join' | 'mobile_play' | 'solo_test'
    let mqttClient = null;

    let isConnected = false;
    let bc = null;

    // Identidad local del móvil
    let mySession = {
      roomCode: '',

    // Estado autoritativo de la sala (la TV es dueña y fuente de verdad)
    let roomState = null;
    let processedMsgIds = new Set();
    let heartbeatTimer = null;
    let timerInterval = null;

    // Estado UI local para evitar perder el foco de inputs al re-renderizar

    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function uid() {
      return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    function showToast(text) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = text;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    function updateConnectionHUD(online, label) {
      isConnected = online;
      const dot = document.getElementById('connDot');
      const txt = document.getElementById('connText');
      if (dot) {
        dot.className = 'status-dot ' + (online ? 'online' : 'offline');
      }
      if (txt) {
        txt.textContent = label;
      }
    }

    function setAmbientTheme(game) {
      const root = document.documentElement.style;
      const themes = {
        lobby: ['#6366f1', '#ec4899', '#06b6d4', '#8b5cf6'],
        quien: ['#f43f5e', '#fb923c', '#db2777', '#7c3aed'],
        profundo: ['#0284c7', '#38bdf8', '#6366f1', '#0f766e'],
        impostor: ['#dc2626', '#4f46e5', '#1e1b4b', '#be123c'],
        dilemas: ['#2563eb', '#e11d48', '#7c3aed', '#0891b2'],
        yonunca: ['#10b981', '#f59e0b', '#059669', '#6366f1'],
        verdad: ['#8b5cf6', '#ec4899', '#3b82f6', '#f43f5e']
      };
      const palette = themes[game] || themes.lobby;
      root.setProperty('--orb-1', palette[0]);
      root.setProperty('--orb-2', palette[1]);
      root.setProperty('--orb-3', palette[2]);
      root.setProperty('--orb-4', palette[3]);
    }

    /* =========================================================================
       3. CONEXIÓN MQTT + BROADCASTCHANNEL
       ========================================================================= */
    function initNetwork() {
      try {
        bc = new BroadcastChannel(TOPIC_PREFIX);
        bc.onmessage = (ev) => {
          if (ev.data) handleIncomingPacket(ev.data.topic, ev.data.payload);
        };
      } catch (e) {}

      connectMqtt();
    }

    function connectMqtt() {
      if (typeof mqtt === 'undefined') {
        updateConnectionHUD(true, 'Modo Local activo');
        return;
      }
      if (mqttClient) {
        try { mqttClient.end(true); } catch (e) {}
      }

      const url = BROKERS[brokerIndex % BROKERS.length];
      updateConnectionHUD(false, 'Conectando a la nube...');

      const clientId = 'partyos_' + uid();
      mqttClient = mqtt.connect(url, {
        clientId,
        clean: true,
        connectTimeout: 5000,
        reconnectPeriod: 2500
      });

      mqttClient.on('connect', () => {
        updateConnectionHUD(true, 'En vivo · Listo para dispositivos');
        resubscribeActiveTopics();
      });

      mqttClient.on('reconnect', () => {
        updateConnectionHUD(false, 'Reconectando...');
      });

      mqttClient.on('error', () => {
        brokerIndex++;
        updateConnectionHUD(false, 'Cambiando servidor...');
      });

      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          handleIncomingPacket(topic, data);
        } catch (e) {}
      });
    }

    function resubscribeActiveTopics() {
      if (!mqttClient || !mqttClient.connected) return;
      if ((viewMode === 'tv' || viewMode === 'solo_test') && roomState) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${roomState.code}/inbox`);
        broadcastRoomState();
      }
      if ((viewMode === 'mobile_play' || viewMode === 'mobile_join') && mySession.roomCode) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${mySession.roomCode}/state`);
      }
    }

    function publishPacket(topic, payload, retain = false) {
      if (bc) {
        try { bc.postMessage({ topic, payload }); } catch (e) {}
      }
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(topic, JSON.stringify(payload), { qos: 0, retain });
      }
    }

    function handleIncomingPacket(topic, data) {
      if (!data) return;

      // 1. Si soy TV y recibo un mensaje en mi inbox
      if ((viewMode === 'tv' || viewMode === 'solo_test') && roomState && topic === `${TOPIC_PREFIX}/${roomState.code}/inbox`) {
        if (data.msgId && processedMsgIds.has(data.msgId)) return;
        if (data.msgId) {
          processedMsgIds.add(data.msgId);
          if (processedMsgIds.size > 400) {
            const first = processedMsgIds.values().next().value;
            processedMsgIds.delete(first);
          }
        }
        processTvInboxMessage(data);
      }

      // 2. Si soy Móvil y recibo actualización del estado de la sala
      if ((viewMode === 'mobile_play' || viewMode === 'mobile_join') && mySession.roomCode && topic === `${TOPIC_PREFIX}/${mySession.roomCode}/state`) {
        if (data.code !== mySession.roomCode) return;
        roomState = data;
        if (joinTimeout) {
          clearTimeout(joinTimeout);
          joinTimeout = null;
        }
        if (viewMode === 'mobile_join') {
          viewMode = 'mobile_play';
          saveMobileSession();
          // Asegurar que mi jugador está registrado en la sala
          sendToTvInbox({
            type: 'JOIN',
            player: {
              id: mySession.playerId,
              name: mySession.playerName,
              avatar: mySession.avatar,
              isHost: mySession.isHostController
            }
          });
        }
        setAmbientTheme(roomState.activeTheme || roomState.game);
        render();
      }
    }

    /* =========================================================================
       4. LÓGICA DE SALA EN LA TV (ANFITRIÓN AUTORITATIVO)
       ========================================================================= */
    function createTvRoom(isSolo = false) {
      const code = generateRoomCode();
      roomState = {
        code,
        game: 'lobby', // 'lobby' | 'quien' | 'impostor' | 'dilemas' | 'yonunca' | 'verdad'
        activeTheme: 'lobby',
        subMode: 'mix',
        phase: 'lobby', // 'lobby' | 'voting' | 'reveal'
        round: 0,
        players: [], // { id, name, avatar, score, isBot, isHost }
        votes: {}, // { playerId: value }
        revealVoterNames: false,
        usedIndices: [],
        customQuestions: [],
        currentData: null,
        updatedAt: Date.now()
      };

      viewMode = isSolo ? 'solo_test' : 'tv';
      sessionStorage.setItem('partyos_tv_state', JSON.stringify(roomState));

      if (mqttClient && mqttClient.connected) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/inbox`);
      }

      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        if (roomState && (viewMode === 'tv' || viewMode === 'solo_test')) {
          broadcastRoomState();
        }
      }, 2200);

      if (isSolo) {
        // Añadir jugador local + 3 bots para probar al instante
        mySession = {
          roomCode: code,
          playerId: 'solo_me',
          playerName: 'Tú (Anfitrión)',
          avatar: '👑',
          isHostController: true,
          secretRevealed: false
        };
        roomState.players.push({ id: 'solo_me', name: 'Tú (Anfitrión)', avatar: '👑', score: 0, isBot: false, isHost: true });
        addTestBots();
      }

      broadcastRoomState();
      setAmbientTheme('lobby');
      render();
    }

    function broadcastRoomState() {
      if (!roomState) return;
      roomState.updatedAt = Date.now();
      sessionStorage.setItem('partyos_tv_state', JSON.stringify(roomState));
      publishPacket(`${TOPIC_PREFIX}/${roomState.code}/state`, roomState, true);
    }

    function addTestBots() {
      if (!roomState) return;
      const bots = [
        { id: 'bot_1', name: 'Hugo', avatar: '🔥', score: 0, isBot: true },
        { id: 'bot_2', name: 'Paula', avatar: '😈', score: 0, isBot: true },
        { id: 'bot_3', name: 'Mateo', avatar: '🍻', score: 0, isBot: true }
      ];
      bots.forEach(b => {
        if (!roomState.players.some(p => p.id === b.id)) {
          roomState.players.push(b);
        }
      });
      broadcastRoomState();
      render();
      showToast('🤖 +3 Bots añadidos para probar');
    }

    function triggerBotVotes() {
      if (!roomState || roomState.phase !== 'voting') return;
      const bots = roomState.players.filter(p => p.isBot);
      if (bots.length === 0) return;

      bots.forEach(bot => {
        if (roomState.votes[bot.id] !== undefined) return;
        if (roomState.game === 'quien' || (roomState.game === 'impostor' && roomState.phase === 'voting')) {
          const targets = roomState.players;
          const pick = targets[Math.floor(Math.random() * targets.length)];
          roomState.votes[bot.id] = pick.id;
        } else if (roomState.game === 'dilemas') {
          roomState.votes[bot.id] = Math.random() < 0.5 ? 'A' : 'B';
        } else if (roomState.game === 'yonunca') {
          roomState.votes[bot.id] = Math.random() < 0.45 ? 'SI' : 'NO';
        } else if (roomState.game === 'verdad') {
          if (roomState.currentData && bot.id !== roomState.currentData.accusedId) {
            roomState.votes[bot.id] = Math.random() < 0.5 ? 'VERDAD' : 'TROLA';
          }
        }
      });
    }

    function processTvInboxMessage(msg) {
      if (!roomState) return;

      if (msg.type === 'JOIN' && msg.player) {
        const idx = roomState.players.findIndex(p => p.id === msg.player.id);
        if (idx === -1) {
          roomState.players.push({
            id: msg.player.id,
            name: msg.player.name.slice(0, 18),
            avatar: msg.player.avatar || '🔥',
            score: 0,
            isBot: false,
            isHost: !!msg.player.isHost
          });
          showToast(`${msg.player.avatar} ${msg.player.name} entró a la sala`);
        } else {
          roomState.players[idx].name = msg.player.name.slice(0, 18);
          roomState.players[idx].avatar = msg.player.avatar || roomState.players[idx].avatar;
          roomState.players[idx].isHost = !!msg.player.isHost;
        }
        broadcastRoomState();
        render();
      }

      if (msg.type === 'VOTE' && msg.playerId) {
        if (roomState.phase === 'voting') {
          roomState.votes[msg.playerId] = msg.value;
          broadcastRoomState();
          render();
        }
      }

      if (msg.type === 'ADD_QUESTION' && msg.question) {
        roomState.customQuestions.push(msg.question);
        showToast('➕ Nueva pregunta añadida al mazo');
        broadcastRoomState();
        render();
      }

      if (msg.type === 'HOST_CMD') {
        executeHostCommand(msg.cmd, msg.payload);
      }
    }

    function executeHostCommand(cmd, payload) {
      if (!roomState) return;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      if (cmd === 'GO_LOBBY') {
        roomState.game = 'lobby';
        roomState.phase = 'lobby';
        roomState.activeTheme = 'lobby';
        roomState.votes = {};
        roomState.currentData = null;
      }

      if (cmd === 'START_GAME') {
        const { game, subMode } = payload;
        roomState.game = game;
        roomState.subMode = subMode || 'mix';
        roomState.usedIndices = [];
        startNextRound();
        return;
      }

      if (cmd === 'NEXT_ROUND') {
        startNextRound();
        return;
      }

      if (cmd === 'START_IMPOSTOR_VOTE') {
        roomState.phase = 'voting';
        roomState.votes = {};
        triggerBotVotes();
      }

      if (cmd === 'REVEAL') {
        revealCurrentRound();
      }

      if (cmd === 'TOGGLE_VOTERS') {
        roomState.revealVoterNames = !roomState.revealVoterNames;
      }

      setAmbientTheme(roomState.activeTheme || roomState.game);
      broadcastRoomState();
      render();
    }

    function startNextRound() {
      if (!roomState) return;
      roomState.round += 1;
      roomState.votes = {};
      roomState.revealVoterNames = false;

      if (roomState.game === 'quien') {
        const allPool = [
          ...QUIEN_QUESTIONS,
          ...roomState.customQuestions.map(q => ({ cat: q.cat, label: '✨ Personalizada · 2 tragos', text: q.text }))
        ];
        let filtered = allPool.map((q, idx) => ({ ...q, idx }));
        if (roomState.subMode !== 'mix') {
          filtered = filtered.filter(q => q.cat === roomState.subMode);
        }
        let available = filtered.filter(q => !roomState.usedIndices.includes(q.idx));
        if (available.length === 0) {
          roomState.usedIndices = [];
          available = filtered;
        }
        const chosen = available[Math.floor(Math.random() * available.length)];
        roomState.usedIndices.push(chosen.idx);
        roomState.currentData = chosen;
        roomState.phase = 'voting';
        roomState.activeTheme = chosen.cat === 'profundo' ? 'profundo' : 'quien';
        triggerBotVotes();
      }

      if (roomState.game === 'impostor') {
        const cats = Object.keys(IMPOSTOR_WORDS);
        const catKey = (roomState.subMode && roomState.subMode !== 'mix' && IMPOSTOR_WORDS[roomState.subMode])
          ? roomState.subMode
          : cats[Math.floor(Math.random() * cats.length)];
        const words = IMPOSTOR_WORDS[catKey];
        const word = words[Math.floor(Math.random() * words.length)];
        const players = [...roomState.players];
        const impostor = players[Math.floor(Math.random() * players.length)];
        // Orden aleatorio de turnos
        const order = players.sort(() => Math.random() - 0.5).map(p => `${p.avatar} ${p.name}`);
        roomState.currentData = {
          category: catKey.toUpperCase(),
          word,
          impostorId: impostor ? impostor.id : '',
          order
        };
        roomState.phase = 'clues'; // 'clues' -> 'voting' -> 'reveal'
        roomState.activeTheme = 'impostor';
      }

      if (roomState.game === 'dilemas') {
        let pool = DILEMAS_LIST.map((d, idx) => ({ ...d, idx }));
        if (roomState.subMode !== 'mix') {
          pool = pool.filter(d => d.cat === roomState.subMode);
        }
        let avail = pool.filter(d => !roomState.usedIndices.includes(d.idx));
        if (avail.length === 0) {
          roomState.usedIndices = [];
          avail = pool;
        }
        const chosen = avail[Math.floor(Math.random() * avail.length)];
        roomState.usedIndices.push(chosen.idx);
        roomState.currentData = chosen;
        roomState.phase = 'voting';
        roomState.activeTheme = 'dilemas';
        triggerBotVotes();
      }

      if (roomState.game === 'yonunca') {
        let pool = YONUNCA_LIST.map((y, idx) => ({ ...y, idx }));
        if (roomState.subMode !== 'mix') {
          pool = pool.filter(y => y.cat === roomState.subMode);
        }
        let avail = pool.filter(y => !roomState.usedIndices.includes(y.idx));
        if (avail.length === 0) {
          roomState.usedIndices = [];
          avail = pool;
        }
        const chosen = avail[Math.floor(Math.random() * avail.length)];
        roomState.usedIndices.push(chosen.idx);
        roomState.currentData = chosen;
        roomState.phase = 'voting';
        roomState.activeTheme = 'yonunca';
        triggerBotVotes();
      }

      if (roomState.game === 'verdad') {
        const players = roomState.players;
        const accused = players[Math.floor(Math.random() * players.length)];
        const prompt = VERDAD_PROMPTS[Math.floor(Math.random() * VERDAD_PROMPTS.length)];
        const isTruth = Math.random() < 0.5;
        roomState.currentData = {
          accusedId: accused ? accused.id : '',
          accusedName: accused ? `${accused.avatar} ${accused.name}` : 'Jugador',
          prompt,
          isTruth,
          secondsLeft: 45
        };
        roomState.phase = 'voting';
        roomState.activeTheme = 'verdad';
        triggerBotVotes();

        timerInterval = setInterval(() => {
          if (!roomState || roomState.game !== 'verdad' || roomState.phase !== 'voting') {
            clearInterval(timerInterval);
            return;
          }
          if (roomState.currentData.secondsLeft > 0) {
            roomState.currentData.secondsLeft -= 1;
            broadcastRoomState();
            render();
          } else {
            clearInterval(timerInterval);
          }
        }, 1000);
      }

      setAmbientTheme(roomState.activeTheme || roomState.game);
      broadcastRoomState();
      render();
    }

    function revealCurrentRound() {
      if (!roomState) return;
      roomState.phase = 'reveal';

      // Actualizar estadísticas del podio
      if (roomState.game === 'quien') {
        const counts = {};
        Object.values(roomState.votes).forEach(targetId => {
          counts[targetId] = (counts[targetId] || 0) + 1;
        });
        const max = Math.max(0, ...Object.values(counts));
        if (max > 0) {
          roomState.players.forEach(p => {
            if (counts[p.id] === max) p.score = (p.score || 0) + 1;
          });
        }
      }
    }

    /* =========================================================================
       5. LÓGICA DEL MÓVIL (JUGADOR + MANDO ANFITRIÓN)
       ========================================================================= */
    function saveMobileSession() {
      sessionStorage.setItem('partyos_mobile_session', JSON.stringify(mySession));
    }

    function sendToTvInbox(payload) {
      if (!mySession.roomCode) return;
      const packet = { ...payload, msgId: uid() };
      publishPacket(`${TOPIC_PREFIX}/${mySession.roomCode}/inbox`, packet, false);
    }

    function joinRoomFromMobile() {
      const code = uiDraft.joinCode.trim().toUpperCase();
      const name = uiDraft.joinName.trim();
      if (code.length < 4) {
        showToast('⚠️ Escribe el código de 4 letras de la TV');
        return;
      }
      if (!name) {
        showToast('⚠️ Escribe tu nombre');
        return;
      }

      mySession.roomCode = code;
      mySession.playerId = mySession.playerId || ('p_' + uid());
      mySession.playerName = name;
      mySession.avatar = uiDraft.joinAvatar;
      mySession.isHostController = uiDraft.joinAsHost;
      mySession.secretRevealed = false;
      saveMobileSession();

      joinStatusMsg = `Buscando sala ${code} en la TV...`;
      render();

      if (mqttClient && mqttClient.connected) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/state`);
      }

      // Enviar paquete JOIN inmediatamente y reintentar cada 1.2s hasta recibir respuesta
      const sendJoin = () => {
        sendToTvInbox({
          type: 'JOIN',
          player: {
            id: mySession.playerId,
            name: mySession.playerName,
            avatar: mySession.avatar,
            isHost: mySession.isHostController
          }
        });
      };

      sendJoin();
      const retryInterval = setInterval(() => {
        if (viewMode === 'mobile_play' || !joinTimeout) {
          clearInterval(retryInterval);
          return;
        }
        sendJoin();
      }, 1200);

      if (joinTimeout) clearTimeout(joinTimeout);
      joinTimeout = setTimeout(() => {
        clearInterval(retryInterval);
        if (viewMode !== 'mobile_play') {
          joinStatusMsg = `No se encontró la sala "${code}". Comprueba que la TV tiene esa sala abierta y conexión a internet.`;
          render();
        }
      }, 9000);
    }

    /* =========================================================================
       6. GENERADOR DE QR VECTORIAL
       ========================================================================= */
    function renderQrSvg(urlText) {
      if (typeof qrcode === 'undefined') {
        return `<div style="padding:20px;color:#000;font-weight:700;text-align:center;">Código:<br>${roomState.code}</div>`;
      }
      const qr = qrcode(0, 'M');
      qr.addData(urlText);
      qr.make();
      return qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
    }

    function getJoinUrl(code) {
      const base = window.location.origin + window.location.pathname;
      return `${base}?room=${code}`;
    }

    /* =========================================================================
       7. RENDERIZADO DE VISTAS (INICIO, TV, MÓVIL, PRUEBA SOLO)

          `;
        } else {
          const listA = roomState.players.filter(p => roomState.votes[p.id] === 'A');
          const listB = roomState.players.filter(p => roomState.votes[p.id] === 'B');
          gameBody = `
            <div style="text-align:center;">
              <span class="badge">⚖️ Resultado del Dilema · ¡La minoría bebe!</span>
              <div class="grid-2" style="margin:22px 0;text-align:left;">
                <div class="glass-subcard">
                  <h3>🅰️ Opción A (${listA.length})</h3>
                  <p class="muted small" style="margin:8px 0 12px;">${d.a}</p>
                  <div class="players-wrap" style="justify-content:flex-start;">
                    ${listA.map(p => `<span class="player-chip">${p.avatar} ${p.name}</span>`).join('') || '<span class="muted small">Nadie</span>'}
                  </div>
                </div>
                <div class="glass-subcard">
                  <h3>🅱️ Opción B (${listB.length})</h3>
                  <p class="muted small" style="margin:8px 0 12px;">${d.b}</p>
                  <div class="players-wrap" style="justify-content:flex-start;">
                    ${listB.map(p => `<span class="player-chip">${p.avatar} ${p.name}</span>`).join('') || '<span class="muted small">Nadie</span>'}
                  </div>
                </div>
              </div>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="NEXT_ROUND">Siguiente Dilema ➡️</button>
            </div>
          `;
        }
      }

      if (roomState.game === 'yonunca') {
        const y = roomState.currentData;
        if (roomState.phase === 'voting') {
          gameBody = `
            <div style="text-align:center;">
              <span class="badge">🍻 Yo Nunca Secreto</span>
              <div class="tv-question">${y.text}</div>
              <p class="muted" style="margin-bottom:18px;">Responded en secreto en vuestro móvil (${votedCount}/${totalPlayers})</p>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="REVEAL">Destapar Confesiones</button>
            </div>
          `;
        } else {
          const guilty = roomState.players.filter(p => roomState.votes[p.id] === 'SI');
          gameBody = `
            <div style="text-align:center;">
              <span class="badge">🍻 Confesiones destapadas</span>
              <div class="tv-question">${y.text}</div>
              <div class="glass-subcard" style="max-width:650px;margin:0 auto 22px;">
                <h3 style="margin-bottom:12px;">🍻 Sí lo han hecho (¡Beben!):</h3>
                <div class="players-wrap">
                  ${guilty.map(p => `<span class="player-chip voted">${p.avatar} ${p.name}</span>`).join('') || '<span class="muted">¡Nadie lo ha confesado!</span>'}
                </div>
              </div>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="NEXT_ROUND">Siguiente Yo Nunca ➡️</button>
            </div>
          `;
        }
      }

      if (roomState.game === 'verdad') {
        const v = roomState.currentData;
        if (roomState.phase === 'voting') {
          gameBody = `
            <div style="text-align:center;">
              <span class="badge">🎭 Verdad o Trola · Tiempo: ${v.secondsLeft}s</span>
              <h2 style="font-size:1.9rem;margin-top:14px;">Acusado: ${v.accusedName}</h2>
              <div class="tv-question">«${v.prompt}»</div>
              <p class="muted" style="margin-bottom:18px;">Escuchad su historia y votad en el móvil si dice la Verdad o es una Trola</p>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="REVEAL">Veredicto del Jurado</button>
            </div>
          `;
        } else {
          const vVerdad = roomState.players.filter(p => roomState.votes[p.id] === 'VERDAD').length;
          const vTrola = roomState.players.filter(p => roomState.votes[p.id] === 'TROLA').length;
          gameBody = `
            <div style="text-align:center;">
              <span class="badge">🎭 Juicio Finalizado</span>
              <div class="tv-question">${v.accusedName} estaba contando una:<br><span style="color:${v.isTruth ? '#34d399' : '#fb7185'}">${v.isTruth ? '✅ VERDAD COMO UN TEMPLO' : '🤥 TROLA COMO UNA CATEDRAL'}</span></div>
              <p class="muted" style="margin-bottom:22px;">El jurado votó: ${vVerdad} Verdad · ${vTrola} Trola</p>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="NEXT_ROUND">Siguiente Acusado ➡️</button>
            </div>
          `;
        }
      }

      return `
        <div class="glass-card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:14px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="badge">Sala: <strong>${roomState.code}</strong></span>
              <span class="badge">Ronda ${roomState.round}</span>
            </div>
            <button class="btn btn-sm" data-action="TV_CMD" data-cmd="GO_LOBBY">🏠 Cambiar Juego</button>
          </div>
          ${gameBody}
        </div>
      `;
    }

    /* -------------------------------------------------------------------------
       VISTA MÓVIL: UNIRSE
       ------------------------------------------------------------------------- */
    function buildMobileJoinHtml() {
      return `
        <div class="glass-card" style="max-width:460px;margin:10px auto;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <span class="badge">📱 Conectar Móvil</span>
            <button class="btn btn-sm" data-action="EXIT_HOME">Volver</button>
          </div>

          <h2 class="section-title" style="font-size:1.55rem;">Entrar a la Sala</h2>
          <p class="muted small" style="margin-bottom:18px;">Mira el código de 4 letras que aparece en la televisión.</p>

          <label class="small muted" style="display:block;margin-bottom:6px;">Código de la TV</label>
          <input class="glass-input code-input" id="inputRoomCode" maxlength="4" placeholder="ABCD" value="${uiDraft.joinCode}" style="margin-bottom:14px;" />

          <label class="small muted" style="display:block;margin-bottom:6px;">Tu nombre o mote</label>
          <input class="glass-input" id="inputPlayerName" maxlength="16" placeholder="Ej: Raúl" value="${uiDraft.joinName}" style="margin-bottom:14px;" />

          <label class="small muted" style="display:block;">Elige tu icono</label>
          <div class="avatar-grid">
            ${AVATARS.map(av => `
              <button type="button" class="avatar-btn ${uiDraft.joinAvatar === av ? 'selected' : ''}" data-action="PICK_AVATAR" data-avatar="${av}">${av}</button>
            `).join('')}
          </div>

          <label class="toggle-row">
            <div>
              <div style="font-weight:650;font-size:0.95rem;">🎛️ Controlar la TV desde mi móvil</div>
              <div class="muted small">Actívalo si eres tú quien puso el juego en la tele</div>
            </div>
            <input type="checkbox" id="inputIsHost" ${uiDraft.joinAsHost ? 'checked' : ''} style="width:20px;height:20px;" />
          </label>

          ${joinStatusMsg ? `<p style="color:#fde047;font-size:0.9rem;margin-top:14px;text-align:center;">${joinStatusMsg}</p>` : ''}

          <button class="btn btn-primary btn-block" style="margin-top:18px;" data-action="SUBMIT_JOIN">Entrar a Jugar 🚀</button>
        </div>
      `;
    }

    /* -------------------------------------------------------------------------
       VISTA MÓVIL: EN PARTIDA + MANDO ANFITRIÓN
       ------------------------------------------------------------------------- */
    function buildMobilePlayHtml() {
      if (!roomState) {
        return `<div class="glass-card" style="max-width:460px;margin:20px auto;text-align:center;">
          <p>Sincronizando con la sala ${mySession.roomCode}...</p>
        </div>`;
      }

      const myVote = roomState.votes ? roomState.votes[mySession.playerId] : undefined;
      let content = '';

      if (roomState.game === 'lobby') {
        content = `
          <div style="text-align:center;padding:14px 0;">
            <div style="font-size:3rem;margin-bottom:8px;">${mySession.avatar}</div>
            <h2 style="font-size:1.4rem;">¡Estás dentro, ${mySession.playerName}!</h2>
            <p class="muted small" style="margin-top:6px;">Mira la pantalla de la TV. Cuando estéis todos, elegid un juego.</p>
          </div>
          ${mySession.isHostController ? `
            <div class="glass-subcard" style="margin-top:14px;">
              <div class="small muted" style="margin-bottom:10px;font-weight:700;">🎛️ Lanzar juego en la TV:</div>
              <div style="display:grid;gap:8px;">
                <button class="btn btn-sm btn-block" data-action="MOBILE_HOST_START" data-game="quien" data-sub="mix">🔥 ¿Quién de aquí? (Mezcla)</button>
                <button class="btn btn-sm btn-block" data-action="MOBILE_HOST_START" data-game="quien" data-sub="profundo">🧠 Profundo / Debate</button>
                <button class="btn btn-sm btn-block" data-action="MOBILE_HOST_START" data-game="impostor" data-sub="mix">🕵️ El Impostor</button>
                <button class="btn btn-sm btn-block" data-action="MOBILE_HOST_START" data-game="dilemas" data-sub="mix">⚖️ Dilemas Extremos</button>
                <button class="btn btn-sm btn-block" data-action="MOBILE_HOST_START" data-game="yonunca" data-sub="mix">🍻 Yo Nunca Secreto</button>
                <button class="btn btn-sm btn-block" data-action="MOBILE_HOST_START" data-game="verdad" data-sub="mix">🎭 Verdad o Trola</button>
              </div>
            </div>
          ` : ''}
        `;
      }

      if (roomState.game === 'quien') {
        const q = roomState.currentData;
        if (roomState.phase === 'voting') {
          content = `
            <span class="badge">${q.label}</span>
            <p style="font-weight:700;font-size:1.1rem;margin:12px 0;">${q.text}</p>
            <div class="vote-grid">
              ${roomState.players.map(p => `
                <button class="vote-option ${myVote === p.id ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="${p.id}">
                  <span>${p.avatar} ${p.name}</span>
                  <span>${myVote === p.id ? '✅ Votado' : 'Votar'}</span>
                </button>
              `).join('')}
            </div>
          `;
        } else {
          content = `
            <div style="text-align:center;padding:22px 0;">
              <div style="font-size:2.4rem;margin-bottom:8px;">👀</div>
              <h3>¡Resultados en la TV!</h3>
              <p class="muted small">Mirad la pantalla principal para ver quién bebe.</p>
            </div>
          `;
        }
      }

      if (roomState.game === 'impostor') {
        const d = roomState.currentData;
        const amImpostor = d.impostorId === mySession.playerId;
        content = `
          <div class="secret-box" data-action="TOGGLE_SECRET">
            ${mySession.secretRevealed ? `
              <div class="small muted" style="margin-bottom:6px;">Categoría: ${d.category}</div>
              ${amImpostor
                ? `<div style="font-size:1.6rem;font-weight:900;color:#fb7185;">🕵️ ERES EL IMPOSTOR</div><p class="small muted" style="margin-top:6px;">No sabes la palabra. Escucha y disimula.</p>`
                : `<div style="font-size:1.7rem;font-weight:900;color:#34d399;">${d.word}</div><p class="small muted" style="margin-top:6px;">Eres inocente. Da una pista sin regalar la palabra.</p>`
              }
              <div class="small muted" style="margin-top:12px;">(Toca para volver a ocultar)</div>
            ` : `
              <div style="font-size:2rem;margin-bottom:6px;">👁️</div>
              <strong>Toca aquí para ver tu palabra secreta</strong>
              <div class="small muted" style="margin-top:4px;">Asegúrate de que nadie mire tu pantalla</div>
            `}
          </div>
          ${roomState.phase === 'voting' ? `
            <p style="font-weight:700;margin-top:14px;">Vota quién crees que es el impostor:</p>
            <div class="vote-grid">
              ${roomState.players.map(p => `
                <button class="vote-option ${myVote === p.id ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="${p.id}">
                  <span>${p.avatar} ${p.name}</span>
                  <span>${myVote === p.id ? '✅' : 'Acusar'}</span>
                </button>
              `).join('')}
            </div>
          ` : ''}
        `;
      }

      if (roomState.game === 'dilemas') {
        const d = roomState.currentData;
        if (roomState.phase === 'voting') {
          content = `
            <p style="font-weight:700;margin-bottom:12px;">Elige una opción en secreto:</p>
            <div class="vote-grid">
              <button class="vote-option ${myVote === 'A' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="A">
                <span>🅰️ ${d.a}</span>
              </button>
              <button class="vote-option ${myVote === 'B' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="B">
                <span>🅱️ ${d.b}</span>
              </button>
            </div>
          `;
        } else {
          content = `<div style="text-align:center;padding:24px 0;"><h3>👀 Mira la TV</h3><p class="muted small">La minoría bebe.</p></div>`;
        }
      }

      if (roomState.game === 'yonunca') {
        const y = roomState.currentData;
        if (roomState.phase === 'voting') {
          content = `
            <p style="font-weight:700;font-size:1.1rem;margin-bottom:14px;">${y.text}</p>
            <div class="vote-grid">
              <button class="vote-option ${myVote === 'SI' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="SI">
                <span>🍻 Yo SÍ lo he hecho</span>
              </button>
              <button class="vote-option ${myVote === 'NO' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="NO">
                <span>😇 Yo NUNCA</span>
              </button>
            </div>
          `;
        } else {
          content = `<div style="text-align:center;padding:24px 0;"><h3>👀 Mira la TV</h3><p class="muted small">Confesiones destapadas.</p></div>`;
        }
      }

      if (roomState.game === 'verdad') {
        const v = roomState.currentData;
        const amAccused = v.accusedId === mySession.playerId;
        if (roomState.phase === 'voting') {
          if (amAccused) {
            content = `
              <div class="secret-box">
                <div class="small muted">Te toca hablar (${v.secondsLeft}s):</div>
                <div style="font-size:1.5rem;font-weight:900;margin:10px 0;color:${v.isTruth ? '#34d399' : '#fb7185'}">
                  ${v.isTruth ? '✅ DI UNA VERDAD REAL' : '🤥 INVENTA UNA TROLA'}
                </div>
                <p class="small">${v.prompt}</p>
              </div>
            `;
          } else {
            content = `
              <p style="font-weight:700;margin-bottom:12px;">¿Qué está contando ${v.accusedName}?</p>
              <div class="vote-grid">
                <button class="vote-option ${myVote === 'VERDAD' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="VERDAD">
                  <span>✅ Es Verdad</span>
                </button>
                <button class="vote-option ${myVote === 'TROLA' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="TROLA">
                  <span>🤥 Es Trola</span>
                </button>
              </div>
            `;
          }
        } else {
          content = `<div style="text-align:center;padding:24px 0;"><h3>👀 Veredicto en la TV</h3></div>`;
        }
      }

      // Barra de mando remoto si es anfitrión
      const hostRemote = mySession.isHostController && roomState.game !== 'lobby' ? `
        <div class="glass-subcard" style="margin-top:18px;">
          <div class="small muted" style="font-weight:700;margin-bottom:8px;">🎛️ Mando TV (Anfitrión)</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            ${roomState.game === 'impostor' && roomState.phase === 'clues'
              ? `<button class="btn btn-sm btn-primary" data-action="MOBILE_HOST_CMD" data-cmd="START_IMPOSTOR_VOTE">🗳️ Votar</button>`
              : roomState.phase === 'voting'
                ? `<button class="btn btn-sm btn-primary" data-action="MOBILE_HOST_CMD" data-cmd="REVEAL">👀 Revelar</button>`
                : `<button class="btn btn-sm btn-primary" data-action="MOBILE_HOST_CMD" data-cmd="NEXT_ROUND">Siguiente ➡️</button>`
            }
            <button class="btn btn-sm" data-action="MOBILE_HOST_CMD" data-cmd="GO_LOBBY">🏠 Juegos</button>
          </div>
        </div>
      ` : '';

      return `
        <div class="glass-card" style="max-width:480px;margin:0 auto;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <span class="badge">${mySession.avatar} ${mySession.playerName} · Sala ${mySession.roomCode}</span>
            <button class="btn btn-sm" data-action="TOGGLE_HOST_MODE" title="Activar/desactivar mando TV">🎛️</button>
          </div>
          ${content}
          ${hostRemote}
        </div>
      `;
    }

    /* =========================================================================
       8. EVENTOS CENTRALIZADOS
       ========================================================================= */
    document.addEventListener('input', (e) => {
      if (e.target.id === 'inputRoomCode') uiDraft.joinCode = e.target.value.toUpperCase();
      if (e.target.id === 'inputPlayerName') uiDraft.joinName = e.target.value;
    });

    document.addEventListener('change', (e) => {
      if (e.target.id === 'inputIsHost') uiDraft.joinAsHost = e.target.checked;
    });

    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'CREATE_TV') createTvRoom(false);
      if (action === 'START_SOLO_TEST') createTvRoom(true);
      if (action === 'OPEN_MOBILE_JOIN') {
        viewMode = 'mobile_join';
        joinStatusMsg = '';
        render();
      }
      if (action === 'EXIT_HOME') {
        viewMode = 'home';
        roomState = null;
        setAmbientTheme('lobby');
        render();
      }
      if (action === 'ADD_BOTS') addTestBots();
      if (action === 'COPY_LINK') {
        const url = getJoinUrl(roomState.code);
        navigator.clipboard?.writeText(url);
        showToast('📋 Enlace copiado al portapapeles');
      }
      if (action === 'PICK_AVATAR') {
        uiDraft.joinAvatar = target.dataset.avatar;
        render();
      }
      if (action === 'SUBMIT_JOIN') joinRoomFromMobile();

      if (action === 'TV_START_GAME') {
        executeHostCommand('START_GAME', { game: target.dataset.game, subMode: target.dataset.sub });
      }
      if (action === 'TV_CMD') {
        executeHostCommand(target.dataset.cmd);
      }

      if (action === 'MOBILE_VOTE') {
        const val = target.dataset.val;
        if (viewMode === 'solo_test') {
          roomState.votes[mySession.playerId] = val;
          broadcastRoomState();
          render();
        } else {
          if (roomState && roomState.votes) roomState.votes[mySession.playerId] = val;
          sendToTvInbox({ type: 'VOTE', playerId: mySession.playerId, value: val });
          render();
        }
      }

      if (action === 'MOBILE_HOST_START') {
        const payload = { game: target.dataset.game, subMode: target.dataset.sub };
        if (viewMode === 'solo_test') executeHostCommand('START_GAME', payload);
        else sendToTvInbox({ type: 'HOST_CMD', cmd: 'START_GAME', payload });
      }

      if (action === 'MOBILE_HOST_CMD') {
        const cmd = target.dataset.cmd;
        if (viewMode === 'solo_test') executeHostCommand(cmd);
        else sendToTvInbox({ type: 'HOST_CMD', cmd });
      }

      if (action === 'TOGGLE_SECRET') {
        mySession.secretRevealed = !mySession.secretRevealed;
        render();
      }

      if (action === 'TOGGLE_HOST_MODE') {
        mySession.isHostController = !mySession.isHostController;
        saveMobileSession();
        showToast(mySession.isHostController ? '🎛️ Mando TV activado' : '🎛️ Mando TV oculto');
        render();
      }
    });

    /* =========================================================================
       9. ARRANQUE AUTOMÁTICO (DETECTA ?room=XXXX DEL QR)
       ========================================================================= */
    (function bootstrap() {
      initNetwork();
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) {
        uiDraft.joinCode = roomParam.toUpperCase().slice(0, 4);
        uiDraft.joinAsHost = false;
        viewMode = 'mobile_join';
      }
      render();
    })();
  </script>
</body>
</html>
