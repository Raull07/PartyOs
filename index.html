<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05060b" />
  <meta name="description" content="PartyOS · 9 juegos de fiesta multijugador en tiempo real: enciende la TV y vota desde cada móvil." />
  <title>PartyOS · Liquid Edition</title>
  <meta http-equiv="refresh" content="0; url=./partyos.html" />
  <link rel="canonical" href="./partyos.html" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='.5' stop-color='%23ec4899'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E" />
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #6366f1 0%, transparent 55%),
                  radial-gradient(circle at 80% 80%, #ec4899 0%, transparent 55%),
                  #05060b;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .box { animation: fade 0.6s ease both; }
    .icon { font-size: 3.2rem; }
    h1 {
      margin: 10px 0 6px;
      font-size: clamp(2rem, 8vw, 3.4rem);
      letter-spacing: -0.02em;
      background: linear-gradient(110deg, #ffffff 10%, #a5b4fc 40%, #f472b6 70%, #67e8f9 95%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { margin: 0 0 18px; opacity: 0.8; }
    a.btn {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 999px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
    }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .box { animation: none; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🎉</div>
    <h1>PartyOS</h1>
    <p>Entrando al juego…</p>
    <a class="btn" href="./partyos.html">Entrar en PartyOS</a>
  </div>
  <script>
    // Redirección inmediata (por si el meta refresh está bloqueado).
    (function () {
      var target = './partyos.html';
      var url = new URL(target, location.href);
      // Conserva los parámetros (ej. ?room=ABCD) al redirigir.
      if (location.search) url.search = location.search;
      if (location.hash) url.hash = location.hash;
      location.replace(url.toString());
    })();
  </script>
</body>
</html>
