<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05060b" />
  <title>PartyOS · Liquid Edition</title>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js" onerror="window.__loadBackupMqtt && window.__loadBackupMqtt()"></script>
  <script>
    window.__loadBackupMqtt = function () {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';
      document.head.appendChild(s);
    };
  </script>
  <style>
    :root {
      --bg-base: #05060b;
      --glass-bg: rgba(255, 255, 255, 0.065);
      --glass-bg-strong: rgba(255, 255, 255, 0.11);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-highlight: rgba(255, 255, 255, 0.28);
      --text-primary: #f8fafc;
      --text-secondary: rgba(248, 250, 252, 0.72);
      --text-muted: rgba(248, 250, 252, 0.48);
      --orb-1: #6366f1;
      --orb-2: #ec4899;
      --orb-3: #06b6d4;
      --orb-4: #8b5cf6;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.2);
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #fb7185;
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-pill: 999px;
      --shadow-glass: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 var(--glass-highlight);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      min-height: 100dvh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      line-height: 1.45;
    }

    body.cursor-hidden { cursor: none; }

    /* Fondo dinámico Apple Liquid Glass */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #05060b 78%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.44;
      transition: background 1.2s ease;
      animation: floatOrb 20s ease-in-out infinite alternate;
      will-change: transform;
    }

    .orb-1 { width: 44vw; height: 44vw; top: -12%; left: -8%; background: var(--orb-1); }
    .orb-2 { width: 40vw; height: 40vw; top: 18%; right: -10%; background: var(--orb-2); animation-delay: -5s; }
    .orb-3 { width: 46vw; height: 46vw; bottom: -16%; left: 15%; background: var(--orb-3); animation-delay: -10s; }
    .orb-4 { width: 32vw; height: 32vw; bottom: 10%; right: 12%; background: var(--orb-4); animation-delay: -14s; }

    @keyframes floatOrb {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(3%, -3%, 0) scale(1.06); }
    }

    @media (max-width: 768px), (prefers-reduced-motion: reduce) {
      .orb { filter: blur(42px); animation: none; opacity: 0.34; }
      .glass-card { backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); }
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 1380px;
      margin: 0 auto;
      padding: 14px 18px 44px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island HUD */
    .island-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
      position: sticky;
      top: 10px;
      z-index: 60;
    }

    .dynamic-island {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(11, 13, 22, 0.82);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: var(--radius-pill);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      font-size: 0.85rem;
      font-weight: 600;
      flex-wrap: wrap;
      justify-content: center;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      background: var(--warning);
      box-shadow: 0 0 10px var(--warning);
    }

    .status-dot.online { background: var(--success); box-shadow: 0 0 12px var(--success); }
    .status-dot.offline { background: var(--danger); box-shadow: 0 0 12px var(--danger); }

    .island-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.78rem;
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-glass);
      padding: 26px;
      animation: phaseIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes phaseIn {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .glass-subcard {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .hero-title {
      font-size: clamp(2.3rem, 5vw, 4rem);
      font-weight: 850;
      letter-spacing: -0.035em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.08;
    }

    .tv-question {
      font-size: clamp(2rem, 4.1vw, 3.45rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.18;
      text-align: center;
      margin: 18px 0;
    }

    .section-title {
      font-size: 1.22rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .muted { color: var(--text-secondary); }
    .small { font-size: 0.86rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.09);
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.34);
    }

    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #6366f1);
      border-color: rgba(255, 255, 255, 0.36);
      color: #fff;
    }

    .btn-danger {
      background: linear-gradient(135deg, #f43f5e, #be123c);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .btn-sm { padding: 8px 13px; font-size: 0.83rem; }
    .btn-block { width: 100%; }
    .btn.active-pill {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fff;
    }

    .glass-input, .glass-select {
      width: 100%;
      padding: 13px 16px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.36);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .glass-input:focus, .glass-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .code-input {
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-weight: 850;
      font-size: 1.5rem;
      text-align: center;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }

    .grid-games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 13px;
    }

    .game-tile {
      text-align: left;
      padding: 18px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.14);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text-primary);
    }

    .game-tile:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.11);
      border-color: var(--accent);
    }

    .qr-wrapper {
      background: #ffffff;
      padding: 16px;
      border-radius: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.5);
    }

    .qr-wrapper svg {
      display: block;
      width: clamp(195px, 18vw, 250px);
      height: clamp(195px, 18vw, 250px);
    }

    .room-code-big {
      font-size: clamp(3rem, 5.5vw, 4.6rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      padding: 8px 24px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.24);
      display: inline-block;
      margin: 8px 0;
    }

    .players-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .player-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-weight: 650;
      font-size: 0.94rem;
      transition: all 0.2s ease;
    }

    .player-chip.voted {
      background: rgba(52, 211, 153, 0.2);
      border-color: rgba(52, 211, 153, 0.6);
    }

    .player-chip.active-turn {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 0 22px var(--accent-soft);
      transform: scale(1.06);
    }

    .avatar-img {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.35);
      vertical-align: middle;
    }

    .avatar-img-lg {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 10px 0 14px;
    }

    .avatar-btn {
      font-size: 1.5rem;
      padding: 9px 4px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .avatar-btn.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: scale(1.07);
    }

    .vote-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .vote-option {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 1.02rem;
      font-weight: 650;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .vote-option.selected {
      background: linear-gradient(135deg, var(--accent-soft), rgba(99, 102, 241, 0.38));
      border-color: var(--accent);
      box-shadow: 0 0 22px var(--accent-soft);
    }

    .result-row { margin-bottom: 12px; }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      margin-bottom: 5px;
      font-size: 1.08rem;
    }
    .result-track {
      height: 18px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .result-fill {
      height: 100%;
      width: 0%;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, var(--accent), #818cf8, #f472b6);
      transition: width 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .secret-box {
      padding: 24px 18px;
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.24);
      text-align: center;
      cursor: pointer;
      user-select: none;
      margin: 12px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .badge-suave { background: rgba(52, 211, 153, 0.18); border-color: rgba(52, 211, 153, 0.45); color: #6ee7b7; }
    .badge-delicada { background: rgba(250, 204, 21, 0.18); border-color: rgba(250, 204, 21, 0.45); color: #fde047; }
    .badge-cruel { background: rgba(251, 146, 60, 0.2); border-color: rgba(251, 146, 60, 0.5); color: #fdba74; }
    .badge-brutal { background: rgba(244, 63, 94, 0.22); border-color: rgba(244, 63, 94, 0.55); color: #fda4af; }
    .badge-profundo { background: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.5); color: #7dd3fc; }

    .reaction-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 80;
      overflow: hidden;
    }
    .floating-emoji {
      position: absolute;
      bottom: 40px;
      font-size: 2.6rem;
      animation: floatEmoji 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes floatEmoji {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      15% { opacity: 1; transform: translateY(-40px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-420px) scale(0.95) rotate(12deg); }
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 75;
    }

    .event-banner {
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.22), rgba(244, 63, 94, 0.22));
      border: 1px solid rgba(251, 191, 36, 0.55);
      text-align: center;
      font-weight: 800;
      margin-bottom: 16px;
      font-size: 1.05rem;
    }

    .podium-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin: 20px 0;
      align-items: end;
    }
    .podium-col {
      padding: 20px 14px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
    }
    .podium-col.rank-1 {
      background: linear-gradient(180deg, rgba(250, 204, 21, 0.24), rgba(255, 255, 255, 0.07));
      border-color: rgba(250, 204, 21, 0.65);
      padding-top: 32px;
    }

    .split-preview {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 920px) {
      .split-preview { grid-template-columns: 1fr; }
      .glass-card { padding: 18px; border-radius: 24px; }
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.24);
      backdrop-filter: blur(20px);
      padding: 11px 20px;
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 999;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
    }

    .debug-drawer {
      margin-top: 20px;
      padding: 16px;
      border-radius: var(--radius-lg);
      background: rgba(0, 0, 0, 0.72);
      border: 1px dashed rgba(56, 189, 248, 0.6);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="ambient-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>
  <canvas id="confettiCanvas"></canvas>
  <div class="reaction-layer" id="reactionLayer"></div>

  <div class="shell">
    <div class="island-bar">
      <div class="dynamic-island" id="dynamicIsland">
        <span class="status-dot" id="connDot"></span>
        <span id="connText">Iniciando red...</span>
        <button class="island-pill" data-action="CYCLE_PENALTY_MODE" id="penaltyPill" title="Cambiar modo de castigo/puntos">🍻 Modo: Beber</button>
        <button class="island-pill" data-action="TOGGLE_SOUND" id="soundPill" title="Activar/silenciar sonido">🔊</button>
        <button class="island-pill" data-action="TOGGLE_FULLSCREEN" title="Pantalla completa (F)">⛶</button>
      </div>
    </div>

    <main id="app"></main>
    <div id="debugContainer"></div>
  </div>

  <script>
    /* =========================================================================
       0. GENERADOR QR SVG NATIVO (0 DEPENDENCIAS EXTERNAS, FUNCIONA OFFLINE)
       ========================================================================= */
    const NativeQR = (() => {
      const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
      for (let i = 0, x = 1; i < 255; i++) {
        EXP[i] = x; LOG[x] = i;
        x = (x << 1) ^ (x & 128 ? 0x11d : 0);
      }
      for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];

      function gfMul(a, b) { return a && b ? EXP[LOG[a] + LOG[b]] : 0; }
      function rsGenPoly(ecLen) {
        let poly = [1];
        for (let i = 0; i < ecLen; i++) {
          const next = new Array(poly.length + 1).fill(0);
          for (let j = 0; j < poly.length; j++) {
            next[j] ^= poly[j];
            next[j + 1] ^= gfMul(poly[j], EXP[i]);
          }
          poly = next;
        }
        return poly;
      }
      function rsEncode(data, ecLen) {
        const gen = rsGenPoly(ecLen);
        const res = new Uint8Array(data.length + ecLen);
        res.set(data);
        for (let i = 0; i < data.length; i++) {
          const coef = res[i];
          if (coef) {
            for (let j = 0; j < gen.length; j++) res[i + j] ^= gfMul(gen[j], coef);
          }
        }
        return res.slice(data.length);
      }

      const VERSIONS = [
        null,
        { size: 21, dataBytes: 19, ecBytes: 7, align: [] },
        { size: 25, dataBytes: 34, ecBytes: 10, align: [6, 18] },
        { size: 29, dataBytes: 55, ecBytes: 15, align: [6, 22] },
        { size: 33, dataBytes: 80, ecBytes: 20, align: [6, 26] },
        { size: 37, dataBytes: 108, ecBytes: 26, align: [6, 30] },
        { size: 41, dataBytes: 136, ecBytes: 36, align: [6, 34] }
      ];

      function toSvg(text) {
        const bytes = new TextEncoder().encode(text);
        let ver = 1;
        while (ver <= 6 && VERSIONS[ver].dataBytes < bytes.length + 2) ver++;
        if (ver > 6) ver = 6;
        const cfg = VERSIONS[ver];
        const size = cfg.size;

        const bits = [];
        const pushBits = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
        pushBits(0b0100, 4);
        const maxPayload = cfg.dataBytes - 2;
        const payload = bytes.slice(0, maxPayload);
        pushBits(payload.length, 8);
        payload.forEach(b => pushBits(b, 8));
        pushBits(0, Math.min(4, cfg.dataBytes * 8 - bits.length));
        while (bits.length % 8 !== 0) bits.push(0);
        const padBytes = [0xec, 0x11];
        let pIdx = 0;
        while (bits.length < cfg.dataBytes * 8) {
          pushBits(padBytes[pIdx % 2], 8);
          pIdx++;
        }
        const dataArr = new Uint8Array(cfg.dataBytes);
        for (let i = 0; i < cfg.dataBytes; i++) {
          let b = 0;
          for (let j = 0; j < 8; j++) b = (b << 1) | bits[i * 8 + j];
          dataArr[i] = b;
        }
        const ecArr = rsEncode(dataArr, cfg.ecBytes);
        const allBytes = new Uint8Array(dataArr.length + ecArr.length);
        allBytes.set(dataArr);
        allBytes.set(ecArr, dataArr.length);

        const mod = Array.from({ length: size }, () => new Int8Array(size));

        const totalBits = allBytes.length * 8;

    function initNetwork() {
      try {
        bc = new BroadcastChannel(TOPIC_PREFIX);
        bc.onmessage = (ev) => {
          if (ev.data) handleIncomingPacket(ev.data.topic, ev.data.payload);
        };
      } catch (e) {}
      connectMqtt();
    }

    function connectMqtt() {
      if (typeof mqtt === 'undefined') {
        updateConnectionHUD(true, 'Modo Local / Pasar Móvil');
        return;
      }
      if (mqttClient) {
        try { mqttClient.end(true); } catch (e) {}
      }

      const url = BROKERS[brokerIndex % BROKERS.length];
      updateConnectionHUD(false, `Conectando (${(brokerIndex % BROKERS.length) + 1}/${BROKERS.length})...`);

      mqttClient = mqtt.connect(url, {
        clientId: 'pos_' + uid(),
        clean: true,
        connectTimeout: 4500,
        reconnectPeriod: 0
      });

      mqttClient.on('connect', () => {
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        updateConnectionHUD(true, 'En vivo · Sincronizado');
        resubscribeActiveTopics();
      });

      const scheduleNextBroker = () => {
        if (reconnectTimer) return;
        brokerIndex++;
        updateConnectionHUD(false, 'Reconectando otro servidor...');
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connectMqtt();
        }, 1600);
      };

      mqttClient.on('error', scheduleNextBroker);
      mqttClient.on('close', () => {
        if (!mqttClient.connected) scheduleNextBroker();
      });

      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          handleIncomingPacket(topic, data);
        } catch (e) {}
      });
    }

    function resubscribeActiveTopics() {
      if (!mqttClient || !mqttClient.connected) return;
      if ((viewMode === 'tv' || viewMode === 'solo_test') && roomState) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${roomState.code}/inbox`);
        mqttClient.subscribe(`${TOPIC_PREFIX}/${roomState.code}/avatars`);
        broadcastRoomState();
      }
      if ((viewMode === 'mobile_play' || viewMode === 'mobile_join') && mySession.roomCode) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${mySession.roomCode}/state`);
        mqttClient.subscribe(`${TOPIC_PREFIX}/${mySession.roomCode}/avatars`);
        if (mySession.playerId) {
          mqttClient.subscribe(`${TOPIC_PREFIX}/${mySession.roomCode}/p/${mySession.playerId}`);
        }
        sendToTvInbox({ type: 'REQUEST_STATE', playerId: mySession.playerId });
      }
    }

    function publishPacket(topic, payload, retain = false) {
      if (bc) {
        try { bc.postMessage({ topic, payload }); } catch (e) {}
      }
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(topic, JSON.stringify(payload), { qos: 0, retain });
      }
    }

          let someoneGuessed = false;
          Object.entries(state.votes).forEach(([voterId, guessedAuthorId]) => {
            if (voterId !== d.currentAuthorId && guessedAuthorId === d.currentAuthorId) {
              someoneGuessed = true;
              const p = state.players.find(pl => pl.id === voterId);
              if (p) {
                p.score = (p.score || 0) + 1;
                p.stats.writesGuessed = (p.stats.writesGuessed || 0) + 1;
              }
            }
          });
          if (!someoneGuessed && d.currentAuthorId) {
            const author = state.players.find(pl => pl.id === d.currentAuthorId);
            if (author) author.score = (author.score || 0) + 2;
          }
        }
      },

      mente: {

        start(state, privateMap) {

          const d = state.currentData;
          d.revealedIsTruth = d._secretIsTruth;
          const correctChoice = d.revealedIsTruth ? 'VERDAD' : 'TROLA';
          let fooledCount = 0;
          state.players.forEach(p => {
            if (p.id !== d.accusedId) {
              if (state.votes[p.id] === correctChoice) {
                p.score = (p.score || 0) + 1;
                p.stats.truthsGuessed = (p.stats.truthsGuessed || 0) + 1;
              } else if (state.votes[p.id]) {
                fooledCount++;
              }

          });
          if (fooledCount > 0) {

    /* =========================================================================
       6. HELPERS DE COLAS JUSTAS, HISTORIAL PERSISTENTE Y EVENTOS
       ========================================================================= */
    function getUsedIndices(gameKey) {
      try {
        const all = JSON.parse(localStorage.getItem(STORAGE_KEYS.usedIndices) || '{}');
        return all[gameKey] || [];
      } catch (e) { return []; }
    }

    function markUsedIndex(gameKey, idx) {
      try {
        const all = JSON.parse(localStorage.getItem(STORAGE_KEYS.usedIndices) || '{}');
        all[gameKey] = [...new Set([...(all[gameKey] || []), idx])];
        localStorage.setItem(STORAGE_KEYS.usedIndices, JSON.stringify(all));
      } catch (e) {}
    }

    function clearUsedIndices(gameKey) {
      try {
        const all = JSON.parse(localStorage.getItem(STORAGE_KEYS.usedIndices) || '{}');
        all[gameKey] = [];
        localStorage.setItem(STORAGE_KEYS.usedIndices, JSON.stringify(all));
      } catch (e) {}
    }

    function pickFairQueuePlayer(state, queueProp) {
      state[queueProp] = (state[queueProp] || []).filter(id => state.players.some(p => p.id === id));
      if (state[queueProp].length === 0) {
        state[queueProp] = shuffle(state.players.map(p => p.id));
      }
      const nextId = state[queueProp].shift();
      return state.players.find(p => p.id === nextId) || state.players[0];
    }

    function isLastPlace(state, playerId) {
      if (state.players.length < 2) return false;
      const min = Math.min(...state.players.map(p => p.score || 0));
      const p = state.players.find(pl => pl.id === playerId);
      return p && (p.score || 0) === min;
    }

    function getEligibleVoters(state) {
      if (!state || !state.currentData) return state?.players || [];
      if (state.game === 'verdad') {
        return state.players.filter(p => p.id !== state.currentData.accusedId);
      }
      if (state.game === 'impostor' && state.currentData.activePlayerIds) {
        return state.players.filter(p => state.currentData.activePlayerIds.includes(p.id));
      }
      return state.players;
    }

    /* =========================================================================
       7. AUTORIDAD DE SALA EN TV (VALIDACIÓN, PRIVACIDAD Y AUTO-REVELADO)
       ========================================================================= */
    let privateRoundSecrets = {};

    function createTvRoom(mode = 'tv') {
      const code = generateRoomCode();
      const hostKey = uid();
      roomState = {
        code,
        hostKey,
        locked: false,
        penaltyMode: 'drink',
        nightMode: false,
        maxRounds: 0,
        anonYoNunca: false,
        impostorVariant: 'classic',
        game: 'lobby',
        activeTheme: 'lobby',
        subMode: 'mix',
        phase: 'lobby',
        round: 0,
        players: [],
        votes: {},
        wildcardsUsed: {},
        activeEvent: null,
        revealVoterNames: false,
        rulesEndsAt: 0,
        autoRevealEndsAt: 0,
        customQuestions: JSON.parse(localStorage.getItem(STORAGE_KEYS.customQ) || '[]'),
        truthQueue: [],
        teconozcoQueue: [],
        currentData: null,
        updatedAt: Date.now()
      };

      viewMode = mode;
      requestWakeLock();
      saveTvState();

      if (mqttClient && mqttClient.connected) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/inbox`);
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/avatars`);
      }

      startTvLoops();

      if (mode === 'solo_test') {
        mySession = {
          roomCode: code,
          playerId: 'solo_me',
          playerName: 'Tú (Host)',
          avatar: '👑',
          selfieData: '',
          isHostController: true,
          hostKey,
          secretRevealed: false,
          lastSeenRound: 0
        };
        roomState.players.push(makePlayerObj('solo_me', 'Tú (Host)', '👑', false, true));
        addTestBots(3);
      }

      broadcastRoomState();
      setAmbientTheme('lobby');
      render(true);
    }

    function makePlayerObj(id, name, avatar, isBot = false, isHost = false) {
      return {
        id,
        name: String(name).slice(0, 18),
        avatar: avatar || '🔥',
        score: 0,
        isBot,
        isHost,
        wildcard: 'available',
        stats: { mostVoted: 0, impostorWins: 0, truthsGuessed: 0, groupMatches: 0, writesGuessed: 0 }
      };
    }

    function saveTvState() {
      if (!roomState) return;
      try { localStorage.setItem(STORAGE_KEYS.tvState, JSON.stringify(roomState)); } catch (e) {}
    }

    function startTvLoops() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        if (!roomState || (viewMode !== 'tv' && viewMode !== 'solo_test')) return;
        const now = Date.now();

        if (roomState.phase === 'rules' && roomState.rulesEndsAt && now >= roomState.rulesEndsAt) {
          roomState.phase = roomState.postRulesPhase || 'voting';
          triggerBotActions();
          broadcastRoomState();
          render();
          return;
        }

        if (roomState.autoRevealEndsAt && now >= roomState.autoRevealEndsAt) {
          roomState.autoRevealEndsAt = 0;
          executeHostCommand('REVEAL', {}, true);
          return;
        }

        if (roomState.game === 'impostor' && roomState.phase === 'clues' && roomState.currentData) {
          if (now >= roomState.currentData.turnEndsAt) {
            if (roomState.currentData.turnIdx + 1 < roomState.currentData.turnOrder.length) {
              roomState.currentData.turnIdx++;
              roomState.currentData.turnEndsAt = now + 20000;
              playTone(660, 0.08);
              broadcastRoomState();
              render();
            } else {
              executeHostCommand('START_IMPOSTOR_VOTE', {}, true);
            }
            return;
          }
        }

        if (roomState.game === 'impostor' && roomState.phase === 'last_bullet' && roomState.currentData?.lastBulletEndsAt) {
          if (now >= roomState.currentData.lastBulletEndsAt) {
            roomState.phase = 'reveal';
            broadcastRoomState();
            render();
            return;
          }
        }

        if (roomState.game === 'trivia' && roomState.phase === 'voting' && roomState.currentData?.endsAt) {
          if (now >= roomState.currentData.endsAt) {
            executeHostCommand('REVEAL', {}, true);
            return;
          }
        }

        broadcastRoomState();
      }, 600);
    }

    function broadcastRoomState() {
      if (!roomState) return;
      const cleanData = roomState.currentData ? { ...roomState.currentData } : null;
      if (cleanData) {
        Object.keys(cleanData).forEach(k => { if (k.startsWith('_secret')) delete cleanData[k]; });
      }
      const publicPayload = {
        ...roomState,
        hostKey: undefined,
        currentData: cleanData,
        updatedAt: Date.now()
      };
      saveTvState();
      publishPacket(`${TOPIC_PREFIX}/${roomState.code}/state`, publicPayload, true);
    }

    function sendPrivateSecrets() {
      if (!roomState) return;
      Object.entries(privateRoundSecrets).forEach(([playerId, secretObj]) => {
        const payload = { round: roomState.round, ...secretObj };
        if (playerId === mySession.playerId) myPrivatePayload = payload;
        publishPacket(`${TOPIC_PREFIX}/${roomState.code}/p/${playerId}`, payload, true);
      });
    }

    function addTestBots(count = 3) {
      if (!roomState) return;
      const botNames = ['Hugo', 'Paula', 'Mateo', 'Lucía', 'Diego', 'Carla', 'Álvaro', 'Sofía', 'Adrián'];
      let added = 0;
      for (const name of botNames) {
        if (added >= count) break;
        const id = 'bot_' + name.toLowerCase();
        if (!roomState.players.some(p => p.id === id)) {
          roomState.players.push(makePlayerObj(id, name, AVATARS[(roomState.players.length + 1) % AVATARS.length], true, false));
          added++;
        }
      }
      broadcastRoomState();
      render();
      showToast(`🤖 +${added} Bots añadidos`);
    }

    function triggerBotActions() {
      if (!roomState) return;
      const gameDef = GAMES[roomState.game];
      if (!gameDef || !gameDef.botVote) return;

      roomState.players.filter(p => p.isBot).forEach(bot => {
        if (roomState.phase === 'writing' && roomState.game === 'escribio') {
          if (!roomState.currentData.submissions[bot.id]) {
            roomState.currentData.submissions[bot.id] = gameDef.botVote(roomState, bot);
          }
        } else if (roomState.phase === 'voting') {
          if (roomState.game === 'verdad' && bot.id === roomState.currentData.accusedId) return;
          if (roomState.votes[bot.id] === undefined) {
            roomState.votes[bot.id] = gameDef.botVote(roomState, bot);
            if (roomState.game === 'trivia') roomState.currentData.voteTimes[bot.id] = Date.now() + 2500;
          }
        }
      });
      checkAllVotedAutoReveal();
    }

    function checkAllVotedAutoReveal() {
      if (!roomState) return;
      if (roomState.phase === 'writing' && roomState.game === 'escribio') {
        const subs = Object.keys(roomState.currentData.submissions || {});
        if (subs.length >= roomState.players.length && roomState.players.length > 0) {
          startEscribioVotingPhase();
        }
        return;
      }

      if (roomState.phase !== 'voting' || roomState.autoRevealEndsAt) return;
      const eligible = getEligibleVoters(roomState);
      if (eligible.length === 0) return;
      const allDone = eligible.every(p => roomState.votes[p.id] !== undefined);
      if (allDone) {
        roomState.autoRevealEndsAt = Date.now() + 3200;
        playTone(880, 0.08);
      }
    }

    function startEscribioVotingPhase() {
      const subs = roomState.currentData.submissions || {};
      const entries = shuffle(Object.entries(subs).map(([authorId, text]) => ({ authorId, text })));
      if (!entries.length) return;
      roomState.currentData.queue = entries;
      roomState.currentData.queueIdx = 0;
      roomState.currentData.currentAuthorId = entries[0].authorId;
      roomState.currentData.currentText = entries[0].text;
      roomState.votes = {};
      roomState.phase = 'voting';
      triggerBotActions();
    }

    function processTvInboxMessage(msg) {
      if (!roomState) return;

      if (msg.type === 'REQUEST_STATE') {
        broadcastRoomState();
        if (msg.playerId && privateRoundSecrets[msg.playerId]) {
          publishPacket(`${TOPIC_PREFIX}/${roomState.code}/p/${msg.playerId}`, {
            round: roomState.round,
            ...privateRoundSecrets[msg.playerId]
          }, true);
        }
        if (Object.keys(avatarCache).length) {
          publishPacket(`${TOPIC_PREFIX}/${roomState.code}/avatars`, avatarCache, true);
        }
        return;
      }

      if (msg.type === 'REACT' && msg.emoji) {
        spawnFloatingReaction(msg.emoji);
        playTone(720, 0.05, 'sine', 0.04);
        return;
      }

      if (msg.type === 'JOIN' && msg.player) {
        const existingIdx = roomState.players.findIndex(p => p.id === msg.player.id);
        if (existingIdx === -1 && roomState.locked) {
          publishPacket(`${TOPIC_PREFIX}/${roomState.code}/p/${msg.player.id}`, { rejected: 'Sala bloqueada por el anfitrión' }, false);
          return;
        }
        const hasHost = roomState.players.some(p => p.isHost);
        const grantHost = existingIdx !== -1
          ? roomState.players[existingIdx].isHost
          : (!hasHost && !!msg.player.isHost);

        if (existingIdx === -1) {
          roomState.players.push(makePlayerObj(msg.player.id, msg.player.name, msg.player.avatar, false, grantHost));
          showToast(`${msg.player.avatar} ${msg.player.name} entró a la sala`);
          playTone(587, 0.09);
        } else {
          roomState.players[existingIdx].name = String(msg.player.name).slice(0, 18);
          roomState.players[existingIdx].avatar = msg.player.avatar || roomState.players[existingIdx].avatar;
        }

        if (grantHost) {
          publishPacket(`${TOPIC_PREFIX}/${roomState.code}/p/${msg.player.id}`, {
            hostKey: roomState.hostKey,
            ...(privateRoundSecrets[msg.player.id] ? { round: roomState.round, ...privateRoundSecrets[msg.player.id] } : {})
          }, true);
        }
        broadcastRoomState();
        render();
        return;
      }

      if (msg.type === 'VOTE' && msg.playerId) {
        const player = roomState.players.find(p => p.id === msg.playerId);
        if (!player) return;
        const gameDef = GAMES[roomState.game];
        if (!gameDef) return;

        if (roomState.game === 'escribio' && roomState.phase === 'writing') {
          if (gameDef.validateVote(roomState, msg.playerId, msg.value)) {
            roomState.currentData.submissions[msg.playerId] = String(msg.value).trim().slice(0, 140);
            playTone(620, 0.06);
            checkAllVotedAutoReveal();
            broadcastRoomState();
            render();
          }
          return;
        }

        if (roomState.game === 'impostor' && roomState.phase === 'last_bullet') {
          if (gameDef.validateVote(roomState, msg.playerId, msg.value)) {
            const guess = String(msg.value).trim().toLowerCase();
            const target = String(roomState.currentData.revealedWord || '').trim().toLowerCase();
            roomState.currentData.lastBulletGuess = String(msg.value).trim();
            roomState.currentData.lastBulletSuccess = (guess === target);
            if (guess === target) {
              player.score = (player.score || 0) + 3;
              playFanfare();
            }
            roomState.phase = 'reveal';
            broadcastRoomState();
            render();
          }
          return;
        }

        if (roomState.phase === 'voting' && gameDef.validateVote(roomState, msg.playerId, msg.value)) {
          roomState.votes[msg.playerId] = msg.value;
          if (roomState.game === 'trivia' && !roomState.currentData.voteTimes[msg.playerId]) {
            roomState.currentData.voteTimes[msg.playerId] = Date.now();
          }
          playTone(640, 0.05);
          checkAllVotedAutoReveal();
          broadcastRoomState();
          render();
        }
        return;
      }

      if (msg.type === 'USE_WILDCARD' && msg.playerId) {
        const p = roomState.players.find(pl => pl.id === msg.playerId);
        if (p && p.wildcard === 'available' && ['pass', 'double', 'reverse'].includes(msg.card)) {
          p.wildcard = 'spent';
          roomState.wildcardsUsed[p.id] = msg.card;
          if (msg.card === 'pass' && roomState.phase === 'voting') {
            roomState.votes[p.id] = '__PASS__';
            checkAllVotedAutoReveal();
          }
          showToast(`🃏 ${p.name} usó comodín: ${msg.card.toUpperCase()}`);
          broadcastRoomState();
          render();
        }
        return;
      }

      if (msg.type === 'ADD_QUESTION' && msg.question) {
        const cleanQ = {
          cat: ['suave', 'delicada', 'cruel', 'brutal', 'profundo'].includes(msg.question.cat) ? msg.question.cat : 'suave',
          text: String(msg.question.text).trim().slice(0, 180)
        };
        if (cleanQ.text) {
          roomState.customQuestions.push(cleanQ);
          localStorage.setItem(STORAGE_KEYS.customQ, JSON.stringify(roomState.customQuestions));
          showToast('➕ Pregunta añadida al mazo');
          broadcastRoomState();
          render();
        }
        return;
      }

      if (msg.type === 'HOST_CMD') {
        if (msg.hostKey !== roomState.hostKey) return;
        executeHostCommand(msg.cmd, msg.payload, true);
      }
    }

    function executeHostCommand(cmd, payload = {}, authorized = false) {
      if (!roomState || !authorized) return;

      if (cmd === 'GO_LOBBY') {
        roomState.game = 'lobby';
        roomState.phase = 'lobby';
        roomState.activeTheme = 'lobby';
        roomState.votes = {};
        roomState.autoRevealEndsAt = 0;
        roomState.currentData = null;
        privateRoundSecrets = {};
      }

      if (cmd === 'SHOW_PODIUM') {
        roomState.phase = 'podium';
        playFanfare();
        launchConfetti();
      }

      if (cmd === 'TOGGLE_LOCK') {
        roomState.locked = !roomState.locked;
        showToast(roomState.locked ? '🔒 Sala cerrada a nuevos jugadores' : '🔓 Sala abierta');
      }

      if (cmd === 'CYCLE_PENALTY') {
        const order = ['drink', 'points', 'dares'];
        roomState.penaltyMode = order[(order.indexOf(roomState.penaltyMode) + 1) % order.length];
      }

      if (cmd === 'SET_MAX_ROUNDS') {
        roomState.maxRounds = Number(payload.rounds) || 0;
      }

      if (cmd === 'TOGGLE_NIGHT_MODE') {
        roomState.nightMode = !roomState.nightMode;
      }

      if (cmd === 'TOGGLE_ANON_YONUNCA') {
        roomState.anonYoNunca = !roomState.anonYoNunca;
      }

      if (cmd === 'SET_IMPOSTOR_VARIANT') {
        roomState.impostorVariant = payload.variant || 'classic';
      }

      if (cmd === 'START_GAME') {
        const gameKey = payload.game;
        const gDef = GAMES[gameKey];
        if (!gDef) return;
        if (roomState.players.length < gDef.minPlayers) {
          showToast(`⚠️ ${gDef.name} necesita mínimo ${gDef.minPlayers} jugadores (añade bots o espera)`);
          return;
        }
        roomState.game = gameKey;
        roomState.subMode = payload.subMode || 'mix';
        startNextRound(true);
        return;
      }

      if (cmd === 'SKIP_RULES') {
        if (roomState.phase === 'rules') {
          roomState.phase = roomState.postRulesPhase || 'voting';
          triggerBotActions();
        }
      }

      if (cmd === 'NEXT_IMPOSTOR_TURN') {
        if (roomState.game === 'impostor' && roomState.phase === 'clues') {
          if (roomState.currentData.turnIdx + 1 < roomState.currentData.turnOrder.length) {
            roomState.currentData.turnIdx++;
            roomState.currentData.turnEndsAt = Date.now() + 20000;
          } else {
            roomState.phase = 'voting';
            roomState.votes = {};
            triggerBotActions();
          }
        }
      }

      if (cmd === 'START_IMPOSTOR_VOTE') {
        if (roomState.game === 'impostor') {
          roomState.phase = 'voting';
          roomState.votes = {};
          triggerBotActions();
        }
      }

      if (cmd === 'NEXT_ROUND') {
        if (roomState.game === 'escribio' && roomState.currentData?.queueIdx + 1 < (roomState.currentData?.queue?.length || 0)) {
          roomState.currentData.queueIdx++;
          const nextItem = roomState.currentData.queue[roomState.currentData.queueIdx];
          roomState.currentData.currentAuthorId = nextItem.authorId;
          roomState.currentData.currentText = nextItem.text;
          roomState.votes = {};
          roomState.autoRevealEndsAt = 0;
          roomState.phase = 'voting';
          triggerBotActions();
        } else {
          startNextRound(false);
          return;
        }
      }

      if (cmd === 'REVEAL') {
        roomState.autoRevealEndsAt = 0;
        const gDef = GAMES[roomState.game];
        if (gDef && gDef.reveal) gDef.reveal(roomState);
        if (roomState.phase !== 'last_bullet') roomState.phase = 'reveal';
        playFanfare();
        launchConfetti();
      }

      if (cmd === 'TOGGLE_VOTERS') {
        roomState.revealVoterNames = !roomState.revealVoterNames;
      }

      setAmbientTheme(roomState.activeTheme || roomState.game);
      broadcastRoomState();
      render();
    }

    function startNextRound(isFirstGameRound = false) {
      if (!roomState) return;
      if (roomState.maxRounds > 0 && roomState.round >= roomState.maxRounds) {
        roomState.phase = 'podium';
        playFanfare();
        launchConfetti();
        broadcastRoomState();
        render();
        return;
      }

      roomState.round += 1;
      roomState.votes = {};
      roomState.wildcardsUsed = {};
      roomState.autoRevealEndsAt = 0;
      roomState.revealVoterNames = false;
      privateRoundSecrets = {};

      if (roomState.nightMode) {
        if (roomState.round <= 3) {
          roomState.game = roomState.round % 2 === 1 ? 'mente' : 'quien';
          roomState.subMode = 'suave';
        } else if (roomState.round <= 7) {
          const midGames = ['escribio', 'impostor', 'teconozco', 'quien'];
          roomState.game = midGames[roomState.round % midGames.length];
          roomState.subMode = 'cruel';
        } else {
          roomState.game = roomState.round % 2 === 0 ? 'quien' : 'verdad';
          roomState.subMode = 'profundo';
        }
      }

      if (roomState.round > 1 && roomState.round % 4 === 0) {
        const events = [
          { id: 'double', text: '⚡ EVENTO ALEATORIO: ¡Ronda Doble (x2 puntos / tragos)!' },
          { id: 'swap', text: '🔄 EVENTO ALEATORIO: ¡Todos se cambian un sitio a la derecha!' },
          { id: 'immunity', text: '🛡️ EVENTO ALEATORIO: ¡Inmunidad para el último del marcador!' }
        ];
        roomState.activeEvent = events[Math.floor(Math.random() * events.length)];
      } else {
        roomState.activeEvent = null;
      }

      const gDef = GAMES[roomState.game];
      if (!gDef) return;
      gDef.start(roomState, privateRoundSecrets);

      if (isFirstGameRound) {
        roomState.postRulesPhase = roomState.phase;
        roomState.phase = 'rules';
        roomState.rulesEndsAt = Date.now() + 5000;
      } else {
        triggerBotActions();
      }

      sendPrivateSecrets();
      setAmbientTheme(roomState.activeTheme || roomState.game);
      broadcastRoomState();
      render();
    }

    function saveMobileSession() {

    function sendToTvInbox(payload) {
      if (!mySession.roomCode) return;

    }

    async function captureSelfieAvatar() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 160, height: 160 } });
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        const canvas = document.createElement('canvas');
        canvas.width = 48;
        canvas.height = 48;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, 48, 48);
        stream.getTracks().forEach(t => t.stop());
        uiDraft.joinSelfie = canvas.toDataURL('image/jpeg', 0.72);
        showToast('📸 Selfie capturado');
        render(true);
      } catch (e) {
        showToast('⚠️ No se pudo acceder a la cámara (usa un icono)');
      }
    }

    function joinRoomFromMobile() {
      const code = uiDraft.joinCode.trim().toUpperCase();
      const name = uiDraft.joinName.trim();
      if (code.length < 4) return showToast('⚠️ Escribe el código de 4 letras de la TV');
      if (!name) return showToast('⚠️ Escribe tu nombre');

      mySession.roomCode = code;
      mySession.playerId = mySession.playerId || ('p_' + uid());
      mySession.playerName = name;
      mySession.avatar = uiDraft.joinAvatar;
      mySession.selfieData = uiDraft.joinSelfie || '';
      mySession.isHostController = uiDraft.joinAsHost;
      mySession.secretRevealed = false;
      saveMobileSession();
      requestWakeLock();

      joinStatusMsg = `Conectando a sala ${code}...`;
      render(true);

      if (mqttClient && mqttClient.connected) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/state`);
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/avatars`);
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/p/${mySession.playerId}`);
      }

      const sendJoin = () => {
        sendToTvInbox({
          type: 'JOIN',
          player: {
            id: mySession.playerId,
            name: mySession.playerName,
            avatar: mySession.avatar,
            isHost: mySession.isHostController
          }
        });
        if (mySession.selfieData) {
          avatarCache[mySession.playerId] = mySession.selfieData;
          publishPacket(`${TOPIC_PREFIX}/${code}/avatars`, { [mySession.playerId]: mySession.selfieData }, true);
        }
      };

      sendJoin();
      const retry = setInterval(() => {
        if (viewMode === 'mobile_play' || !joinTimeout) return clearInterval(retry);
        sendJoin();
      }, 1100);

      if (joinTimeout) clearTimeout(joinTimeout);
      joinTimeout = setTimeout(() => {
        clearInterval(retry);
        if (viewMode !== 'mobile_play') {
          joinStatusMsg = `No se encontró la sala "${code}". Revisa el código o prueba el modo Pasar Móvil.`;
          render(true);
        }
      }, 8500);
    }

    function handleIncomingPacket(topic, data) {
      if (!data) return;

      if (roomState && topic === `${TOPIC_PREFIX}/${roomState.code}/avatars`) {
        Object.assign(avatarCache, data);
        render();
        return;
      }

      if ((viewMode === 'tv' || viewMode === 'solo_test') && roomState && topic === `${TOPIC_PREFIX}/${roomState.code}/inbox`) {
        if (data.msgId && processedMsgIds.has(data.msgId)) return;
        if (data.msgId) {
          processedMsgIds.add(data.msgId);
          if (processedMsgIds.size > 400) processedMsgIds.delete(processedMsgIds.values().next().value);
        }
        processTvInboxMessage(data);
        return;
      }

      if (mySession.roomCode && mySession.playerId && topic === `${TOPIC_PREFIX}/${mySession.roomCode}/p/${mySession.playerId}`) {
        if (data.rejected) {
          joinStatusMsg = data.rejected;
          viewMode = 'mobile_join';
          render(true);
          return;
        }
        if (data.hostKey) {
          mySession.hostKey = data.hostKey;
          mySession.isHostController = true;
          saveMobileSession();
        }
        if (data.game) myPrivatePayload = data;
        render();
        return;
      }

      if ((viewMode === 'mobile_play' || viewMode === 'mobile_join') && mySession.roomCode && topic === `${TOPIC_PREFIX}/${mySession.roomCode}/state`) {
        if (data.code !== mySession.roomCode) return;
        roomState = data;

        if (roomState.round !== mySession.lastSeenRound) {
          mySession.secretRevealed = false;
          mySession.lastSeenRound = roomState.round;
          saveMobileSession();
        }

        if (roomState.game === 'impostor' && roomState.phase === 'clues') {
          const activeTurn = roomState.currentData?.turnOrder?.[roomState.currentData.turnIdx];
          if (activeTurn && activeTurn.id === mySession.playerId && mySession.lastVibratedTurn !== `${roomState.round}_${roomState.currentData.turnIdx}`) {
            mySession.lastVibratedTurn = `${roomState.round}_${roomState.currentData.turnIdx}`;
            vibrate([120, 60, 120]);
          }
        }

        if (joinTimeout) { clearTimeout(joinTimeout); joinTimeout = null; }
        if (viewMode === 'mobile_join') {
          viewMode = 'mobile_play';
          saveMobileSession();
        }
        setAmbientTheme(roomState.activeTheme || roomState.game);
        render();
      }
    }

    function spawnFloatingReaction(emoji) {
      const layer = document.getElementById('reactionLayer');
      if (!layer) return;
      const el = document.createElement('div');
      el.className = 'floating-emoji';
      el.textContent = emoji;
      el.style.left = (12 + Math.random() * 76) + '%';
      layer.appendChild(el);
      setTimeout(() => el.remove(), 2900);
    }

    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');
      const colors = ['#38bdf8', '#f472b6', '#facc15', '#34d399', '#a78bfa'];
      confettiParticles = Array.from({ length: 75 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 140,
        vx: (Math.random() - 0.5) * 4,
        vy: 3 + Math.random() * 4.5,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI * 2
      }));
      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      const step = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiParticles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += 0.08;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        });
        confettiParticles = confettiParticles.filter(p => p.y < canvas.height + 30);
        if (confettiParticles.length > 0) confettiAnimId = requestAnimationFrame(step);
      };
      step();
    }

    function downloadSummaryImage() {
      if (!roomState) return;
      const canvas = document.createElement('canvas');
      canvas.width = 900;
      canvas.height = 1100;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 900, 1100);
      grad.addColorStop(0, '#090d1e');
      grad.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 900, 1100);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 54px sans-serif';
      ctx.fillText('🏆 PartyOS · Resumen de la Noche', 60, 100);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '28px sans-serif';
      ctx.fillText(`Sala ${roomState.code} · ${roomState.round} rondas jugadas`, 60, 150);

      const sorted = [...roomState.players].sort((a, b) => (b.score || 0) - (a.score || 0));
      sorted.slice(0, 6).forEach((p, idx) => {
        const y = 240 + idx * 95;
        ctx.fillStyle = idx === 0 ? 'rgba(250,204,21,0.22)' : 'rgba(255,255,255,0.08)';
        ctx.fillRect(60, y - 48, 780, 76);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText(`#${idx + 1}  ${p.avatar} ${p.name}`, 85, y);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(`${p.score || 0} pts`, 690, y);
      });

      const awards = computeNightAwards(roomState);
      ctx.fillStyle = '#f472b6';
      ctx.font = 'bold 34px sans-serif';
      ctx.fillText('🎖️ Premios de la Noche', 60, 845);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '26px sans-serif';
      awards.slice(0, 3).forEach((aw, i) => {
        ctx.fillText(`${aw.title}: ${aw.winner}`, 60, 900 + i * 48);
      });

      const link = document.createElement('a');
      link.download = `PartyOS_Resumen_${roomState.code}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('🖼️ Imagen descargada lista para WhatsApp');
    }

    function computeNightAwards(state) {
      const players = state.players || [];
      if (!players.length) return [];
      const topVoted = [...players].sort((a, b) => (b.stats?.mostVoted || 0) - (a.stats?.mostVoted || 0))[0];
      const topImp = [...players].sort((a, b) => (b.stats?.impostorWins || 0) - (a.stats?.impostorWins || 0))[0];
      const topMente = [...players].sort((a, b) => (b.stats?.groupMatches || 0) - (a.stats?.groupMatches || 0))[0];
      const topTruth = [...players].sort((a, b) => (b.stats?.truthsGuessed || 0) - (a.stats?.truthsGuessed || 0))[0];
      return [
        { title: '🎯 El más señalado', winner: `${topVoted.avatar} ${topVoted.name} (${topVoted.stats?.mostVoted || 0})` },
        { title: '🕵️ Maestro del engaño', winner: `${topImp.avatar} ${topImp.name} (${topImp.stats?.impostorWins || 0})` },
        { title: '🧠 Mente colmena', winner: `${topMente.avatar} ${topMente.name} (${topMente.stats?.groupMatches || 0})` },
        { title: '🔍 Detector de trolas', winner: `${topTruth.avatar} ${topTruth.name} (${topTruth.stats?.truthsGuessed || 0})` }
      ];
    }

        return;

      const fp = getRenderFingerprint();
      if (!force && fp === lastRenderFingerprint) return;

      else if (viewMode === 'mobile_play') app.innerHTML = buildMobilePlayHtml();
