    /* =========================================================================
       6. HELPERS DE COLAS JUSTAS, HISTORIAL PERSISTENTE Y EVENTOS
       ========================================================================= */
    function getUsedIndices(gameKey) {
      try {
        const all = JSON.parse(localStorage.getItem(STORAGE_KEYS.usedIndices) || '{}');
        return all[gameKey] || [];
      } catch (e) { return []; }
    }

    function markUsedIndex(gameKey, idx) {
      try {
        const all = JSON.parse(localStorage.getItem(STORAGE_KEYS.usedIndices) || '{}');
        all[gameKey] = [...new Set([...(all[gameKey] || []), idx])];
        localStorage.setItem(STORAGE_KEYS.usedIndices, JSON.stringify(all));
      } catch (e) {}
    }

    function clearUsedIndices(gameKey) {
      try {
        const all = JSON.parse(localStorage.getItem(STORAGE_KEYS.usedIndices) || '{}');
        all[gameKey] = [];
        localStorage.setItem(STORAGE_KEYS.usedIndices, JSON.stringify(all));
      } catch (e) {}
    }

    // Multiplicador de puntos: evento de ronda doble + comodín Doble del jugador.
    function getScoreMultiplier(state, playerId) {
      let mult = state.activeEvent?.id === 'double' ? 2 : 1;
      if (state.wildcardsUsed?.[playerId] === 'double') mult *= 2;
      return mult;
    }

    function awardPoints(state, player, basePoints) {
      if (!player || !basePoints) return 0;
      const points = basePoints * getScoreMultiplier(state, player.id);
      player.score = (player.score || 0) + points;
      return points;
    }

    // Bolsa sin repetición: elige un elemento no usado y lo marca.
    // Al agotar la lista se vacía la bolsa y vuelve a empezar.
    function pickFreshItem(gameKey, pool, getKey) {
      if (!Array.isArray(pool) || pool.length === 0) return null;
      const keyOf = typeof getKey === 'function' ? getKey : (item) => String(item);
      const used = new Set(getUsedIndices(gameKey).map(String));
      let available = pool.filter(item => !used.has(String(keyOf(item))));
      if (!available.length) {
        clearUsedIndices(gameKey);
        available = pool;
      }
      const chosen = available[Math.floor(Math.random() * available.length)];
      markUsedIndex(gameKey, String(keyOf(chosen)));
      return chosen;
    }

    function pickFairQueuePlayer(state, queueProp) {
      state[queueProp] = (state[queueProp] || []).filter(id => state.players.some(p => p.id === id));
      if (state[queueProp].length === 0) {
        state[queueProp] = shuffle(state.players.map(p => p.id));
      }
      const nextId = state[queueProp].shift();
      return state.players.find(p => p.id === nextId) || state.players[0];
    }

    function isLastPlace(state, playerId) {
      if (state.players.length < 2) return false;
      const min = Math.min(...state.players.map(p => p.score || 0));
      const p = state.players.find(pl => pl.id === playerId);
      return p && (p.score || 0) === min;
    }

    function getEligibleVoters(state) {
      if (!state || !state.currentData) return state?.players || [];
      if (state.game === 'verdad') {
        return state.players.filter(p => p.id !== state.currentData.accusedId);
      }
      if (state.game === 'impostor' && state.currentData.activePlayerIds) {
        return state.players.filter(p => state.currentData.activePlayerIds.includes(p.id));
      }
      return state.players;
    }

    /* =========================================================================
       7. AUTORIDAD DE SALA EN TV (VALIDACIÓN, PRIVACIDAD Y AUTO-REVELADO)
       ========================================================================= */
    let privateRoundSecrets = {};

    function createTvRoom(mode = 'tv') {
      const code = generateRoomCode();
      const hostKey = uid();
      roomState = {
        code,
        hostKey,
        locked: false,
        penaltyMode: 'drink',
        nightMode: false,
        maxRounds: 0,
        anonYoNunca: false,
        impostorVariant: 'classic',
        game: 'lobby',
        activeTheme: 'lobby',
        subMode: 'mix',
        phase: 'lobby',
        round: 0,
        players: [],
        votes: {},
        wildcardsUsed: {},
        activeEvent: null,
        revealVoterNames: false,
        rulesEndsAt: 0,
        autoRevealEndsAt: 0,
        customQuestions: JSON.parse(localStorage.getItem(STORAGE_KEYS.customQ) || '[]'),
        truthQueue: [],
        teconozcoQueue: [],
        currentData: null,
        updatedAt: Date.now()
      };

      viewMode = mode;
      requestWakeLock();
      saveTvState();

      if (mqttClient && mqttClient.connected) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/inbox`);
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/avatars`);
      }

      startTvLoops();

      if (mode === 'solo_test') {
        mySession = {
          roomCode: code,
          playerId: 'solo_me',
          playerName: 'Tú (Host)',
          avatar: '👑',
          selfieData: '',
          isHostController: true,
          hostKey,
          secretRevealed: false,
          lastSeenRound: 0
        };
        roomState.players.push(makePlayerObj('solo_me', 'Tú (Host)', '👑', false, true));
        addTestBots(3);
      }

      broadcastRoomState();
      setAmbientTheme('lobby');
      render(true);
    }

    function makePlayerObj(id, name, avatar, isBot = false, isHost = false) {
      return {
        id,
        name: String(name).slice(0, 18),
        avatar: avatar || '🔥',
        score: 0,
        isBot,
        isHost,
        wildcard: 'available',
        lastSeen: Date.now(),
        stats: { mostVoted: 0, impostorWins: 0, truthsGuessed: 0, groupMatches: 0, writesGuessed: 0 }
      };
    }

    let lastTvSaveAt = 0;
    function saveTvState(force = false) {
      if (!roomState) return;
      const now = Date.now();
      if (!force && now - lastTvSaveAt < 1500) return;
      lastTvSaveAt = now;
      try { localStorage.setItem(STORAGE_KEYS.tvState, JSON.stringify(roomState)); } catch (e) {}
    }

    function startTvLoops() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        if (!roomState || (viewMode !== 'tv' && viewMode !== 'solo_test')) return;
        const now = Date.now();

        if (roomState.phase === 'rules' && roomState.rulesEndsAt && now >= roomState.rulesEndsAt) {
          finishRulesPhase();
          triggerBotActions();
          broadcastRoomState();
          render();
          return;
        }

        if (roomState.autoRevealEndsAt && now >= roomState.autoRevealEndsAt) {
          roomState.autoRevealEndsAt = 0;
          executeHostCommand('REVEAL', {}, true);
          return;
        }

        if (roomState.game === 'impostor' && roomState.phase === 'clues' && roomState.currentData) {
          if (now >= roomState.currentData.turnEndsAt) {
            if (roomState.currentData.turnIdx + 1 < roomState.currentData.turnOrder.length) {
              roomState.currentData.turnIdx++;
              roomState.currentData.turnEndsAt = now + 20000;
              playTone(660, 0.08);
              broadcastRoomState();
              render();
            } else {
              executeHostCommand('START_IMPOSTOR_VOTE', {}, true);
            }
            return;
          }
        }

        if (roomState.game === 'impostor' && roomState.phase === 'last_bullet' && roomState.currentData?.lastBulletEndsAt) {
          if (now >= roomState.currentData.lastBulletEndsAt) {
            roomState.phase = 'reveal';
            broadcastRoomState();
            render();
            return;
          }
        }

        if (roomState.game === 'trivia' && roomState.phase === 'voting' && roomState.currentData?.endsAt) {
          if (now >= roomState.currentData.endsAt) {
            executeHostCommand('REVEAL', {}, true);
            return;
          }
        }

        // Presencia: si un móvil no escribe en 45 s se marca como ausente.
        // El anfitrión y los bots no se marcan (no envían mensajes).
        let presenceChanged = false;
        roomState.players.forEach(p => {
          if (p.isBot || p.isHost) return;
          const online = !p.lastSeen || (now - p.lastSeen < 45000);
          if (p.online !== online) {
            p.online = online;
            presenceChanged = true;
          }
        });
        if (presenceChanged) render();

        broadcastRoomState();
      }, 600);
    }

    // Estado público que viaja por el broker: nunca debe filtrar secretos
    // (respuestas correctas, confesiones anónimas ni autores de la frase).
    function buildPublicRoomState() {
      const cleanData = roomState.currentData ? { ...roomState.currentData } : null;
      if (cleanData) {
        Object.keys(cleanData).forEach(k => { if (k.startsWith('_secret')) delete cleanData[k]; });
        // La respuesta correcta de la trivia y los tiempos de voto solo los usa la TV.
        delete cleanData.correct;
        delete cleanData.voteTimes;
        // Las confesiones de "¿Quién lo escribió?" son privadas hasta el reveal:
        // solo se difunde quién ha enviado ya su frase (sin el texto).
        if (cleanData.submissions) {
          cleanData.submittedIds = Object.keys(cleanData.submissions);
          delete cleanData.submissions;
        }
        // La cola de confesiones contiene el autor de cada frase: no se difunde.
        delete cleanData.queue;
        // Tampoco el autor de la frase que se está voting ahora mismo.
        delete cleanData.currentAuthorId;
      }
      return {
        ...roomState,
        hostKey: undefined,
        currentData: cleanData,
        updatedAt: Date.now()
      };
    }

    let lastBroadcastSig = '';
    let lastBroadcastAt = 0;
    function broadcastRoomState(force = false) {
      if (!roomState) return;
      const publicPayload = buildPublicRoomState();
      const sig = JSON.stringify({ ...publicPayload, updatedAt: 0 });
      const now = Date.now();
      // En hosting público no conviene spamear el broker: solo publicamos si
      // algo ha cambiado realmente (o cada 5 s como refresco de seguridad).
      if (!force && sig === lastBroadcastSig && now - lastBroadcastAt < 5000) {
        saveTvState();
        return;
      }
      lastBroadcastSig = sig;
      lastBroadcastAt = now;
      saveTvState();
      publishPacket(`${TOPIC_PREFIX}/${roomState.code}/state`, publicPayload, true);
    }

    function sendPrivateSecrets() {
      if (!roomState) return;
      // Se guardan en localStorage para poder reenviar los roles si la TV se
      // recarga o reanuda la sala (importante en móviles que se duermen).
      try { localStorage.setItem(STORAGE_KEYS.privateSecrets, JSON.stringify(privateRoundSecrets)); } catch (e) {}
      Object.entries(privateRoundSecrets).forEach(([playerId, secretObj]) => {
        const payload = { round: roomState.round, ...secretObj };
        if (playerId === mySession.playerId) myPrivatePayload = payload;
        publishPacket(`${TOPIC_PREFIX}/${roomState.code}/p/${playerId}`, payload, true);
      });
    }

    function loadPrivateSecrets() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.privateSecrets);
        privateRoundSecrets = raw ? JSON.parse(raw) : {};
      } catch (e) {
        privateRoundSecrets = {};
      }
      return privateRoundSecrets;
    }

    function clearPrivateSecrets() {
      privateRoundSecrets = {};
      try { localStorage.removeItem(STORAGE_KEYS.privateSecrets); } catch (e) {}
    }

    function addTestBots(count = 3) {
      if (!roomState) return;
      const botNames = ['Hugo', 'Paula', 'Mateo', 'Lucía', 'Diego', 'Carla', 'Álvaro', 'Sofía', 'Adrián'];
      let added = 0;
      for (const name of botNames) {
        if (added >= count) break;
        const id = 'bot_' + name.toLowerCase();
        if (!roomState.players.some(p => p.id === id)) {
          roomState.players.push(makePlayerObj(id, name, AVATARS[(roomState.players.length + 1) % AVATARS.length], true, false));
          added++;
        }
      }
      broadcastRoomState();
      render();
      showToast(`🤖 +${added} Bots añadidos`);
    }

    function triggerBotActions() {
      if (!roomState) return;
      const gameDef = GAMES[roomState.game];
      if (!gameDef || !gameDef.botVote) return;

      roomState.players.filter(p => p.isBot).forEach(bot => {
        if (roomState.phase === 'writing' && roomState.game === 'escribio') {
          if (!roomState.currentData.submissions[bot.id]) {
            roomState.currentData.submissions[bot.id] = gameDef.botVote(roomState, bot);
          }
        } else if (roomState.phase === 'voting') {
          if (roomState.game === 'verdad' && bot.id === roomState.currentData.accusedId) return;
          if (roomState.votes[bot.id] === undefined) {
            roomState.votes[bot.id] = gameDef.botVote(roomState, bot);
            if (roomState.game === 'trivia') roomState.currentData.voteTimes[bot.id] = Date.now() + 2500;
          }
        }
      });
      checkAllVotedAutoReveal();
    }

    function checkAllVotedAutoReveal() {
      if (!roomState) return;
      if (roomState.phase === 'writing' && roomState.game === 'escribio') {
        const subs = Object.keys(roomState.currentData.submissions || {});
        if (subs.length >= roomState.players.length && roomState.players.length > 0) {
          startEscribioVotingPhase();
        }
        return;
      }

      if (roomState.phase !== 'voting' || roomState.autoRevealEndsAt) return;
      const eligible = getEligibleVoters(roomState);
      if (eligible.length === 0) return;
      const allDone = eligible.every(p => roomState.votes[p.id] !== undefined);
      if (allDone) {
        roomState.autoRevealEndsAt = Date.now() + 3200;
        playTone(880, 0.08);
      }
    }

    function startEscribioVotingPhase() {
      const subs = roomState.currentData.submissions || {};
      const entries = shuffle(Object.entries(subs).map(([authorId, text]) => ({ authorId, text })));
      if (!entries.length) return;
      roomState.currentData.queue = entries;
      roomState.currentData.queueIdx = 0;
      roomState.currentData.currentAuthorId = entries[0].authorId;
      roomState.currentData.currentText = entries[0].text;
      roomState.votes = {};
      roomState.phase = 'voting';
      triggerBotActions();
    }

    function processTvInboxMessage(msg) {
      if (!roomState) return;

      // Presencia: cualquier mensaje de un jugador cuenta como "sigue aquí".
      if (msg.playerId) {
        const known = roomState.players.find(p => p.id === msg.playerId);
        if (known) {
          known.lastSeen = Date.now();
          if (known.online === false) {
            known.online = true;
            render();
          }
        }
      }

      if (msg.type === 'PING') return;

      if (msg.type === 'REQUEST_STATE') {
        broadcastRoomState(true);
        if (msg.playerId && privateRoundSecrets[msg.playerId]) {
          publishPacket(`${TOPIC_PREFIX}/${roomState.code}/p/${msg.playerId}`, {
            round: roomState.round,
            ...privateRoundSecrets[msg.playerId]
          }, true);
        }
        if (Object.keys(avatarCache).length) {
          publishPacket(`${TOPIC_PREFIX}/${roomState.code}/avatars`, avatarCache, true);
        }
        return;
      }

      if (msg.type === 'REACT' && msg.emoji) {
        spawnFloatingReaction(msg.emoji);
        playTone(720, 0.05, 'sine', 0.04);
        return;
      }

      if (msg.type === 'JOIN' && msg.player) {
        const existingIdx = roomState.players.findIndex(p => p.id === msg.player.id);
        if (existingIdx === -1 && roomState.locked) {
          publishPacket(`${TOPIC_PREFIX}/${roomState.code}/p/${msg.player.id}`, { rejected: 'Sala bloqueada por el anfitrión' }, false);
          return;
        }
        const hasHost = roomState.players.some(p => p.isHost);
        const grantHost = existingIdx !== -1
          ? roomState.players[existingIdx].isHost
          : (!hasHost && !!msg.player.isHost);

        if (existingIdx === -1) {
          roomState.players.push(makePlayerObj(msg.player.id, msg.player.name, msg.player.avatar, false, grantHost));
          showToast(`${msg.player.avatar} ${msg.player.name} entró a la sala`);
          playTone(587, 0.09);
        } else {
          roomState.players[existingIdx].name = String(msg.player.name).slice(0, 18);
          roomState.players[existingIdx].avatar = msg.player.avatar || roomState.players[existingIdx].avatar;
          roomState.players[existingIdx].lastSeen = Date.now();
          roomState.players[existingIdx].online = true;
        }

        if (grantHost) {
          publishPacket(`${TOPIC_PREFIX}/${roomState.code}/p/${msg.player.id}`, {
            hostKey: roomState.hostKey,
            ...(privateRoundSecrets[msg.player.id] ? { round: roomState.round, ...privateRoundSecrets[msg.player.id] } : {})
          }, true);
        }
        broadcastRoomState();
        render();
        return;
      }

      if (msg.type === 'VOTE' && msg.playerId) {
        const player = roomState.players.find(p => p.id === msg.playerId);
        if (!player) return;
        const gameDef = GAMES[roomState.game];
        if (!gameDef) return;

        if (roomState.game === 'escribio' && roomState.phase === 'writing') {
          if (gameDef.validateVote(roomState, msg.playerId, msg.value)) {
            roomState.currentData.submissions[msg.playerId] = String(msg.value).trim().slice(0, 140);
            playTone(620, 0.06);
            checkAllVotedAutoReveal();
            broadcastRoomState();
            render();
          }
          return;
        }

        if (roomState.game === 'impostor' && roomState.phase === 'last_bullet') {
          if (gameDef.validateVote(roomState, msg.playerId, msg.value)) {
            const guess = String(msg.value).trim().toLowerCase();
            const target = String(roomState.currentData.revealedWord || '').trim().toLowerCase();
            roomState.currentData.lastBulletGuess = String(msg.value).trim();
            roomState.currentData.lastBulletSuccess = (guess === target);
            if (guess === target) {
              awardPoints(roomState, player, 3);
              playFanfare();
            }
            roomState.phase = 'reveal';
            broadcastRoomState();
            render();
          }
          return;
        }

        if (roomState.phase === 'voting' && gameDef.validateVote(roomState, msg.playerId, msg.value)) {
          roomState.votes[msg.playerId] = msg.value;
          if (roomState.game === 'trivia' && !roomState.currentData.voteTimes[msg.playerId]) {
            roomState.currentData.voteTimes[msg.playerId] = Date.now();
          }
          playTone(640, 0.05);
          checkAllVotedAutoReveal();
          broadcastRoomState();
          render();
        }
        return;
      }

      if (msg.type === 'USE_WILDCARD' && msg.playerId) {
        const p = roomState.players.find(pl => pl.id === msg.playerId);
        if (!p || p.wildcard !== 'available' || !['pass', 'double', 'reverse'].includes(msg.card)) return;

        if (msg.card === 'pass' || msg.card === 'reverse') {
          const gameDef = GAMES[roomState.game];
          const canVote = roomState.phase === 'voting' && gameDef?.validateVote?.(roomState, p.id, '__PASS__');
          if (!canVote) {
            showToast('🃏 Ese comodín solo se puede usar durante la votación');
            return;
          }
        }
        if (msg.card === 'reverse' && roomState.votes[p.id] === undefined) {
          showToast('↩️ Reversa: vota primero y luego podrás cambiar tu voto');
          return;
        }

        p.wildcard = 'spent';
        roomState.wildcardsUsed[p.id] = msg.card;
        if (msg.card === 'pass') {
          roomState.votes[p.id] = '__PASS__';
          checkAllVotedAutoReveal();
        } else if (msg.card === 'reverse') {
          delete roomState.votes[p.id];
          roomState.autoRevealEndsAt = 0;
          showToast(`↩️ ${p.name} recuperó su voto. ¡Vuelve a votar!`);
        } else {
          showToast(`🃏 ${p.name} usó comodín: DOBLE`);
        }
        broadcastRoomState();
        render();
        return;
      }

      if (msg.type === 'ADD_QUESTION' && msg.question) {
        const cleanQ = {
          cat: ['suave', 'delicada', 'cruel', 'brutal', 'profundo'].includes(msg.question.cat) ? msg.question.cat : 'suave',
          text: String(msg.question.text).trim().slice(0, 180)
        };
        if (cleanQ.text) {
          roomState.customQuestions.push(cleanQ);
          localStorage.setItem(STORAGE_KEYS.customQ, JSON.stringify(roomState.customQuestions));
          showToast('➕ Pregunta añadida al mazo');
          broadcastRoomState();
          render();
        }
        return;
      }

      if (msg.type === 'HOST_CMD') {
        if (msg.hostKey !== roomState.hostKey) return;
        executeHostCommand(msg.cmd, msg.payload, true);
      }
    }

    function executeHostCommand(cmd, payload = {}, authorized = false) {
      if (!roomState || !authorized) return;

      if (cmd === 'GO_LOBBY') {
        roomState.game = 'lobby';
        roomState.phase = 'lobby';
        roomState.activeTheme = 'lobby';
        roomState.votes = {};
        roomState.autoRevealEndsAt = 0;
        roomState.rulesStartedAt = 0;
        roomState.rulesEndsAt = 0;
        roomState.currentData = null;
        clearPrivateSecrets();
      }

      if (cmd === 'SHOW_PODIUM') {
        roomState.phase = 'podium';
        playFanfare();
        launchConfetti();
      }

      if (cmd === 'REMOVE_PLAYER' && payload.playerId) {
        const p = roomState.players.find(pl => pl.id === payload.playerId);
        if (p && !p.isBot && !p.isHost) {
          roomState.players = roomState.players.filter(pl => pl.id !== payload.playerId);
          delete roomState.votes[p.id];
          delete roomState.wildcardsUsed[p.id];
          delete privateRoundSecrets[p.id];
          showToast(`🚪 ${p.name} salió de la sala`);
          playTone(320, 0.12, 'triangle', 0.05);
          broadcastRoomState(true);
          render();
        }
        return;
      }

      if (cmd === 'CLOSE_ROOM') {
        publishPacket(`${TOPIC_PREFIX}/${roomState.code}/state`, { code: roomState.code, closed: true }, true);
        try { localStorage.removeItem(STORAGE_KEYS.tvState); } catch (e) {}
        clearPrivateSecrets();
        roomState = null;
        viewMode = 'home';
        setAmbientTheme('lobby');
        showToast('👋 Sala cerrada. Los móviles se desconectarán.');
        render(true);
        return;
      }

      if (cmd === 'TOGGLE_LOCK') {
        roomState.locked = !roomState.locked;
        showToast(roomState.locked ? '🔒 Sala cerrada a nuevos jugadores' : '🔓 Sala abierta');
      }

      if (cmd === 'CYCLE_PENALTY') {
        const order = ['drink', 'points', 'dares'];
        roomState.penaltyMode = order[(order.indexOf(roomState.penaltyMode) + 1) % order.length];
      }

      if (cmd === 'SET_MAX_ROUNDS') {
        roomState.maxRounds = Number(payload.rounds) || 0;
      }

      if (cmd === 'TOGGLE_NIGHT_MODE') {
        roomState.nightMode = !roomState.nightMode;
      }

      if (cmd === 'TOGGLE_ANON_YONUNCA') {
        roomState.anonYoNunca = !roomState.anonYoNunca;
      }

      if (cmd === 'SET_IMPOSTOR_VARIANT') {
        roomState.impostorVariant = payload.variant || 'classic';
      }

      if (cmd === 'START_GAME') {
        const gameKey = payload.game;
        const gDef = GAMES[gameKey];
        if (!gDef) return;
        if (roomState.players.length < gDef.minPlayers) {
          showToast(`⚠️ ${gDef.name} necesita mínimo ${gDef.minPlayers} jugadores (añade bots o espera)`);
          return;
        }
        roomState.game = gameKey;
        roomState.subMode = payload.subMode || 'mix';
        startNextRound(true);
        return;
      }

      if (cmd === 'SKIP_RULES') {
        if (roomState.phase === 'rules') {
          finishRulesPhase();
          triggerBotActions();
        }
      }

      if (cmd === 'NEXT_IMPOSTOR_TURN') {
        if (roomState.game === 'impostor' && roomState.phase === 'clues') {
          if (roomState.currentData.turnIdx + 1 < roomState.currentData.turnOrder.length) {
            roomState.currentData.turnIdx++;
            roomState.currentData.turnEndsAt = Date.now() + 20000;
          } else {
            roomState.phase = 'voting';
            roomState.votes = {};
            triggerBotActions();
          }
        }
      }

      if (cmd === 'START_IMPOSTOR_VOTE') {
        if (roomState.game === 'impostor') {
          roomState.phase = 'voting';
          roomState.votes = {};
          triggerBotActions();
        }
      }

      if (cmd === 'NEXT_ROUND') {
        if (roomState.game === 'escribio' && roomState.currentData?.queueIdx + 1 < (roomState.currentData?.queue?.length || 0)) {
          roomState.currentData.queueIdx++;
          const nextItem = roomState.currentData.queue[roomState.currentData.queueIdx];
          roomState.currentData.currentAuthorId = nextItem.authorId;
          roomState.currentData.currentText = nextItem.text;
          roomState.votes = {};
          roomState.autoRevealEndsAt = 0;
          roomState.phase = 'voting';
          triggerBotActions();
        } else {
          startNextRound(false);
          return;
        }
      }

      if (cmd === 'REVEAL') {
        roomState.autoRevealEndsAt = 0;
        const gDef = GAMES[roomState.game];
        if (gDef && gDef.reveal) gDef.reveal(roomState);
        if (roomState.phase !== 'last_bullet') roomState.phase = 'reveal';
        playFanfare();
        launchConfetti();
      }

      if (cmd === 'TOGGLE_VOTERS') {
        roomState.revealVoterNames = !roomState.revealVoterNames;
      }

      setAmbientTheme(roomState.activeTheme || roomState.game);
      broadcastRoomState();
      render();
    }

    function finishRulesPhase() {
      if (!roomState) return;
      const startedAt = roomState.rulesStartedAt || 0;
      const endsAt = roomState.rulesEndsAt || Date.now();
      const elapsed = startedAt ? Math.max(0, Math.min(Date.now(), endsAt) - startedAt) : 0;
      if (roomState.currentData && elapsed > 0) {
        ['startAt', 'endsAt', 'turnEndsAt', 'lastBulletEndsAt'].forEach(key => {
          if (typeof roomState.currentData[key] === 'number') roomState.currentData[key] += elapsed;
        });
      }
      roomState.rulesStartedAt = 0;
      roomState.rulesEndsAt = 0;
      roomState.phase = roomState.postRulesPhase || 'voting';
    }

    function startNextRound(isFirstGameRound = false) {
      if (!roomState) return;
      if (roomState.maxRounds > 0 && roomState.round >= roomState.maxRounds) {
        roomState.phase = 'podium';
        playFanfare();
        launchConfetti();
        broadcastRoomState();
        render();
        return;
      }

      roomState.round += 1;
      roomState.votes = {};
      roomState.wildcardsUsed = {};
      roomState.autoRevealEndsAt = 0;
      roomState.revealVoterNames = false;
      roomState.rulesStartedAt = 0;
      roomState.rulesEndsAt = 0;
      clearPrivateSecrets();

      if (roomState.nightMode) {
        if (roomState.round <= 3) {
          roomState.game = roomState.round % 2 === 1 ? 'mente' : 'quien';
          roomState.subMode = 'suave';
        } else if (roomState.round <= 7) {
          const midGames = ['escribio', 'impostor', 'teconozco', 'quien'];
          roomState.game = midGames[roomState.round % midGames.length];
          roomState.subMode = 'cruel';
        } else {
          roomState.game = roomState.round % 2 === 0 ? 'quien' : 'verdad';
          roomState.subMode = 'profundo';
        }
      }

      if (roomState.round > 1 && roomState.round % 4 === 0) {
        const events = EVENTS_LIST;
        roomState.activeEvent = pickFreshItem('events', events, e => e.id) || events[0];
      } else {
        roomState.activeEvent = null;
      }

      const gDef = GAMES[roomState.game];
      if (!gDef) return;
      gDef.start(roomState, privateRoundSecrets);

      if (isFirstGameRound) {
        const rulesMs = 5000;
        roomState.postRulesPhase = roomState.phase;
        roomState.phase = 'rules';
        roomState.rulesStartedAt = Date.now();
        roomState.rulesEndsAt = roomState.rulesStartedAt + rulesMs;
      } else {
        triggerBotActions();
      }

      sendPrivateSecrets();
      setAmbientTheme(roomState.activeTheme || roomState.game);
      broadcastRoomState();
      render();
    }

    /* =========================================================================
       8. MÓVIL: CONEXIÓN, SELFIE 48x48 Y ENVÍO DE ACCIONES
       ========================================================================= */
    function saveMobileSession() {
      try { localStorage.setItem(STORAGE_KEYS.mobileSession, JSON.stringify(mySession)); } catch (e) {}
    }

    function sendToTvInbox(payload) {
      if (!mySession.roomCode) return;
      publishPacket(`${TOPIC_PREFIX}/${mySession.roomCode}/inbox`, { ...payload, msgId: uid() }, false);
    }

    // Latido del móvil: permite a la TV saber que el jugador sigue conectado
    // (y no marcarlo como ausente si el móvil se duerme un momento).
    let mobileHeartbeatTimer = null;
    function startMobileHeartbeat() {
      if (mobileHeartbeatTimer) clearInterval(mobileHeartbeatTimer);
      mobileHeartbeatTimer = setInterval(() => {
        if (viewMode !== 'mobile_play' || !mySession.roomCode) return;
        sendToTvInbox({ type: 'PING', playerId: mySession.playerId });
      }, 15000);
    }

    async function captureSelfieAvatar() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 160, height: 160 } });
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        const canvas = document.createElement('canvas');
        canvas.width = 48;
        canvas.height = 48;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, 48, 48);
        stream.getTracks().forEach(t => t.stop());
        uiDraft.joinSelfie = canvas.toDataURL('image/jpeg', 0.72);
        showToast('📸 Selfie capturado');
        render(true);
      } catch (e) {
        showToast('⚠️ No se pudo acceder a la cámara (usa un icono)');
      }
    }

    let joinRetryTimer = null;

    function joinRoomFromMobile() {
      const code = uiDraft.joinCode.trim().toUpperCase();
      const name = uiDraft.joinName.trim();
      if (code.length < 4) return showToast('⚠️ Escribe el código de 4 letras de la TV');
      if (!name) return showToast('⚠️ Escribe tu nombre');

      mySession.roomCode = code;
      mySession.playerId = mySession.playerId || ('p_' + uid());
      mySession.playerName = name;
      mySession.avatar = uiDraft.joinAvatar;
      mySession.selfieData = uiDraft.joinSelfie || '';
      mySession.isHostController = uiDraft.joinAsHost;
      mySession.secretRevealed = false;
      mySession.confirmedInRoom = false;
      kickedFromRoom = false;
      saveMobileSession();
      try { localStorage.setItem(STORAGE_KEYS.lastName, name); } catch (e) {}
      requestWakeLock();

      joinStatusMsg = `Conectando a sala ${code}...`;
      render(true);

      if (mqttClient && mqttClient.connected) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/state`);
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/avatars`);
        mqttClient.subscribe(`${TOPIC_PREFIX}/${code}/p/${mySession.playerId}`);
      }

      const sendJoin = () => {
        sendToTvInbox({
          type: 'JOIN',
          player: {
            id: mySession.playerId,
            name: mySession.playerName,
            avatar: mySession.avatar,
            isHost: mySession.isHostController
          }
        });
        if (mySession.selfieData) {
          avatarCache[mySession.playerId] = mySession.selfieData;
          publishPacket(`${TOPIC_PREFIX}/${code}/avatars`, { [mySession.playerId]: mySession.selfieData }, true);
        }
      };

      sendJoin();
      // Reintento continuo: si el móvil entra antes de que la TV esté lista o la
      // red va y viene, el JOIN se sigue reenviando hasta conectar de verdad.
      if (joinRetryTimer) clearInterval(joinRetryTimer);
      joinRetryTimer = setInterval(() => {
        if (viewMode !== 'mobile_join' && mySession.confirmedInRoom) return clearInterval(joinRetryTimer);
        if (joinTimeout && Date.now() > joinTimeout && viewMode === 'mobile_join') {
          joinStatusMsg = `Sigo buscando la sala "${code}"... (puedes reintentar cuando quieras)`;
          render(true);
        }
        sendJoin();
      }, 1500);

      if (joinTimeout) clearTimeout(joinTimeout);
      joinTimeout = setTimeout(() => {
        if (viewMode !== 'mobile_play') {
          joinStatusMsg = `No se encontró la sala "${code}". Revisa el código o prueba el modo Pasar Móvil.`;
          render(true);
        }
      }, 8500);
    }

    function handleIncomingPacket(topic, data) {
      if (!data) return;

      if (roomState && topic === `${TOPIC_PREFIX}/${roomState.code}/avatars`) {
        Object.assign(avatarCache, data);
        render();
        return;
      }

      if ((viewMode === 'tv' || viewMode === 'solo_test') && roomState && topic === `${TOPIC_PREFIX}/${roomState.code}/inbox`) {
        if (data.msgId && processedMsgIds.has(data.msgId)) return;
        if (data.msgId) {
          processedMsgIds.add(data.msgId);
          if (processedMsgIds.size > 400) processedMsgIds.delete(processedMsgIds.values().next().value);
        }
        processTvInboxMessage(data);
        return;
      }

      if (mySession.roomCode && mySession.playerId && topic === `${TOPIC_PREFIX}/${mySession.roomCode}/p/${mySession.playerId}`) {
        if (data.rejected) {
          joinStatusMsg = data.rejected;
          viewMode = 'mobile_join';
          render(true);
          return;
        }
        if (data.hostKey) {
          mySession.hostKey = data.hostKey;
          mySession.isHostController = true;
          saveMobileSession();
        }
        if (data.game) myPrivatePayload = data;
        render();
        return;
      }

      if ((viewMode === 'mobile_play' || viewMode === 'mobile_join') && mySession.roomCode && topic === `${TOPIC_PREFIX}/${mySession.roomCode}/state`) {
        if (data.code !== mySession.roomCode) return;

        // El anfitrión ha cerrado la sala: el móvil vuelve a la portada.
        if (data.closed) {
          if (joinRetryTimer) { clearInterval(joinRetryTimer); joinRetryTimer = null; }
          if (joinTimeout) { clearTimeout(joinTimeout); joinTimeout = null; }
          try { localStorage.removeItem(STORAGE_KEYS.mobileSession); } catch (e) {}
          mySession.roomCode = '';
          viewMode = 'home';
          showToast('👋 El anfitrión ha cerrado la sala');
          render(true);
          return;
        }

        roomState = data;

        // Si el anfitrión nos ha sacado de la sala, avisamos al jugador.
        const iAmIn = (roomState.players || []).some(p => p.id === mySession.playerId);
        if (iAmIn) {
          mySession.confirmedInRoom = true;
          kickedFromRoom = false;
        } else if (mySession.confirmedInRoom && (roomState.players || []).length) {
          if (!kickedFromRoom) {
            kickedFromRoom = true;
            showToast('🚪 Te han sacado de la sala');
            vibrate([80, 60, 80]);
          }
        }

        if (roomState.round !== mySession.lastSeenRound) {
          mySession.secretRevealed = false;
          mySession.lastSeenRound = roomState.round;
          saveMobileSession();
        }

        if (roomState.game === 'impostor' && roomState.phase === 'clues') {
          const activeTurn = roomState.currentData?.turnOrder?.[roomState.currentData.turnIdx];
          if (activeTurn && activeTurn.id === mySession.playerId && mySession.lastVibratedTurn !== `${roomState.round}_${roomState.currentData.turnIdx}`) {
            mySession.lastVibratedTurn = `${roomState.round}_${roomState.currentData.turnIdx}`;
            vibrate([120, 60, 120]);
          }
        }

        if (joinTimeout) { clearTimeout(joinTimeout); joinTimeout = null; }
        if (viewMode === 'mobile_join') {
          viewMode = 'mobile_play';
          if (joinRetryTimer) { clearInterval(joinRetryTimer); joinRetryTimer = null; }
          saveMobileSession();
          startMobileHeartbeat();
          showToast(`✅ Conectado a la sala ${mySession.roomCode}`);
        }
        setAmbientTheme(roomState.activeTheme || roomState.game);
        render();
      }
    }

    /* =========================================================================
       9. REACCIONES FLOTANTES, CONFETI EN CANVAS Y RESUMEN WHATSAPP PNG
       ========================================================================= */
    function spawnFloatingReaction(emoji) {
      const layer = document.getElementById('reactionLayer');
      if (!layer) return;
      const el = document.createElement('div');
      el.className = 'floating-emoji';
      el.textContent = emoji;
      el.style.left = (12 + Math.random() * 76) + '%';
      layer.appendChild(el);
      setTimeout(() => el.remove(), 2900);
    }

    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');
      const colors = ['#38bdf8', '#f472b6', '#facc15', '#34d399', '#a78bfa'];
      confettiParticles = Array.from({ length: 75 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 140,
        vx: (Math.random() - 0.5) * 4,
        vy: 3 + Math.random() * 4.5,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI * 2
      }));
      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      const step = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiParticles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += 0.08;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        });
        confettiParticles = confettiParticles.filter(p => p.y < canvas.height + 30);
        if (confettiParticles.length > 0) confettiAnimId = requestAnimationFrame(step);
      };
      step();
    }

    function downloadSummaryImage() {
      if (!roomState) return;
      const canvas = document.createElement('canvas');
      canvas.width = 900;
      canvas.height = 1100;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 900, 1100);
      grad.addColorStop(0, '#090d1e');
      grad.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 900, 1100);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 54px sans-serif';
      ctx.fillText('🏆 PartyOS · Resumen de la Noche', 60, 100);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '28px sans-serif';
      ctx.fillText(`Sala ${roomState.code} · ${roomState.round} rondas jugadas`, 60, 150);

      const sorted = [...roomState.players].sort((a, b) => (b.score || 0) - (a.score || 0));
      sorted.slice(0, 6).forEach((p, idx) => {
        const y = 240 + idx * 95;
        ctx.fillStyle = idx === 0 ? 'rgba(250,204,21,0.22)' : 'rgba(255,255,255,0.08)';
        ctx.fillRect(60, y - 48, 780, 76);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText(`#${idx + 1}  ${p.avatar} ${p.name}`, 85, y);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(fmtPts(p.score || 0), 690, y);
      });

      const awards = computeNightAwards(roomState);
      ctx.fillStyle = '#f472b6';
      ctx.font = 'bold 34px sans-serif';
      ctx.fillText('🎖️ Premios de la Noche', 60, 845);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '26px sans-serif';
      awards.slice(0, 3).forEach((aw, i) => {
        ctx.fillText(`${aw.title}: ${aw.winner}`, 60, 900 + i * 48);
      });

      const link = document.createElement('a');
      link.download = `PartyOS_Resumen_${roomState.code}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('🖼️ Imagen descargada lista para WhatsApp');
    }

    function computeNightAwards(state) {
      const players = state.players || [];
      if (!players.length) return [];
      const topVoted = [...players].sort((a, b) => (b.stats?.mostVoted || 0) - (a.stats?.mostVoted || 0))[0];
      const topImp = [...players].sort((a, b) => (b.stats?.impostorWins || 0) - (a.stats?.impostorWins || 0))[0];
      const topMente = [...players].sort((a, b) => (b.stats?.groupMatches || 0) - (a.stats?.groupMatches || 0))[0];
      const topTruth = [...players].sort((a, b) => (b.stats?.truthsGuessed || 0) - (a.stats?.truthsGuessed || 0))[0];
      return [
        { title: '🎯 El más señalado', winner: `${topVoted.avatar} ${topVoted.name} (${topVoted.stats?.mostVoted || 0})` },
        { title: '🕵️ Maestro del engaño', winner: `${topImp.avatar} ${topImp.name} (${topImp.stats?.impostorWins || 0})` },

       10. RENDERIZADO DIFERENCIAL SIN PARPADEO + RELOJ INDEPENDIENTE
       ========================================================================= */
    function getRenderFingerprint() {
      if (!roomState) return `${viewMode}|${joinStatusMsg}|${uiDraft.joinAvatar}|${uiDraft.joinSelfie ? 1 : 0}|${JSON.stringify(passPlayState)}`;
      const stateClone = {
        ...roomState,
        updatedAt: 0
      };
      return JSON.stringify({
        viewMode,
        stateClone,
        mySession,
        myPrivatePayload,
        uiDraft: {
          showCustomQDrawer: uiDraft.showCustomQDrawer,
          customQCat: uiDraft.customQCat
        }
      });
    }

    function render(force = false) {
      const activeEl = document.activeElement;
      if (!force && activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT')) {
        return;
      }

      const fp = getRenderFingerprint();
      if (!force && fp === lastRenderFingerprint) return;
      lastRenderFingerprint = fp;

      const pPill = document.getElementById('penaltyPill');
      if (pPill) {
        const mode = roomState?.penaltyMode || 'drink';
        pPill.textContent = mode === 'drink' ? '🍻 Modo: Beber' : mode === 'points' ? '🏆 Modo: Puntos' : '🎲 Modo: Retos';
      }

      const app = document.getElementById('app');
      if (!app) return;
      updatePageTitle();

      if (viewMode === 'home') app.innerHTML = buildHomeHtml();
      else if (viewMode === 'tv') app.innerHTML = buildTvScreenHtml();
      else if (viewMode === 'mobile_join') app.innerHTML = buildMobileJoinHtml();
      else if (viewMode === 'mobile_play') app.innerHTML = buildMobilePlayHtml();
      else if (viewMode === 'pass_play') app.innerHTML = buildPassPlayHtml();
      else if (viewMode === 'solo_test') {
        app.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
            <span class="badge">🧪 Prueba Solo · TV + Tu Móvil</span>
            <button class="btn btn-sm" data-action="EXIT_HOME">Salir</button>
          </div>
          <div class="split-preview">
            <div>${buildTvScreenHtml()}</div>
            <div>${buildMobilePlayHtml()}</div>
          </div>
        `;
      }

      requestAnimationFrame(() => {
        document.querySelectorAll('.result-fill[data-target-pct]').forEach((bar, i) => {
          setTimeout(() => { bar.style.width = bar.dataset.targetPct + '%'; }, i * 90);
        });
      });

      renderDebugPanel();
    }

    setInterval(() => {
      const now = Date.now();
      document.querySelectorAll('[data-ends-at]').forEach(el => {
        const end = Number(el.dataset.endsAt);
        if (!end) return;
        const left = Math.max(0, Math.ceil((end - now) / 1000));
        if (el.textContent !== String(left)) el.textContent = String(left);
      });
    }, 200);

                    ${renderPlayerAvatar(p)} <span>${esc(p.name)}</span>
                    <span>${roomState.votes[p.id] !== undefined ? '✅' : '⏳'}</span>

        } else if (roomState.phase === 'last_bullet') {
          const imps = roomState.players.filter(p => d.revealedImpostorIds?.includes(p.id));
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge badge-brutal">🎯 ¡IMPOSTOR PILLADO! · <span data-ends-at="${d.lastBulletEndsAt}">18</span>s</span>
              <div class="tv-question">${imps.map(i => esc(i.name)).join(' y ')} puede adivinar la palabra secreta en su móvil</div>
              <button class="btn" data-action="TV_CMD" data-cmd="REVEAL">Saltar intento</button>
            </div>
          `;
        } else {
          const imps = roomState.players.filter(p => d.revealedImpostorIds?.includes(p.id));
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge badge-brutal">🕵️ Resolución</span>
              <div class="tv-question">Impostor: ${imps.map(i => esc(i.name)).join(', ')}</div>
              <p style="font-size:1.4rem;margin-bottom:10px;">Palabra secreta: <strong>${esc(d.revealedWord)}</strong></p>
              ${d.lastBulletGuess ? `<p class="muted" style="margin-bottom:14px;">Intento Última Bala: «${esc(d.lastBulletGuess)}» (${d.lastBulletSuccess ? '✅ ¡ACERTÓ Y ROBA LA VICTORIA!' : '❌ Falló'})</p>` : ''}
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="NEXT_ROUND">Nueva Ronda ➡️</button>
            </div>
          `;
        }
      }

      if (roomState.game === 'escribio') {
        const d = roomState.currentData;
        if (roomState.phase === 'writing') {
          const subCount = Object.keys(d.submissions || {}).length;
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge">✍️ Fase de Escritura Secreta (${subCount}/${roomState.players.length})</span>
              <div class="tv-question">«${esc(d.prompt)}»</div>
              <p class="muted" style="margin-bottom:18px;">Escribid vuestra respuesta en el móvil sin que nadie mire.</p>
              <div class="players-wrap" style="margin-bottom:20px;">
                ${roomState.players.map(p => `
                  <div class="player-chip ${d.submissions?.[p.id] ? 'voted' : ''}">
                    ${renderPlayerAvatar(p)} <span>${esc(p.name)}</span>
                    <span>${d.submissions?.[p.id] ? '✅' : '✍️'}</span>

            </div>

        } else if (roomState.phase === 'voting') {
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge">✍️ Frase ${d.queueIdx + 1} de ${d.queue.length} · ¿Quién lo escribió?</span>
              <div class="tv-question">«${esc(d.currentText)}»</div>
              <p class="muted" style="margin-bottom:16px;">Votad en el móvil de quién es (${votedCount}/${eligible.length})</p>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="REVEAL">Destapar Autor</button>
            </div>
          `;
        } else {
          const author = roomState.players.find(p => p.id === d.currentAuthorId);
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge">✍️ Autor Descubierto</span>
              <div class="tv-question">«${esc(d.currentText)}»</div>
              <p style="font-size:1.6rem;margin-bottom:20px;">Lo escribió: <strong>${author ? `${author.avatar} ${esc(author.name)}` : 'Anónimo'}</strong></p>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="NEXT_ROUND">Siguiente ➡️</button>
            </div>
          `;
        }
      }

      if (roomState.game === 'mente') {
        const d = roomState.currentData;
        if (roomState.phase === 'voting') {
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge">🧩 Piensa como el grupo (${votedCount}/${eligible.length})</span>
              <div class="tv-question">${esc(d.prompt)}</div>
              <div class="grid-2" style="max-width:740px;margin:0 auto 20px;">
                ${d.options.map((opt, idx) => `<div class="glass-subcard"><strong>${idx + 1}. ${esc(opt)}</strong></div>`).join('')}
              </div>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="REVEAL">Ver Mayoría</button>
            </div>
          `;
        } else {
          bodyHtml = `
            <div style="text-align:center;">

                  return `
                    <div class="glass-subcard" style="margin-bottom:10px;">
                      <strong>${esc(opt)} (${voters.length})</strong>
                      <div class="muted small" style="margin-top:4px;">${voters.map(v => esc(v.name)).join(', ') || 'Nadie'}</div>
                    </div>

            </div>

        if (roomState.phase === 'voting') {

          const winners = roomState.players.filter(p => p.id !== d.subjectId && roomState.votes[p.id] === ans);
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge">🎯 Respuesta de ${esc(d.subjectName)}</span>

            </div>

        }

      if (roomState.game === 'trivia') {
        const d = roomState.currentData;
        if (roomState.phase === 'voting') {
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge">⚡ Trivia Rápida · <span data-ends-at="${d.endsAt}">15</span>s</span>

              <div class="grid-2" style="max-width:760px;margin:0 auto 18px;">
                ${d.options.map((opt, idx) => `<div class="glass-subcard"><strong>${idx + 1}. ${esc(opt)}</strong></div>`).join('')}
              </div>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="REVEAL">Ver Respuesta Correcta</button>
            </div>

        } else {
          const winners = roomState.players.filter(p => String(roomState.votes[p.id]) === String(d.correct));
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge badge-suave">✅ Respuesta Correcta</span>
              <div class="tv-question">${esc(d.options[d.correct])}</div>
              <p class="muted" style="margin-bottom:20px;">Acertaron: ${winners.map(w => esc(w.name)).join(', ') || 'Nadie'}</p>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="NEXT_ROUND">Siguiente Pregunta ➡️</button>
            </div>
          `;
        }
      }

      if (roomState.game === 'dilemas') {
        const d = roomState.currentData;
        if (roomState.phase === 'voting') {
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge">⚖️ Dilemas Extremos (${votedCount}/${eligible.length})</span>
              <div class="grid-2" style="margin:20px 0;">
                <div class="glass-subcard"><div class="badge">🅰️ Opción A</div><p style="font-size:1.45rem;font-weight:750;margin-top:8px;">${esc(d.a)}</p></div>
                <div class="glass-subcard"><div class="badge">🅱️ Opción B</div><p style="font-size:1.45rem;font-weight:750;margin-top:8px;">${esc(d.b)}</p></div>
              </div>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="REVEAL">Ver Resultados</button>
            </div>
          `;
        } else {
          const listA = roomState.players.filter(p => roomState.votes[p.id] === 'A');
          const listB = roomState.players.filter(p => roomState.votes[p.id] === 'B');
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge">⚖️ Minoría recibe: ${esc(eventPenalty(1))}</span>
              <div class="grid-2" style="margin:20px 0;text-align:left;">
                <div class="glass-subcard"><h3>🅰️ Opción A (${listA.length})</h3><p class="muted small">${esc(d.a)}</p><div class="players-wrap" style="justify-content:flex-start;margin-top:10px;">${listA.map(p => `<span class="player-chip">${esc(p.name)}</span>`).join('')}</div></div>
                <div class="glass-subcard"><h3>🅱️ Opción B (${listB.length})</h3><p class="muted small">${esc(d.b)}</p><div class="players-wrap" style="justify-content:flex-start;margin-top:10px;">${listB.map(p => `<span class="player-chip">${esc(p.name)}</span>`).join('')}</div></div>
              </div>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="NEXT_ROUND">Siguiente Dilema ➡️</button>
            </div>
          `;
        }
      }

      if (roomState.game === 'yonunca') {
        const y = roomState.currentData;
        if (roomState.phase === 'voting') {
          bodyHtml = `
            <div style="text-align:center;">
              <div style="margin-bottom:10px;">
                <button class="btn btn-sm ${roomState.anonYoNunca ? 'active-pill' : ''}" data-action="TV_CMD" data-cmd="TOGGLE_ANON_YONUNCA">
                  ${roomState.anonYoNunca ? '🕵️ Modo Anónimo (Solo número)' : '👀 Mostrar nombres al revelar'}
                </button>
              </div>
              <span class="badge">🍻 Yo Nunca Secreto (${votedCount}/${eligible.length})</span>
              <div class="tv-question">${esc(y.text)}</div>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="REVEAL">Destapar Confesiones</button>
            </div>
          `;
        } else {
          const guilty = roomState.players.filter(p => roomState.votes[p.id] === 'SI');
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge">🍻 Confesiones · ${esc(eventPenalty(1))}</span>
              <div class="tv-question">${esc(y.text)}</div>
              <div class="glass-subcard" style="max-width:650px;margin:0 auto 20px;">
                ${roomState.anonYoNunca
                  ? `<div style="font-size:2rem;font-weight:850;">${guilty.length} de ${roomState.players.length} personas lo han hecho</div>`
                  : `<div class="players-wrap">${guilty.map(p => `<span class="player-chip voted">${renderPlayerAvatar(p)} ${esc(p.name)}</span>`).join('') || '<span class="muted">¡Nadie lo confesó!</span>'}</div>`
                }
              </div>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="NEXT_ROUND">Siguiente ➡️</button>
            </div>
          `;
        }
      }

      if (roomState.game === 'verdad') {
        const v = roomState.currentData;
        if (roomState.phase === 'voting') {
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge">🎭 Verdad o Trola · <span data-ends-at="${v.endsAt}">45</span>s</span>
              <h2 style="font-size:2rem;margin-top:12px;">Acusado/a: ${esc(v.accusedName)}</h2>
              <div class="tv-question">«${esc(v.prompt)}»</div>
              <p class="muted" style="margin-bottom:16px;">Jurado votando: ${votedCount}/${eligible.length}</p>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="REVEAL">Veredicto del Jurado</button>
            </div>
          `;
        } else {
          const vVerdad = eligible.filter(p => roomState.votes[p.id] === 'VERDAD').length;
          const vTrola = eligible.filter(p => roomState.votes[p.id] === 'TROLA').length;
          bodyHtml = `
            <div style="text-align:center;">
              <span class="badge">🎭 Veredicto</span>
              <div class="tv-question">${esc(v.accusedName)} estaba contando una:<br><span style="color:${v.revealedIsTruth ? '#34d399' : '#fb7185'}">${v.revealedIsTruth ? '✅ VERDAD REAL' : '🤥 TROLA INVENTADA'}</span></div>
              <p class="muted" style="margin-bottom:20px;">El jurado votó: ${vVerdad} Verdad · ${vTrola} Trola</p>
              <button class="btn btn-primary" data-action="TV_CMD" data-cmd="NEXT_ROUND">Siguiente Acusado/a ➡️</button>
            </div>
          `;
        }
      }

      return `
        <div class="glass-card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:12px;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span class="badge">Sala: <strong>${esc(roomState.code)}</strong></span>
              <span class="badge">${gDef.icon} ${esc(gDef.name)} · Ronda ${roomState.round}${roomState.maxRounds ? '/' + roomState.maxRounds : ''}</span>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-sm" data-action="TV_CMD" data-cmd="SHOW_PODIUM">🏆 Podio</button>
              <button class="btn btn-sm" data-action="TV_CMD" data-cmd="GO_LOBBY">🏠 Juegos</button>
            </div>
          </div>

          ${roomState.activeEvent ? `<div class="event-banner">${esc(roomState.activeEvent.text)}</div>` : ''}
          ${roomState.autoRevealEndsAt ? `<div class="event-banner">⏱️ ¡Todos han votado! Revelando en <span data-ends-at="${roomState.autoRevealEndsAt}">3</span>...</div>` : ''}

          ${bodyHtml}

          <div class="muted small" style="margin-top:16px;text-align:center;opacity:0.55;">
            Atajos: <kbd>ESPACIO</kbd> revelar / siguiente ronda · <kbd>F</kbd> pantalla completa
          </div>
        </div>
      `;
    }
