    function buildMobilePlayHtml() {
      if (!roomState) {
        return `<div class="glass-card" style="max-width:460px;margin:20px auto;text-align:center;">
          <p>Sincronizando con sala ${esc(mySession.roomCode)}...</p>
          <button class="btn btn-sm" style="margin-top:12px;" data-action="MOBILE_REQ_STATE">🔄 Reintentar</button>
        </div>`;
      }

      if (kickedFromRoom) {
        return `
          <div class="glass-card" style="max-width:460px;margin:20px auto;text-align:center;">
            <div style="font-size:2.6rem;">🚪</div>
            <h2 class="section-title" style="margin-top:8px;">Te han sacado de la sala</h2>
            <p class="muted small" style="margin:10px 0 18px;">El anfitrión te ha eliminado del juego. Puedes volver a entrar si sigue abierta.</p>
            <button class="btn btn-primary btn-block" data-action="REJOIN_ROOM">🔄 Volver a entrar</button>
            <button class="btn btn-block" style="margin-top:8px;" data-action="EXIT_HOME">Salir</button>
          </div>
        `;
      }

      const me = roomState.players.find(p => p.id === mySession.playerId);
      const gDef = GAMES[roomState.game] || null;
      const myVote = roomState.votes ? roomState.votes[mySession.playerId] : undefined;
      const eligible = getEligibleVoters(roomState);
      const votedCount = eligible.filter(p => roomState.votes[p.id] !== undefined).length;
      let content = '';

      if (roomState.game === 'lobby' || roomState.phase === 'podium') {
        content = `
          <div style="text-align:center;padding:12px 0;">
            ${me ? renderPlayerAvatar(me, true) : `<div style="font-size:2.8rem;">${esc(mySession.avatar)}</div>`}
            <h2 style="font-size:1.35rem;margin-top:8px;">¡Dentro, ${esc(mySession.playerName)}!</h2>
            <p class="muted small">Puntos acumulados: <strong>${me?.score || 0}</strong></p>
          </div>
          ${mySession.isHostController && mySession.hostKey ? `
            <div class="glass-subcard" style="margin-top:12px;">
              <div class="small muted" style="font-weight:700;margin-bottom:8px;">🎛️ Lanzar juego en TV:</div>
              <div style="display:grid;gap:7px;">
                ${Object.entries(GAMES).map(([k, g]) => `
                  <button class="btn btn-sm btn-block" data-action="MOBILE_HOST_START" data-game="${k}" data-sub="mix">${g.icon} ${esc(g.name)}</button>
                `).join('')}
                <button class="btn btn-sm btn-block" data-action="MOBILE_HOST_START" data-game="quien" data-sub="profundo">🧠 Profundo / Debate</button>
              </div>
            </div>
          ` : ''}
        `;
      } else if (roomState.phase === 'rules') {
        content = `<div style="text-align:center;padding:24px 0;"><h3>📖 Lee las reglas en la TV</h3><p class="muted small">Empieza en <span data-ends-at="${roomState.rulesEndsAt}">5</span>s...</p></div>`;
      } else if (roomState.game === 'quien') {
        const q = roomState.currentData;
        if (roomState.phase === 'voting') {
          content = `
            <span class="badge">${esc(q.label)}</span>
            <p style="font-weight:700;font-size:1.08rem;margin:10px 0;">${esc(q.text)}</p>
            ${myVote !== undefined ? `<div class="badge badge-suave" style="margin-bottom:8px;">✅ Esperando al resto... ${votedCount}/${eligible.length}</div>` : ''}
            <div class="vote-grid">
              ${roomState.players.map(p => `
                <button class="vote-option ${myVote === p.id ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="${p.id}">
                  <span>${renderPlayerAvatar(p)} ${esc(p.name)}</span>
                  <span>${myVote === p.id ? '✅' : 'Votar'}</span>
                </button>
              `).join('')}
              <button class="vote-option ${myVote === '__PASS__' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="__PASS__">
                <span>⏭️ Pasar esta ronda</span><span>${myVote === '__PASS__' ? '✅' : ''}</span>
              </button>
            </div>
          `;
        } else {
          content = `<div style="text-align:center;padding:20px 0;"><h3>👀 ¡Resultados en la TV!</h3></div>`;
        }
      } else if (roomState.game === 'impostor') {
        const d = roomState.currentData;
        const isSpectating = d.activePlayerIds && !d.activePlayerIds.includes(mySession.playerId);
        if (isSpectating) {
          content = `<div style="text-align:center;padding:20px 0;"><h3>⏳ Ronda en curso</h3><p class="muted small">Entrarás a jugar en la siguiente ronda.</p></div>`;
        } else if (roomState.phase === 'last_bullet') {
          const amImpostor = d.revealedImpostorIds?.includes(mySession.playerId);
          content = amImpostor ? `
            <div class="glass-subcard">
              <h3>🎯 ¡Última Bala! (<span data-ends-at="${d.lastBulletEndsAt}">18</span>s)</h3>
              <p class="small muted" style="margin:6px 0 12px;">Te han pillado. Si adivinas la palabra secreta robas la victoria:</p>
              <input class="glass-input" id="inputImpostorGuess" placeholder="Escribe la palabra..." value="${esc(uiDraft.impostorGuessInput)}" />
              <button class="btn btn-primary btn-block" style="margin-top:10px;" data-action="SUBMIT_IMPOSTOR_GUESS">Disparar Respuesta 🎯</button>
            </div>
          ` : `<div style="text-align:center;padding:20px 0;"><h3>🎯 El impostor intenta adivinar la palabra...</h3></div>`;
        } else {
          const sec = myPrivatePayload && myPrivatePayload.round === roomState.round ? myPrivatePayload : null;
          content = `
            <div class="secret-box" data-action="TOGGLE_SECRET">
              ${mySession.secretRevealed && sec ? `
                <div class="small muted">Categoría: ${esc(sec.category)}</div>
                <div style="font-size:1.55rem;font-weight:900;margin:8px 0;color:${sec.role === 'innocent' ? '#34d399' : '#fb7185'}">${esc(sec.word)}</div>
                <div class="small muted">(Toca para volver a ocultar)</div>
              ` : `
                <div style="font-size:2rem;">👁️</div>
                <strong>Toca para ver tu rol secreto</strong>
              `}
            </div>
            ${roomState.phase === 'voting' ? `
              <p class="small muted" style="margin-top:10px;">Votación (${votedCount}/${eligible.length}):</p>
              <div class="vote-grid">
                ${eligible.map(p => `
                  <button class="vote-option ${myVote === p.id ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="${p.id}">
                    <span>${renderPlayerAvatar(p)} ${esc(p.name)}</span>
                    <span>${myVote === p.id ? '✅' : 'Acusar'}</span>
                  </button>
                `).join('')}
              </div>
            ` : ''}
          `;
        }
      } else if (roomState.game === 'escribio') {
        const d = roomState.currentData;
        if (roomState.phase === 'writing') {
          const alreadySent = Boolean(d.submittedIds?.includes(mySession.playerId) || d.submissions?.[mySession.playerId]);
          content = alreadySent
            ? `<div style="text-align:center;padding:20px 0;"><h3>✅ ¡Frase enviada!</h3><p class="muted small">Esperando al resto...</p></div>`
            : `
              <p style="font-weight:700;margin-bottom:10px;">${esc(d.prompt)}</p>
              <input class="glass-input" id="inputEscribioText" maxlength="140" placeholder="Escribe aquí en secreto..." value="${esc(uiDraft.escribioInput)}" />
              <button class="btn btn-primary btn-block" style="margin-top:12px;" data-action="SUBMIT_ESCRIBIO">Enviar Anónimamente ✍️</button>
            `;
        } else if (roomState.phase === 'voting') {
          content = `
            <p style="font-weight:700;margin-bottom:10px;">¿Quién escribió: «${esc(d.currentText)}»?</p>
            <div class="vote-grid">
              ${roomState.players.map(p => `
                <button class="vote-option ${myVote === p.id ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="${p.id}">
                  <span>${renderPlayerAvatar(p)} ${esc(p.name)}</span>
                  <span>${myVote === p.id ? '✅' : 'Votar'}</span>
                </button>
              `).join('')}
            </div>
          `;
        } else {
          content = `<div style="text-align:center;padding:20px 0;"><h3>👀 Mira la TV</h3></div>`;
        }
      } else if (roomState.game === 'mente' || roomState.game === 'trivia') {
        const d = roomState.currentData;
        const title = roomState.game === 'mente' ? d.prompt : d.q;
        content = roomState.phase === 'voting' ? `
          <p style="font-weight:700;margin-bottom:10px;">${esc(title)}</p>
          <div class="vote-grid">
            ${d.options.map((opt, idx) => `
              <button class="vote-option ${String(myVote) === String(idx) ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="${idx}">
                <span>${idx + 1}. ${esc(opt)}</span>
                <span>${String(myVote) === String(idx) ? '✅' : ''}</span>
              </button>
            `).join('')}
          </div>
        ` : `<div style="text-align:center;padding:20px 0;"><h3>👀 Resultado en la TV</h3></div>`;
      } else if (roomState.game === 'teconozco') {
        const d = roomState.currentData;
        content = roomState.phase === 'voting' ? `
          <p style="font-weight:700;margin-bottom:10px;">${d.subjectId === mySession.playerId ? 'Responde sobre ti:' : `¿Qué eligió ${esc(d.subjectName)}?`}</p>
          <div class="vote-grid">
            <button class="vote-option ${myVote === 'A' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="A"><span>🅰️ ${esc(d.a)}</span></button>
            <button class="vote-option ${myVote === 'B' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="B"><span>🅱️ ${esc(d.b)}</span></button>
          </div>
        ` : `<div style="text-align:center;padding:20px 0;"><h3>👀 Mira la TV</h3></div>`;
      } else if (roomState.game === 'dilemas') {
        const d = roomState.currentData;
        content = roomState.phase === 'voting' ? `
          <p style="font-weight:700;margin-bottom:10px;">Elige en secreto:</p>
          <div class="vote-grid">
            <button class="vote-option ${myVote === 'A' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="A"><span>🅰️ ${esc(d.a)}</span></button>
            <button class="vote-option ${myVote === 'B' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="B"><span>🅱️ ${esc(d.b)}</span></button>
          </div>
        ` : `<div style="text-align:center;padding:20px 0;"><h3>👀 Mira la TV</h3></div>`;
      } else if (roomState.game === 'yonunca') {
        const y = roomState.currentData;
        content = roomState.phase === 'voting' ? `
          <p style="font-weight:700;margin-bottom:10px;">${esc(y.text)}</p>
          <div class="vote-grid">
            <button class="vote-option ${myVote === 'SI' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="SI"><span>🍻 Yo SÍ lo he hecho</span></button>
            <button class="vote-option ${myVote === 'NO' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="NO"><span>😇 Yo NUNCA</span></button>
          </div>
        ` : `<div style="text-align:center;padding:20px 0;"><h3>👀 Mira la TV</h3></div>`;
      } else if (roomState.game === 'verdad') {
        const v = roomState.currentData;
        const amAccused = v.accusedId === mySession.playerId;
        const sec = myPrivatePayload && myPrivatePayload.round === roomState.round ? myPrivatePayload : null;
        if (roomState.phase === 'voting') {
          content = amAccused ? `
            <div class="secret-box">
              <div class="small muted">Te toca hablar (<span data-ends-at="${v.endsAt}">45</span>s):</div>
              <div style="font-size:1.45rem;font-weight:900;margin:8px 0;color:${sec?.isTruth ? '#34d399' : '#fb7185'}">
                ${sec ? (sec.isTruth ? '✅ DI UNA VERDAD REAL' : '🤥 INVENTA UNA TROLA') : 'Cargando rol...'}
              </div>
              <p class="small">${esc(v.prompt)}</p>
            </div>
          ` : `
            <p style="font-weight:700;margin-bottom:10px;">¿Qué está contando ${esc(v.accusedName)}?</p>
            <div class="vote-grid">
              <button class="vote-option ${myVote === 'VERDAD' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="VERDAD"><span>✅ Verdad</span></button>
              <button class="vote-option ${myVote === 'TROLA' ? 'selected' : ''}" data-action="MOBILE_VOTE" data-val="TROLA"><span>🤥 Trola</span></button>
            </div>
          `;
        } else {
          content = `<div style="text-align:center;padding:20px 0;"><h3>👀 Veredicto en la TV</h3></div>`;
        }
      }

      const isAccused = roomState.game === 'verdad' && roomState.currentData?.accusedId === mySession.playerId;
      const wildcardBar = me && me.wildcard === 'available' && roomState.phase === 'voting' ? `
        <div class="glass-subcard" style="margin-top:14px;">
          <div class="small muted" style="margin-bottom:6px;font-weight:700;">🃏 Tu Comodín único de la noche:</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${!isAccused ? `<button class="btn btn-sm" data-action="MOBILE_WILDCARD" data-card="pass">⏭️ Pasar</button>` : ''}
            <button class="btn btn-sm" data-action="MOBILE_WILDCARD" data-card="double">✖️2 Doble</button>
            ${!isAccused && myVote !== undefined ? `<button class="btn btn-sm" data-action="MOBILE_WILDCARD" data-card="reverse">↩️ Reversa</button>` : ''}
          </div>
          <div class="small muted" style="margin-top:6px;font-size:0.72rem;">Pasar = no votas · Doble = x2 puntos · Reversa = cambia tu voto</div>
        </div>
      ` : '';

      const hostRemote = mySession.isHostController && mySession.hostKey && roomState.game !== 'lobby' ? `
        <div class="glass-subcard" style="margin-top:12px;">
          <div class="small muted" style="font-weight:700;margin-bottom:6px;">🎛️ Mando Anfitrión TV:</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${roomState.phase === 'rules' ? `<button class="btn btn-sm btn-primary" data-action="MOBILE_HOST_CMD" data-cmd="SKIP_RULES">Saltar reglas ➡️</button>` : ''}
            ${roomState.game === 'impostor' && roomState.phase === 'clues' ? `<button class="btn btn-sm btn-primary" data-action="MOBILE_HOST_CMD" data-cmd="START_IMPOSTOR_VOTE">🗳️ Votar</button>` : ''}
            ${roomState.phase === 'voting' ? `<button class="btn btn-sm btn-primary" data-action="MOBILE_HOST_CMD" data-cmd="REVEAL">👀 Revelar</button>` : ''}
            ${roomState.phase === 'reveal' ? `<button class="btn btn-sm btn-primary" data-action="MOBILE_HOST_CMD" data-cmd="NEXT_ROUND">Siguiente ➡️</button>` : ''}
            <button class="btn btn-sm" data-action="MOBILE_HOST_CMD" data-cmd="GO_LOBBY">🏠 Juegos</button>
          </div>
        </div>
      ` : '';

      return `
        <div class="glass-card" style="max-width:480px;margin:0 auto;">
          <div class="mobile-topbar" style="margin:-26px -26px 14px;padding:12px 18px;border-radius:var(--radius-xl) var(--radius-xl) 0 0;">
            <div style="display:flex;align-items:center;gap:9px;min-width:0;">
              ${me ? renderPlayerAvatar(me) : esc(mySession.avatar)}
              <div style="min-width:0;">
                <div style="font-weight:800;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(mySession.playerName)}</div>
                <div class="muted small">Sala ${esc(mySession.roomCode)} · ${fmtPts(me?.score || 0)}</div>
              </div>
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
              <span class="badge">${gDef ? gDef.icon + ' ' + esc(gDef.name) : 'Lobby'} · R${roomState.round}</span>
              <button class="btn btn-sm" data-action="TOGGLE_CUSTOM_Q_DRAWER" title="Añadir pregunta">➕</button>
            </div>
          </div>

          ${uiDraft.showCustomQDrawer ? `
            <div class="glass-subcard" style="margin-bottom:12px;">
              <input class="glass-input" id="inputCustomQText" maxlength="160" placeholder="Escribe una pregunta para el grupo..." value="${esc(uiDraft.customQText)}" style="margin-bottom:8px;" />
              <div style="display:flex;gap:8px;">
                <select class="glass-select" id="selectCustomQCat">
                  <option value="suave">🟢 Calentamiento</option>
                  <option value="delicada">🟡 Salseo</option>
                  <option value="cruel">🟠 Cruel</option>
                  <option value="profundo">🧠 Profundo</option>
                </select>
                <button class="btn btn-sm btn-primary" data-action="SUBMIT_CUSTOM_Q">Añadir</button>
              </div>
            </div>
          ` : ''}

          ${content}
          ${wildcardBar}

          <div style="display:flex;justify-content:center;gap:10px;margin-top:14px;">
            ${['🔥', '😂', '💀', '👏'].map(em => `<button class="btn btn-sm" data-action="SEND_REACT" data-emoji="${em}">${em}</button>`).join('')}
          </div>

          ${hostRemote}
        </div>
      `;
    }

    /* =========================================================================
       12. PLAN B OFFLINE: PASAR UN SOLO MÓVIL (PASS & PLAY)
       ========================================================================= */
    function buildPassPlayHtml() {
      if (passPlayState.phase === 'setup') {
        return `
          <div class="glass-card" style="max-width:480px;margin:10px auto;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <span class="badge">🤝 Modo Pasar un Solo Móvil (Offline)</span>
              <button class="btn btn-sm" data-action="EXIT_HOME">Volver</button>
            </div>
            <h2 class="section-title">Jugadores en este teléfono</h2>
            <div class="players-wrap" style="justify-content:flex-start;margin-bottom:14px;">
              ${passPlayState.players.map((n, i) => `<span class="player-chip">${esc(n)} <button style="background:none;border:none;color:#fb7185;cursor:pointer;" data-action="PP_REMOVE" data-idx="${i}">✕</button></span>`).join('')}
            </div>
            <div style="display:flex;gap:8px;margin-bottom:16px;">
              <input class="glass-input" id="inputPPName" placeholder="Añadir jugador..." value="${esc(uiDraft.passPlayNewName)}" />
              <button class="btn btn-primary" data-action="PP_ADD">Añadir</button>
            </div>
            <button class="btn btn-primary btn-block" data-action="PP_START">Empezar Ronda 🎲</button>
          </div>
        `;
      }

      if (passPlayState.phase === 'turn') {
        const curPlayer = passPlayState.players[passPlayState.turnIdx];
        return `
          <div class="glass-card" style="max-width:480px;margin:10px auto;text-align:center;">
            <span class="badge">Turno ${passPlayState.turnIdx + 1}/${passPlayState.players.length}</span>
            ${!passPlayState.curtainOpen ? `
              <div style="padding:34px 10px;">
                <div style="font-size:3rem;margin-bottom:10px;">📱</div>
                <h2>Pásale el móvil a <strong>${esc(curPlayer)}</strong></h2>
                <p class="muted small" style="margin:8px 0 20px;">Nadie más debe mirar la pantalla.</p>
                <button class="btn btn-primary btn-block" data-action="PP_OPEN_CURTAIN">Soy ${esc(curPlayer)} · Ver Pregunta</button>
              </div>
            ` : `
              <p style="font-weight:750;font-size:1.15rem;margin:14px 0;">${esc(passPlayState.question)}</p>
              <div class="vote-grid">
                ${passPlayState.players.map(target => `
                  <button class="vote-option" data-action="PP_VOTE" data-target="${esc(target)}">
                    <span>${esc(target)}</span><span>Votar 👉</span>
                  </button>
                `).join('')}
              </div>
            `}
          </div>
        `;
      }

      const tally = {};
      Object.values(passPlayState.localVotes).forEach(t => { tally[t] = (tally[t] || 0) + 1; });
      const sorted = [...passPlayState.players].sort((a, b) => (tally[b] || 0) - (tally[a] || 0));
      return `
        <div class="glass-card" style="max-width:480px;margin:10px auto;text-align:center;">
          <span class="badge">👑 Resultado de la Ronda</span>
          <p style="font-weight:700;margin:12px 0;">${esc(passPlayState.question)}</p>
          <div style="text-align:left;margin:16px 0;">
            ${sorted.map(name => `<div class="glass-subcard" style="margin-bottom:8px;display:flex;justify-content:space-between;"><strong>${esc(name)}</strong><span>${tally[name] || 0} votos</span></div>`).join('')}
          </div>
          <button class="btn btn-primary btn-block" data-action="PP_START">Siguiente Ronda ➡️</button>
          <button class="btn btn-sm" style="margin-top:10px;" data-action="EXIT_HOME">Salir</button>
        </div>
      `;
    }

    function renderDebugPanel() {
      const container = document.getElementById('debugContainer');
      if (!container) return;
      const isDebug = new URLSearchParams(window.location.search).has('debug');
      if (!isDebug) { container.innerHTML = ''; return; }

      container.innerHTML = `
        <div class="debug-drawer">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
            <strong>🛠️ PartyOS ?debug</strong>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn btn-sm" data-action="ADD_BOTS">+3 Bots</button>
              <button class="btn btn-sm" data-action="ADD_9_BOTS">Simular 10 Jugadores</button>
              <button class="btn btn-sm" data-action="DEBUG_BOT_VOTE">Forzar Votos Bots</button>
              <button class="btn btn-sm" data-action="TV_CMD" data-cmd="REVEAL">Forzar Reveal</button>
              <button class="btn btn-sm btn-danger" data-action="DEBUG_RESET_LS">Borrar localStorage</button>
            </div>
          </div>
          <pre style="max-height:180px;overflow:auto;color:#7dd3fc;">${esc(JSON.stringify({ viewMode, roomState, myPrivatePayload }, null, 2))}</pre>
        </div>
      `;
    }

    /* =========================================================================
       13. EVENTOS DE INTERFAZ Y ATAJOS DE TECLADO EN TV
       ========================================================================= */
    document.addEventListener('input', (e) => {
      if (e.target.id === 'inputRoomCode') uiDraft.joinCode = e.target.value.toUpperCase();
      if (e.target.id === 'inputPlayerName') uiDraft.joinName = e.target.value;
      if (e.target.id === 'inputCustomQText') uiDraft.customQText = e.target.value;
      if (e.target.id === 'inputEscribioText') uiDraft.escribioInput = e.target.value;
      if (e.target.id === 'inputImpostorGuess') uiDraft.impostorGuessInput = e.target.value;
      if (e.target.id === 'inputPPName') uiDraft.passPlayNewName = e.target.value;
    });

    document.addEventListener('change', (e) => {
      if (e.target.id === 'inputIsHost') uiDraft.joinAsHost = e.target.checked;
      if (e.target.id === 'selectCustomQCat') uiDraft.customQCat = e.target.value;
      if (e.target.id === 'importDeckFile' && e.target.files?.[0]) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (parsed.quien && Array.isArray(parsed.quien)) {
              activeContent = parsed;
              localStorage.setItem(STORAGE_KEYS.contentDeck, JSON.stringify(parsed));
              localStorage.setItem(STORAGE_KEYS.contentSig, CONTENT_SIG);
              showToast(`✅ Mazo «${parsed.deckName || 'Importado'}» cargado`);
              render(true);
            }
          } catch (err) { showToast('❌ Archivo JSON no válido'); }
        };
        reader.readAsText(e.target.files[0]);
      }
    });

    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'CREATE_TV') createTvRoom('tv');
      if (action === 'START_SOLO_TEST') createTvRoom('solo_test');
      if (action === 'OPEN_MOBILE_JOIN') {
        viewMode = 'mobile_join';
        joinStatusMsg = '';
        // Recordamos el último nombre usado para ir más rápido.
        try {
          const last = localStorage.getItem(STORAGE_KEYS.lastName);
          if (last && !uiDraft.joinName) uiDraft.joinName = last;
        } catch (e) {}
        render(true);
      }
      if (action === 'OPEN_PASS_PLAY') { viewMode = 'pass_play'; passPlayState.phase = 'setup'; render(true); }
      if (action === 'EXIT_HOME') {
        if ((viewMode === 'tv' || viewMode === 'solo_test') && roomState) {
          // Avisamos a los móviles de que la sala se ha cerrado.
          publishPacket(`${TOPIC_PREFIX}/${roomState.code}/state`, { code: roomState.code, closed: true }, true);
          try { localStorage.removeItem(STORAGE_KEYS.tvState); } catch (e) {}
          clearPrivateSecrets();
        }
        viewMode = 'home';
        roomState = null;
        setAmbientTheme('lobby');
        render(true);
      }

      if (action === 'RESTORE_TV') {
        try {
          roomState = JSON.parse(localStorage.getItem(STORAGE_KEYS.tvState));
          viewMode = 'tv';
          roomState.players = (roomState.players || []).map(p => ({ ...p, lastSeen: Date.now(), online: true }));
          loadPrivateSecrets();
          startTvLoops();
          resubscribeActiveTopics();
          setAmbientTheme(roomState.activeTheme || roomState.game);
          sendPrivateSecrets();
          showToast('📺 Sala reanudada: los roles y el marcador están intactos');
          render(true);
        } catch (err) {
          showToast('⚠️ No se pudo reanudar la sala');
        }
      }

      if (action === 'RESTORE_MOBILE') {
        try {
          mySession = JSON.parse(localStorage.getItem(STORAGE_KEYS.mobileSession));
          viewMode = 'mobile_play';
          resubscribeActiveTopics();
          startMobileHeartbeat();
          showToast('📱 Recuperando la partida…');
          render(true);
        } catch (err) {
          showToast('⚠️ No se encontró la sesión del móvil');
        }
      }

      if (action === 'ADD_BOTS') addTestBots(3);
      if (action === 'ADD_9_BOTS') addTestBots(9);
      if (action === 'COPY_LINK') {
        const url = `${window.location.origin}${window.location.pathname}?room=${roomState.code}`;
        copyToClipboard(url).then(ok => {
          showToast(ok ? `📋 Enlace copiado (sala ${roomState.code})` : `⚠️ No se pudo copiar: ${url}`);
        });
      }

      if (action === 'INSTALL_APP') {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          deferredInstallPrompt = null;
          render(true);
        } else {
          showToast('💡 Usa el menú del navegador → "Instalar aplicación" / "Añadir a pantalla de inicio"');
        }
      }

      if (action === 'PICK_AVATAR') { uiDraft.joinAvatar = target.dataset.avatar; uiDraft.joinSelfie = ''; render(true); }
      if (action === 'TAKE_SELFIE') captureSelfieAvatar();
      if (action === 'SUBMIT_JOIN') joinRoomFromMobile();

      if (action === 'CYCLE_PENALTY_MODE') {
        if (roomState && (viewMode === 'tv' || viewMode === 'solo_test')) executeHostCommand('CYCLE_PENALTY', {}, true);
        else if (mySession.isHostController) sendToTvInbox({ type: 'HOST_CMD', hostKey: mySession.hostKey, cmd: 'CYCLE_PENALTY' });
      }

      if (action === 'TOGGLE_SOUND') {
        soundEnabled = !soundEnabled;
        document.getElementById('soundPill').textContent = soundEnabled ? '🔊' : '🔇';
      }

      if (action === 'TOGGLE_FULLSCREEN') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }

      if (action === 'SELECT_DECK') {
        const d = THEMATIC_DECKS[target.dataset.deck];
        if (d) {
          activeContent = JSON.parse(JSON.stringify(d));
          localStorage.setItem(STORAGE_KEYS.contentDeck, JSON.stringify(activeContent));
          localStorage.setItem(STORAGE_KEYS.contentSig, CONTENT_SIG);
          showToast(`📚 Mazo cambiado a: ${activeContent.deckName}`);
          render(true);
        }
      }

      if (action === 'EXPORT_DECK') {
        const blob = new Blob([JSON.stringify(activeContent, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'content.json';
        a.click();
      }

      if (action === 'TV_SET_ROUNDS') executeHostCommand('SET_MAX_ROUNDS', { rounds: target.dataset.rounds }, true);
      if (action === 'TV_IMPOSTOR_VAR') executeHostCommand('SET_IMPOSTOR_VARIANT', { variant: target.dataset.var }, true);
      if (action === 'TV_START_GAME') executeHostCommand('START_GAME', { game: target.dataset.game, subMode: target.dataset.sub }, true);
      if (action === 'TV_CMD') executeHostCommand(target.dataset.cmd, { playerId: target.dataset.playerId }, true);
      if (action === 'TV_FORCE_ESCRIBIO_VOTE') { startEscribioVotingPhase(); broadcastRoomState(); render(true); }
      if (action === 'DOWNLOAD_SUMMARY') downloadSummaryImage();

      if (action === 'MOBILE_REQ_STATE') resubscribeActiveTopics();
      if (action === 'REJOIN_ROOM') {
        uiDraft.joinCode = mySession.roomCode;
        uiDraft.joinName = mySession.playerName;
        uiDraft.joinAvatar = mySession.avatar;
        mySession.confirmedInRoom = false;
        kickedFromRoom = false;
        joinRoomFromMobile();
      }
      if (action === 'MOBILE_VOTE') {
        vibrate(20);
        const val = target.dataset.val;
        if (viewMode === 'solo_test') {
          processTvInboxMessage({ type: 'VOTE', playerId: mySession.playerId, value: val });
        } else {
          if (roomState?.votes) roomState.votes[mySession.playerId] = val;
          sendToTvInbox({ type: 'VOTE', playerId: mySession.playerId, value: val });
          render(true);
        }
      }

      if (action === 'SUBMIT_ESCRIBIO') {
        const text = uiDraft.escribioInput.trim();
        if (!text) return;
        uiDraft.escribioInput = '';
        if (viewMode === 'solo_test') processTvInboxMessage({ type: 'VOTE', playerId: mySession.playerId, value: text });
        else sendToTvInbox({ type: 'VOTE', playerId: mySession.playerId, value: text });
      }

      if (action === 'SUBMIT_IMPOSTOR_GUESS') {
        const guess = uiDraft.impostorGuessInput.trim();
        if (!guess) return;
        uiDraft.impostorGuessInput = '';
        if (viewMode === 'solo_test') processTvInboxMessage({ type: 'VOTE', playerId: mySession.playerId, value: guess });
        else sendToTvInbox({ type: 'VOTE', playerId: mySession.playerId, value: guess });
      }

      if (action === 'MOBILE_WILDCARD') {
        vibrate(35);
        const card = target.dataset.card;
        if (viewMode === 'solo_test') processTvInboxMessage({ type: 'USE_WILDCARD', playerId: mySession.playerId, card });
        else sendToTvInbox({ type: 'USE_WILDCARD', playerId: mySession.playerId, card });
      }

      if (action === 'SEND_REACT') {
        vibrate(15);
        const emoji = target.dataset.emoji;
        if (viewMode === 'solo_test') spawnFloatingReaction(emoji);
        else sendToTvInbox({ type: 'REACT', emoji });
      }

      if (action === 'TOGGLE_CUSTOM_Q_DRAWER') { uiDraft.showCustomQDrawer = !uiDraft.showCustomQDrawer; render(true); }
      if (action === 'SUBMIT_CUSTOM_Q') {
        const text = uiDraft.customQText.trim();
        if (!text) return;
        uiDraft.customQText = '';
        uiDraft.showCustomQDrawer = false;
        const qObj = { cat: uiDraft.customQCat, text };
        if (viewMode === 'solo_test') processTvInboxMessage({ type: 'ADD_QUESTION', question: qObj });
        else sendToTvInbox({ type: 'ADD_QUESTION', question: qObj });
        render(true);
      }

      if (action === 'MOBILE_HOST_START') {
        const payload = { game: target.dataset.game, subMode: target.dataset.sub };
        if (viewMode === 'solo_test') executeHostCommand('START_GAME', payload, true);
        else sendToTvInbox({ type: 'HOST_CMD', hostKey: mySession.hostKey, cmd: 'START_GAME', payload });
      }

      if (action === 'MOBILE_HOST_CMD') {
        const cmd = target.dataset.cmd;
        if (viewMode === 'solo_test') executeHostCommand(cmd, {}, true);
        else sendToTvInbox({ type: 'HOST_CMD', hostKey: mySession.hostKey, cmd });
      }

      if (action === 'TOGGLE_SECRET') { mySession.secretRevealed = !mySession.secretRevealed; render(true); }

      if (action === 'PP_ADD') {
        const n = uiDraft.passPlayNewName.trim();
        if (n) { passPlayState.players.push(n); uiDraft.passPlayNewName = ''; render(true); }
      }
      if (action === 'PP_REMOVE') { passPlayState.players.splice(Number(target.dataset.idx), 1); render(true); }
      if (action === 'PP_START') {
        if (passPlayState.players.length < 2) return showToast('Añade al menos 2 jugadores');
        const qObj = pickFreshItem('quien', activeContent.quien, q => q.text) || activeContent.quien[0];
        if (!qObj) return showToast('⚠️ No hay preguntas en el mazo');
        passPlayState.question = qObj.text.replace(/\{p1\}/g, passPlayState.players[0]);
        passPlayState.turnIdx = 0;
        passPlayState.curtainOpen = false;
        passPlayState.localVotes = {};
        passPlayState.phase = 'turn';
        render(true);
      }
      if (action === 'PP_OPEN_CURTAIN') { passPlayState.curtainOpen = true; render(true); }
      if (action === 'PP_VOTE') {
        passPlayState.localVotes[passPlayState.turnIdx] = target.dataset.target;
        if (passPlayState.turnIdx + 1 < passPlayState.players.length) {
          passPlayState.turnIdx++;
          passPlayState.curtainOpen = false;
        } else {
          passPlayState.phase = 'results';
        }
        render(true);
      }

      if (action === 'DEBUG_BOT_VOTE') { triggerBotActions(); broadcastRoomState(); render(true); }
      if (action === 'DEBUG_RESET_LS') { localStorage.clear(); location.reload(); }
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
      if (e.code === 'Space' && roomState && (viewMode === 'tv' || viewMode === 'solo_test')) {
        e.preventDefault();
        if (roomState.phase === 'rules') executeHostCommand('SKIP_RULES', {}, true);
        else if (roomState.phase === 'voting') executeHostCommand('REVEAL', {}, true);
        else if (roomState.phase === 'reveal') executeHostCommand('NEXT_ROUND', {}, true);
      }
    });

    let cursorIdleTimer = null;
    document.addEventListener('mousemove', () => {
      document.body.classList.remove('cursor-hidden');
      clearTimeout(cursorIdleTimer);
      if (viewMode === 'tv') {
        cursorIdleTimer = setTimeout(() => document.body.classList.add('cursor-hidden'), 3500);
      }
    });

    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const btn = document.getElementById('installAppBtn');
      if (btn) btn.classList.add('show');
    });
    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      showToast('🎉 ¡PartyOS instalada! Ábrela como una app');
      render(true);
    });

    (function bootstrap() {
      // El broker público puede emitir un aviso técnico al cambiar de servidor:
      // es inofensivo, así que lo filtramos para no ensuciar la consola.
      window.addEventListener('error', (e) => {
        const msg = String(e?.message || '');
        if (msg.includes('WebSocket is already in CLOSING or CLOSED state')) return;
      });

      try {
        const icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='.5' stop-color='%23ec4899'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23g)'/%3E%3Ctext x='256' y='352' font-size='260' text-anchor='middle'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E";
        const manifest = {
          name: 'PartyOS · Liquid Edition',
          short_name: 'PartyOS',
          id: 'partyos-liquid',
          start_url: location.pathname + location.search,
          scope: location.pathname,
          display: 'standalone',
          orientation: 'any',
          background_color: '#05060b',
          theme_color: '#05060b',
          lang: 'es',
          categories: ['games', 'entertainment'],
          icons: [
            { src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
          ]
        };
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
        document.head.appendChild(link);
      } catch (e) {}

      // Service worker opcional (solo si lo subes junto al HTML): cachea la
      // página y la librería MQTT para que la app siga funcionando sin red.
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }

      // Si el navegador está sin internet, avisamos de inmediato.
      window.addEventListener('offline', () => setNetBanner('📴 Sin internet: el juego seguirá en modo local cuando vuelva la red', true));
      window.addEventListener('online', () => setNetBanner(''));

      if (CONTENT_WARNING) {
        setNetBanner(CONTENT_WARNING, true);
        setTimeout(() => showToast(CONTENT_WARNING), 500);
        console.warn('[PartyOS] ' + CONTENT_WARNING);
      }

      initNetwork();

      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) {
        uiDraft.joinCode = roomParam.toUpperCase().slice(0, 4);
        uiDraft.joinAsHost = false;
        try {
          const last = localStorage.getItem(STORAGE_KEYS.lastName);
          if (last) uiDraft.joinName = last;
        } catch (e) {}
        viewMode = 'mobile_join';
      }
      updatePageTitle();
      render(true);
    })();
  </script>
</body>
</html>
