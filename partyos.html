  <style>
    :root {
      --bg-base: #05060b;
      --glass-bg: rgba(255, 255, 255, 0.065);
      --glass-bg-strong: rgba(255, 255, 255, 0.11);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-highlight: rgba(255, 255, 255, 0.28);
      --text-primary: #f8fafc;
      --text-secondary: rgba(248, 250, 252, 0.72);
      --text-muted: rgba(248, 250, 252, 0.48);
      --orb-1: #6366f1;
      --orb-2: #ec4899;
      --orb-3: #06b6d4;
      --orb-4: #8b5cf6;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.2);
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #fb7185;
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-pill: 999px;
      --shadow-glass: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 var(--glass-highlight);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      min-height: 100dvh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      line-height: 1.45;
    }

    body.cursor-hidden { cursor: none; }

    /* Fondo dinámico Apple Liquid Glass */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #05060b 78%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.44;
      transition: background 1.2s ease;
      animation: floatOrb 20s ease-in-out infinite alternate;
      will-change: transform;
    }

    .orb-1 { width: 44vw; height: 44vw; top: -12%; left: -8%; background: var(--orb-1); }
    .orb-2 { width: 40vw; height: 40vw; top: 18%; right: -10%; background: var(--orb-2); animation-delay: -5s; }
    .orb-3 { width: 46vw; height: 46vw; bottom: -16%; left: 15%; background: var(--orb-3); animation-delay: -10s; }
    .orb-4 { width: 32vw; height: 32vw; bottom: 10%; right: 12%; background: var(--orb-4); animation-delay: -14s; }

    @keyframes floatOrb {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(3%, -3%, 0) scale(1.06); }
    }

    @media (max-width: 768px), (prefers-reduced-motion: reduce) {
      .orb { filter: blur(42px); animation: none; opacity: 0.34; }
      .glass-card { backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); }
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 1380px;
      margin: 0 auto;
      padding: 14px 18px 44px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island HUD */
    .island-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
      position: sticky;
      top: 10px;
      z-index: 60;
    }

    .dynamic-island {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(11, 13, 22, 0.82);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: var(--radius-pill);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      font-size: 0.85rem;
      font-weight: 600;
      flex-wrap: wrap;
      justify-content: center;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      background: var(--warning);
      box-shadow: 0 0 10px var(--warning);
    }

    .status-dot.online { background: var(--success); box-shadow: 0 0 12px var(--success); }
    .status-dot.offline { background: var(--danger); box-shadow: 0 0 12px var(--danger); }

    .island-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.78rem;
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-glass);
      padding: 26px;
      animation: phaseIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes phaseIn {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .glass-subcard {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .hero-title {
      font-size: clamp(2.3rem, 5vw, 4rem);
      font-weight: 850;
      letter-spacing: -0.035em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.08;
    }

    .tv-question {
      font-size: clamp(2rem, 4.1vw, 3.45rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.18;
      text-align: center;
      margin: 18px 0;
    }

    .section-title {
      font-size: 1.22rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .muted { color: var(--text-secondary); }
    .small { font-size: 0.86rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.09);
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.34);
    }

    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #6366f1);
      border-color: rgba(255, 255, 255, 0.36);
      color: #fff;
    }

    .btn-danger {
      background: linear-gradient(135deg, #f43f5e, #be123c);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .btn-sm { padding: 8px 13px; font-size: 0.83rem; }
    .btn-block { width: 100%; }
    .btn.active-pill {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fff;
    }

    .glass-input, .glass-select {
      width: 100%;
      padding: 13px 16px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.36);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .glass-input:focus, .glass-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .code-input {
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-weight: 850;
      font-size: 1.5rem;
      text-align: center;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }

    .grid-games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 13px;
    }

    .game-tile {
      text-align: left;
      padding: 18px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.14);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.45;
    }

    .game-tile:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.11);
      border-color: var(--accent);
    }

    .qr-wrapper {
      background: #ffffff;
      padding: 16px;
      border-radius: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.5);
    }

    .qr-wrapper svg {
      display: block;
      width: clamp(195px, 18vw, 250px);
      height: clamp(195px, 18vw, 250px);
    }

    .room-code-big {
      font-size: clamp(3rem, 5.5vw, 4.6rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      padding: 8px 24px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.24);
      display: inline-block;
      margin: 8px 0;
    }

    .players-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .player-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-weight: 650;
      font-size: 0.94rem;
      transition: all 0.2s ease;
    }

    .player-chip.voted {
      background: rgba(52, 211, 153, 0.2);
      border-color: rgba(52, 211, 153, 0.6);
    }

    .player-chip.active-turn {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 0 22px var(--accent-soft);
      transform: scale(1.06);
    }

    .avatar-img {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.35);
      vertical-align: middle;
    }

    .avatar-img-lg {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 10px 0 14px;
    }

    .avatar-btn {
      font-size: 1.5rem;
      padding: 9px 4px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .avatar-btn.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: scale(1.07);
    }

    .vote-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .vote-option {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 1.02rem;
      font-weight: 650;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .vote-option.selected {
      background: linear-gradient(135deg, var(--accent-soft), rgba(99, 102, 241, 0.38));
      border-color: var(--accent);
      box-shadow: 0 0 22px var(--accent-soft);
    }

    .result-row { margin-bottom: 12px; }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      margin-bottom: 5px;
      font-size: 1.08rem;
    }
    .result-track {
      height: 18px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .result-fill {
      height: 100%;
      width: 0%;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, var(--accent), #818cf8, #f472b6);
      transition: width 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .secret-box {
      padding: 24px 18px;
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.24);
      text-align: center;
      cursor: pointer;
      user-select: none;
      margin: 12px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .badge-suave { background: rgba(52, 211, 153, 0.18); border-color: rgba(52, 211, 153, 0.45); color: #6ee7b7; }
    .badge-delicada { background: rgba(250, 204, 21, 0.18); border-color: rgba(250, 204, 21, 0.45); color: #fde047; }
    .badge-cruel { background: rgba(251, 146, 60, 0.2); border-color: rgba(251, 146, 60, 0.5); color: #fdba74; }
    .badge-brutal { background: rgba(244, 63, 94, 0.22); border-color: rgba(244, 63, 94, 0.55); color: #fda4af; }
    .badge-profundo { background: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.5); color: #7dd3fc; }

    .reaction-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 80;
      overflow: hidden;
    }
    .floating-emoji {
      position: absolute;
      bottom: 40px;
      font-size: 2.6rem;
      animation: floatEmoji 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes floatEmoji {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      15% { opacity: 1; transform: translateY(-40px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-420px) scale(0.95) rotate(12deg); }
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 75;
    }

    .event-banner {
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.22), rgba(244, 63, 94, 0.22));
      border: 1px solid rgba(251, 191, 36, 0.55);
      text-align: center;
      font-weight: 800;
      margin-bottom: 16px;
      font-size: 1.05rem;
    }

    .podium-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin: 20px 0;
      align-items: end;
    }
    .podium-col {
      padding: 20px 14px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
    }
    .podium-col.rank-1 {
      background: linear-gradient(180deg, rgba(250, 204, 21, 0.24), rgba(255, 255, 255, 0.07));
      border-color: rgba(250, 204, 21, 0.65);
      padding-top: 32px;
    }

      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 920px) {
      .split-preview { grid-template-columns: 1fr; }
      .glass-card { padding: 18px; border-radius: 24px; }
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.24);
      backdrop-filter: blur(20px);
      padding: 11px 20px;
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 999;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
    }

    .debug-drawer {
      margin-top: 20px;
      padding: 16px;
      border-radius: var(--radius-lg);
      background: rgba(0, 0, 0, 0.72);
      border: 1px dashed rgba(56, 189, 248, 0.6);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
    }

    /* ================================================================
       MEJORAS 2026 · PWA, móvil, accesibilidad y acabado visual
       ================================================================ */
    :root { color-scheme: dark; }

    html { -webkit-text-size-adjust: 100%; }

    .shell {
      padding-top: max(14px, env(safe-area-inset-top));
      padding-bottom: max(44px, env(safe-area-inset-bottom));
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 10px;
    }

    .glass-card { position: relative; overflow: hidden; }
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      opacity: 0.65;
      pointer-events: none;
    }

    .btn { position: relative; overflow: hidden; }
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 25%, rgba(255, 255, 255, 0.24) 50%, transparent 75%);
      transform: translateX(-130%);
      transition: transform 0.65s ease;

  <script>
    /* =========================================================================
       0. GENERADOR QR SVG NATIVO (0 DEPENDENCIAS EXTERNAS, FUNCIONA OFFLINE)
       ========================================================================= */
    const NativeQR = (() => {
      const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
      for (let i = 0, x = 1; i < 255; i++) {
        EXP[i] = x; LOG[x] = i;
        x = (x << 1) ^ (x & 128 ? 0x11d : 0);
      }
      for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];

      function gfMul(a, b) { return a && b ? EXP[LOG[a] + LOG[b]] : 0; }
      function rsGenPoly(ecLen) {
        let poly = [1];
        for (let i = 0; i < ecLen; i++) {
          const next = new Array(poly.length + 1).fill(0);
          for (let j = 0; j < poly.length; j++) {
            next[j] ^= poly[j];
            next[j + 1] ^= gfMul(poly[j], EXP[i]);
          }
          poly = next;
        }
        return poly;
      }
      function rsEncode(data, ecLen) {
        const gen = rsGenPoly(ecLen);
        const res = new Uint8Array(data.length + ecLen);
        res.set(data);
        for (let i = 0; i < data.length; i++) {
          const coef = res[i];
          if (coef) {
            for (let j = 0; j < gen.length; j++) res[i + j] ^= gfMul(gen[j], coef);
          }
        }
        return res.slice(data.length);
      }

      const VERSIONS = [
        null,
        { size: 21, dataBytes: 19, ecBytes: 7, align: [] },
        { size: 25, dataBytes: 34, ecBytes: 10, align: [6, 18] },
        { size: 29, dataBytes: 55, ecBytes: 15, align: [6, 22] },
        { size: 33, dataBytes: 80, ecBytes: 20, align: [6, 26] },
        { size: 37, dataBytes: 108, ecBytes: 26, align: [6, 30] },
        { size: 41, dataBytes: 136, ecBytes: 36, align: [6, 34] }
      ];

      function toSvg(text) {
        const bytes = new TextEncoder().encode(text);
        let ver = 1;
        while (ver <= 6 && VERSIONS[ver].dataBytes < bytes.length + 2) ver++;
        if (ver > 6) ver = 6;
        const cfg = VERSIONS[ver];
        const size = cfg.size;

        const bits = [];
        const pushBits = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
        pushBits(0b0100, 4);
        const maxPayload = cfg.dataBytes - 2;
        const payload = bytes.slice(0, maxPayload);
        pushBits(payload.length, 8);
        payload.forEach(b => pushBits(b, 8));
        pushBits(0, Math.min(4, cfg.dataBytes * 8 - bits.length));
        while (bits.length % 8 !== 0) bits.push(0);
        const padBytes = [0xec, 0x11];
        let pIdx = 0;
        while (bits.length < cfg.dataBytes * 8) {
          pushBits(padBytes[pIdx % 2], 8);
          pIdx++;
        }
        const dataArr = new Uint8Array(cfg.dataBytes);
        for (let i = 0; i < cfg.dataBytes; i++) {
          let b = 0;
          for (let j = 0; j < 8; j++) b = (b << 1) | bits[i * 8 + j];
          dataArr[i] = b;
        }
        const ecArr = rsEncode(dataArr, cfg.ecBytes);
        const allBytes = new Uint8Array(dataArr.length + ecArr.length);
        allBytes.set(dataArr);
        allBytes.set(ecArr, dataArr.length);

        const mod = Array.from({ length: size }, () => new Int8Array(size));
        const fixed = Array.from({ length: size }, () => new Uint8Array(size));

        const setFixed = (r, c, dark) => {
          if (r >= 0 && r < size && c >= 0 && c < size) {
            mod[r][c] = dark ? 1 : -1;
            fixed[r][c] = 1;
          }
        };

        const placeFinder = (r0, c0) => {
          for (let r = -1; r <= 7; r++) {
            for (let c = -1; c <= 7; c++) {
              const inBox = r >= 0 && r <= 6 && c >= 0 && c <= 6;
              const dark = inBox && (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4));
              setFixed(r0 + r, c0 + c, dark);
            }
          }
        };
        placeFinder(0, 0);
        placeFinder(0, size - 7);
        placeFinder(size - 7, 0);

        if (cfg.align.length) {
          const pos = cfg.align[cfg.align.length - 1];
          for (let r = -2; r <= 2; r++) {
            for (let c = -2; c <= 2; c++) {
              const dark = Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0);
              setFixed(pos + r, pos + c, dark);
            }
          }
        }

        for (let i = 8; i < size - 8; i++) {
          setFixed(6, i, i % 2 === 0);
          setFixed(i, 6, i % 2 === 0);
        }

        for (let i = 0; i < 9; i++) {
          if (!fixed[8][i]) setFixed(8, i, false);
          if (!fixed[i][8]) setFixed(i, 8, false);
        }
        for (let i = 0; i < 8; i++) {
          setFixed(8, size - 1 - i, false);
          setFixed(size - 1 - i, 8, false);
        }
        setFixed(size - 8, 8, true);

        let bitIdx = 0;
        const totalBits = allBytes.length * 8;
        let dir = -1;
        for (let col = size - 1; col > 0; col -= 2) {
          if (col === 6) col--;
          for (let step = 0; step < size; step++) {
            const row = dir === -1 ? size - 1 - step : step;
            for (let dx = 0; dx < 2; dx++) {
              const c = col - dx;
              if (!fixed[row][c]) {
                let bit = 0;
                if (bitIdx < totalBits) {
                  bit = (allBytes[bitIdx >> 3] >> (7 - (bitIdx & 7))) & 1;
                  bitIdx++;
                }
                const masked = bit ^ (((row + c) % 2 === 0) ? 1 : 0);
                mod[row][c] = masked ? 1 : -1;
              }
            }
          }
          dir = -dir;
        }

        const fmt = 0b111011111000100;
        const fmtCoords1 = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
        const fmtCoords2 = [[size-1,8],[size-2,8],[size-3,8],[size-4,8],[size-5,8],[size-6,8],[size-7,8],[8,size-8],[8,size-7],[8,size-6],[8,size-5],[8,size-4],[8,size-3],[8,size-2],[8,size-1]];
        for (let i = 0; i < 15; i++) {
          const b = (fmt >> (14 - i)) & 1;
          mod[fmtCoords1[i][0]][fmtCoords1[i][1]] = b ? 1 : -1;
          mod[fmtCoords2[i][0]][fmtCoords2[i][1]] = b ? 1 : -1;
        }

        const pad = 2;
        const total = size + pad * 2;
        let rects = '';
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (mod[r][c] === 1) {
              rects += `<rect x="${c + pad}" y="${r + pad}" width="1" height="1"/>`;
            }
          }
        }
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges"><rect width="${total}" height="${total}" fill="#ffffff"/><g fill="#05060b">${rects}</g></svg>`;
      }

      return { toSvg };
    })();

    /* =========================================================================
       1. SEGURIDAD (XSS), UTILIDADES, AUDIO SINTETIZADO Y WAKE LOCK
       ========================================================================= */
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function uid() {
      return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = '';
      for (let i = 0; i < 4; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }

    function vibrate(ms = 20) {
      try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
    }

    let wakeLockSentinel = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLockSentinel) {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
        }
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    let soundEnabled = true;
    let audioCtx = null;
    function playTone(freq = 520, duration = 0.09, type = 'sine', vol = 0.08) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playFanfare() {
      playTone(523.25, 0.12, 'triangle', 0.1);
      setTimeout(() => playTone(659.25, 0.12, 'triangle', 0.1), 110);
      setTimeout(() => playTone(783.99, 0.25, 'triangle', 0.12), 220);
    }

    /* =========================================================================
       2. CONTENIDO DEL JUEGO (se carga desde "contenido.js" · editable aparte)
       -------------------------------------------------------------------------
       · Si "contenido.js" está junto al HTML, se usa ese contenido (edítalo
         sin tocar el juego y recarga).
       · Si no existe o tiene un error, el juego arranca con un contenido mínimo

       · Los botones de mazo se generan solos: añade uno en contenido.js y
         aparecerá en la TV sin tocar nada más.
       ========================================================================= */
    var CONTENT_WARNING = '';

    const FALLBACK_CONTENT = {
      decks: {
        general: {
          label: '✨ General (Todos)',
          icon: '✨',
          deckName: 'General · Grupo Completo',

          ],

            { q: '¿Qué prefiere {p1} para unas vacaciones ideales?', a: 'Playa, fiesta y cero horarios', b: 'Viaje cultural y desconexión' }
          ],

          ],

        }

        avatars: ['🔥', '🍻', '😈', '🦊', '👽', '👑', '🏎️', '🎌', '⚡', '🎭', '🐍', '🚀'],
        events: [
          { id: 'double', text: '⚡ EVENTO ALEATORIO: ¡Ronda Doble (x2 puntos / tragos)!' },
          { id: 'swap', text: '🔄 EVENTO ALEATORIO: ¡Todos se cambian un sitio a la derecha!' },

        ],

    };

    const CONTENT_RAW = (typeof window !== 'undefined' && window.PARTY_CONTENT && window.PARTY_CONTENT.decks)
      ? window.PARTY_CONTENT
      : null;
    const CONTENT = (CONTENT_RAW && CONTENT_RAW.decks && CONTENT_RAW.decks.general) ? CONTENT_RAW : FALLBACK_CONTENT;
    if (!(CONTENT_RAW && CONTENT_RAW.decks && CONTENT_RAW.decks.general)) {
      CONTENT_WARNING = '⚠️ No se encontró "contenido.js": se usa el contenido de respaldo.';
    }

    // Un mazo hereda del GENERAL todo lo que no defina (trivia, dilemas...).
    // Si define "quien", esas preguntas sustituyen a las del general.
    function mergeDeck(base, deck) {
      const out = { ...base };
      if (!deck || typeof deck !== 'object') return out;
      Object.keys(deck).forEach(k => {
        const v = deck[k];
        if (v === undefined || v === null) return;
        if (k === 'quien' && Array.isArray(v) && v.length === 0) return;
        out[k] = v;
      });
      return out;
    }

    const DEFAULT_CONTENT = mergeDeck(CONTENT.decks.general, null);

    const THEMATIC_DECKS = (() => {
      const out = { general: DEFAULT_CONTENT };
      Object.keys(CONTENT.decks || {}).forEach(id => {
        if (id === 'general') return;
        const d = CONTENT.decks[id];
        if (!d || typeof d !== 'object') return;
        out[id] = mergeDeck(CONTENT.decks.general, d);
      });
      return out;
    })();

    const DECK_ORDER = Object.keys(THEMATIC_DECKS);

    const SHARED = CONTENT.shared || {};
    const DARES_LIST = (Array.isArray(SHARED.dares) && SHARED.dares.length) ? SHARED.dares : FALLBACK_CONTENT.shared.dares;
    const AVATARS = (Array.isArray(SHARED.avatars) && SHARED.avatars.length) ? SHARED.avatars : FALLBACK_CONTENT.shared.avatars;
    const EVENTS_LIST = (Array.isArray(SHARED.events) && SHARED.events.length) ? SHARED.events : FALLBACK_CONTENT.shared.events;
    const ESCRIBIO_BOTS = (Array.isArray(SHARED.escribioBots) && SHARED.escribioBots.length) ? SHARED.escribioBots : FALLBACK_CONTENT.shared.escribioBots;

    // Firma del contenido: si cambias contenido.js, el mazo que el navegador
    // tenía guardado se descarta para que se vean los cambios nuevos.
    function contentSignature() {
      try {
        const s = JSON.stringify(CONTENT);
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
        return s.length + '-' + (h >>> 0);
      } catch (e) { return '0'; }
    }

    function penalty(n = 1) {
      const mode = roomState?.penaltyMode || 'drink';
      if (mode === 'drink') return `🍻 Bebe ${n} trago${n > 1 ? 's' : ''}`;
      if (mode === 'points') return `🏆 +${n} punto${n > 1 ? 's' : ''}`;
      const dare = pickFreshItem('dares', DARES_LIST, d => d) || DARES_LIST[0];
      return `🎲 Reto: ${dare}`;
    }

    // La penalización visible también refleja el evento de Ronda Doble.
    // Se cachea por ronda para que el reto no cambie en cada repintado de la TV.
    let roundPenaltyCache = { key: '', text: '' };
    function eventPenalty(n = 1) {
      const mult = roomState?.activeEvent?.id === 'double' ? 2 : 1;
      const key = [
        roomState?.code || '',
        roomState?.round || 0,
        roomState?.game || '',
        n,
        mult,
        roomState?.penaltyMode || 'drink'
      ].join('|');
      if (roundPenaltyCache.key === key) return roundPenaltyCache.text;
      const text = penalty(n * mult);
      roundPenaltyCache = { key, text };
      return text;
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      } catch (e) {
        return false;
      }
    }

    /* =========================================================================
       4. MOTOR DE RED (MQTT CON FAILOVER ACTIVO + BROADCASTCHANNEL)
       ========================================================================= */
    function initNetwork() {
      try {
        bc = new BroadcastChannel(TOPIC_PREFIX);
        bc.onmessage = (ev) => {
          if (ev.data) handleIncomingPacket(ev.data.topic, ev.data.payload);
        };
      } catch (e) {}
      connectMqtt();
      // Si la librería MQTT tarda en cargar, se reintenta la conexión.
      [1500, 4000, 8000].forEach(delay => setTimeout(() => {
        if (typeof mqtt !== 'undefined' && !mqttClient && !mqttRaceClients.length) connectMqtt();
      }, delay));
    }

    function connectMqtt() {
      if (typeof mqtt === 'undefined') {
        updateConnectionHUD(false, 'Sin MQTT · Modo local / Pasar Móvil');
        return;
      }

      const gen = ++mqttGeneration;
      mqttRaceClients.forEach(closeMqttClient);
      mqttRaceClients = [];
      if (mqttClient) { closeMqttClient(mqttClient); mqttClient = null; }
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

      updateConnectionHUD(false, 'Conectando…');

      // Carrera en paralelo: abrimos los 3 brokers a la vez y nos quedamos
      // con el primero que responde. Así la partida arranca rapidísimo
      // aunque alguno de los brokers públicos esté caído o muy lento.
      let settled = false;
      const clients = BROKERS.map(url => {
        const client = mqtt.connect(url, {
          clientId: 'pos_' + uid(),
          clean: true,
          connectTimeout: 8000,
          reconnectPeriod: 0
        });
        client.on('error', () => {});

        client.on('connect', () => {
          if (gen !== mqttGeneration) { closeMqttClient(client); return; }
          if (settled) { closeMqttClient(client); return; }
          settled = true;
          mqttClient = client;
          mqttRaceClients = clients;
          mqttRetryDelay = 1500;
          updateConnectionHUD(true, 'En vivo · Sincronizado');
          resubscribeActiveTopics();
          clients.forEach(c => { if (c !== client) closeMqttClient(c); });
        });

        client.on('close', () => {
          if (gen !== mqttGeneration) return; // conexión antigua: ignorada
          if (mqttClient === client) {
            mqttClient = null;
            updateConnectionHUD(false, 'Reconectando…');
            scheduleMqttRetry();
          } else if (!settled) {
            // Ningún broker respondió: reintentamos con backoff suave.
            scheduleMqttRetry();
          }
        });

        client.on('message', (topic, message) => {
          if (client !== mqttClient) return;
          try {
            const data = JSON.parse(message.toString());
            handleIncomingPacket(topic, data);
          } catch (e) {}
        });

        return client;
      });
      mqttRaceClients = clients;
    }

    function closeMqttClient(client) {
      try {
        client.removeAllListeners('error');
        client.on('error', () => {});
        client.end(true);
      } catch (e) {}
    }

    function scheduleMqttRetry() {
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        mqttRetryDelay = Math.min(Math.round(mqttRetryDelay * 1.7), 12000);
        connectMqtt();
      }, mqttRetryDelay);
    }

    function resubscribeActiveTopics() {
      if (!mqttClient || !mqttClient.connected) return;
      if ((viewMode === 'tv' || viewMode === 'solo_test') && roomState) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${roomState.code}/inbox`);
        mqttClient.subscribe(`${TOPIC_PREFIX}/${roomState.code}/avatars`);
        broadcastRoomState();
      }
      if ((viewMode === 'mobile_play' || viewMode === 'mobile_join') && mySession.roomCode) {
        mqttClient.subscribe(`${TOPIC_PREFIX}/${mySession.roomCode}/state`);
        mqttClient.subscribe(`${TOPIC_PREFIX}/${mySession.roomCode}/avatars`);
        if (mySession.playerId) {
          mqttClient.subscribe(`${TOPIC_PREFIX}/${mySession.roomCode}/p/${mySession.playerId}`);
        }
        sendToTvInbox({ type: 'REQUEST_STATE', playerId: mySession.playerId });
        // Si aún no ha entrado en la sala, reenviamos el JOIN al reconectar.
        if (viewMode === 'mobile_join') {
          sendToTvInbox({
            type: 'JOIN',
            player: {
              id: mySession.playerId,
              name: mySession.playerName,
              avatar: mySession.avatar,
              isHost: mySession.isHostController
            }
          });
        } else {
          startMobileHeartbeat();
        }
      }
    }

    function publishPacket(topic, payload, retain = false) {
      if (bc) {
        try { bc.postMessage({ topic, payload }); } catch (e) {}
      }
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(topic, JSON.stringify(payload), { qos: 0, retain });
      }
    }

    /* =========================================================================

      impostor: {
        name: 'El Impostor',

        start(state, privateMap) {
          const allPairs = Object.entries(activeContent.impostor).flatMap(([cat, pairs]) =>
            pairs.map(pair => ({ cat, pair }))
          );
          const chosenPair = pickFreshItem('impostor', allPairs, x => `${x.cat}|${x.pair[0]}|${x.pair[1]}`) || {
            cat: 'General',
            pair: ['Palabra secreta', 'Palabra parecida']
          };
          const catName = chosenPair.cat;
          const realWord = chosenPair.pair[0];
          const decoyWord = chosenPair.pair[1];

          const variant = state.impostorVariant || 'classic';
          const eligible = [...state.players];
          const shuffled = shuffle(eligible);
          const impCount = (variant === 'double' && eligible.length >= 4) ? 2 : 1;
          const impostorIds = shuffled.slice(0, impCount).map(p => p.id);

          const turnOrder = shuffle(eligible).map(p => ({ id: p.id, name: p.name }));

          eligible.forEach(p => {
            const isImp = impostorIds.includes(p.id);
            let secretRole = 'innocent';
            let secretWord = realWord;
            let secretCat = catName;

            if (isImp) {
              if (variant === 'mrwhite') {
                secretRole = 'mrwhite';
                secretWord = '??? (MR. WHITE)';
                secretCat = 'OCULTA';
              } else if (variant === 'similar') {
                secretRole = 'innocent';
                secretWord = decoyWord;
              } else {
                secretRole = 'impostor';
                secretWord = 'ERES EL IMPOSTOR';
              }
            }
            privateMap[p.id] = {
              game: 'impostor',
              role: secretRole,
              word: secretWord,
              category: secretCat
            };
          });

          state.currentData = {
            category: variant === 'mrwhite' ? 'OCULTA (MR. WHITE)' : catName,

            turnOrder,
            turnIdx: 0,

            revealedWord: null,

          Object.values(state.votes).forEach(v => {
            if (v && v !== '__PASS__') counts[v] = (counts[v] || 0) + 1;
          });
          const max = Math.max(0, ...Object.values(counts));
          const caught = d.revealedImpostorIds.some(id => max > 0 && counts[id] === max);

          if (caught) {
            state.phase = 'last_bullet';
            d.lastBulletEndsAt = Date.now() + 18000;
            d.caught = true;
            state.players.forEach(p => {
              if (!d.revealedImpostorIds.includes(p.id)) awardPoints(state, p, 1);

            d.caught = false;
            d.revealedImpostorIds.forEach(id => {

              if (v !== undefined && counts[v] === max) {
                awardPoints(state, p, 1);
                p.stats.groupMatches = (p.stats.groupMatches || 0) + 1;
              }
            });
          }
        }
      },

      teconozco: {

      trivia: {
        name: 'Trivia Rápida',

        desc: 'Anime, motor, gaming y cultura general en 15s.',
        minPlayers: 1,
        rules: 'Responde lo más rápido posible en tu móvil. Acertar en los primeros 5 segundos suma puntos dobles.',
        start(state) {

        },

          state.players.forEach(p => {
            if (String(state.votes[p.id]) === String(d.correct)) {
              const elapsed = Math.max(0, (d.voteTimes[p.id] || d.endsAt) - d.startAt);

      dilemas: {
        name: 'Dilemas Extremos',

        minPlayers: 2,

        start(state) {
          const item = pickFreshItem('dilemas', activeContent.dilemas, d => d.a + '|' + d.b) || activeContent.dilemas[0];
          state.currentData = { ...item };
          state.activeTheme = 'dilemas';
          state.phase = 'voting';

          const bCount = state.players.filter(p => state.votes[p.id] === 'B').length;
          const majority = aCount >= bCount ? 'A' : 'B';

      yonunca: {

      verdad: {

        start(state, privateMap) {
          const accused = pickFairQueuePlayer(state, 'truthQueue');
          const prompt = pickFreshItem('verdad', activeContent.verdad, t => t) || 'Cuenta una anécdota...';
          const isTruth = Math.random() < 0.5;

          privateMap[accused.id] = {

            prompt
          };

          state.currentData = {
            accusedId: accused.id,
            accusedName: accused.name,

          };

          state.phase = 'voting';
        },
        validateVote(state, playerId, val) {
          if (playerId === state.currentData.accusedId) return false;
          return val === 'VERDAD' || val === 'TROLA' || val === '__PASS__';
        },
        botVote() { return Math.random() < 0.5 ? 'VERDAD' : 'TROLA'; },
        reveal(state) {
          const d = state.currentData;
          d.revealedIsTruth = d._secretIsTruth;
          const correctChoice = d.revealedIsTruth ? 'VERDAD' : 'TROLA';
          let fooledCount = 0;
          state.players.forEach(p => {
            if (p.id !== d.accusedId) {
              if (state.votes[p.id] === correctChoice) {
                awardPoints(state, p, 1);
                p.stats.truthsGuessed = (p.stats.truthsGuessed || 0) + 1;
              } else if (state.votes[p.id] === 'VERDAD' || state.votes[p.id] === 'TROLA') {
                fooledCount++;
              }
            }
          });
          if (fooledCount > 0) {
            const acc = state.players.find(p => p.id === d.accusedId);
            if (acc) awardPoints(state, acc, 1);

        }
